name: LB-1 structural repair

on:
  push:
    branches:
      - agent/lb1-proyecto-compilable

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lb1-proyecto-compilable
          fetch-depth: 0

      - name: Repair structural syntax and knowledge YAML
        shell: python
        run: |
          from pathlib import Path
          import re

          ROOT = Path('.')

          # Resolve the known premature class closures without replacing the
          # implementations. The affected files contain a class method block,
          # an early closing brace, and then the remaining methods at top level.
          class_files = [
              'src/application/workflows/QuestionFlowEngine.ts',
              'src/bootstrap/ArchitectureBootstrap.ts',
              'src/domain/clauses/ClauseGeneratorEngine.ts',
              'src/domain/conocimiento/KnowledgeEngine.ts',
              'src/domain/container/DependencyContainer.ts',
              'src/domain/cpv/CPVEngine.ts',
              'src/domain/diagnostics/DiagnosticsCenter.ts',
              'src/domain/events/EventBus.ts',
              'src/domain/legal/LegalReasoner.ts',
              'src/domain/legal/LegalReferenceEngine.ts',
              'src/domain/pcap/PCAPGeneratorEngine.ts',
              'src/domain/plugins/PluginManager.ts',
              'src/domain/rules/RuleEngine.ts',
              'src/domain/rules/RuleEvaluatorEngine.ts',
              'src/domain/rules/solvency/ClassificationRule.ts',
              'src/domain/validation/ValidationFramework.ts',
              'src/domain/knowledge/catalogs/CoreKnowledgeConcepts.ts',
              'src/infrastructure/ai/AIManager.ts',
              'src/domain/resolvers/AwardCriteriaResolver.ts',
          ]

          for rel in class_files:
              p = ROOT / rel
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')

              # Never alter merge conflict blocks heuristically. Leave them
              # visible for the dedicated pass below unless they are the exact
              # standard marker form.
              if '<<<<<<<' in s or '=======' in s or '>>>>>>>' in s:
                  continue

              # A recurring corruption pattern in this repository is a class
              # closed immediately after its configure/initialization method,
              # followed by methods that clearly belong to that same class.
              # Remove only that premature closure when the following block is
              # a class member declaration and another final class closure exists.
              patterns = [
                  r'(private configure\(\):\s*void\s*\{[\s\S]*?\n\}\n)\n(    /\*\*[\s\S]*?\n     \*\s*=+\n     \*/\n\n    (?:public|private|protected)\s+)',
                  r'(private initialize\(\):\s*void\s*\{[\s\S]*?\n\}\n)\n(    /\*\*[\s\S]*?\n     \*\s*=+\n     \*/\n\n    (?:public|private|protected)\s+)',
              ]
              original = s
              for pattern in patterns:
                  s = re.sub(pattern, r'\1\n\2', s, count=1)

              # Generic safe form: if a closing brace is immediately followed
              # by an indented member declaration, remove that closure once.
              if s == original:
                  m = re.search(r'\n\}\n\n(?=    (?:public|private|protected)\s+)', s)
                  if m and s.count('\n}') >= 2:
                      s = s[:m.start()] + '\n\n' + s[m.end():]

              # QuestionFlowEngine contains two initializeQuestions methods,
              # one being an obsolete TODO fragment. Keep the implemented one.
              if rel.endswith('QuestionFlowEngine.ts'):
                  s = re.sub(
                      r'\n    /\*\*\n     \* Inicializa el catálogo de preguntas\.\n[\s\S]*?\n    private initializeQuestions\(\): void \{\n\n        // TODO\n\n    \}\n',
                      '\n', s, count=1)

              if s != original:
                  p.write_text(s, encoding='utf-8')

          # Knowledge rule files: preserve every rule block and its content.
          # The broken form has a top-level sequence item where the established
          # schema expects a rules collection. Wrap only those sequence items;
          # do not add legal substance or delete rules.
          knowledge_files = [
              'knowledge/rules/criterios.rules.yaml',
              'knowledge/rules/documentos.rules.yaml',
              'knowledge/rules/ejecucion.rules.yaml',
              'knowledge/rules/evaluacion.rules.yaml',
              'knowledge/rules/extincion.rules.yaml',
              'knowledge/rules/pliegos.rules.yaml',
          ]

          for rel in knowledge_files:
              p = ROOT / rel
              if not p.exists():
                  continue
              lines = p.read_text(encoding='utf-8').splitlines()
              # Only repair the first invalid top-level rule sequence if the
              # existing schema has a rules key available elsewhere in the file.
              first_rule = next((i for i, line in enumerate(lines) if re.match(r'^-\s+id\s*:', line)), None)
              if first_rule is not None and not any(re.match(r'^rules\s*:', x) for x in lines[:first_rule]):
                  lines.insert(first_rule, 'rules:')
                  i = first_rule + 1
                  while i < len(lines):
                      line = lines[i]
                      if re.match(r'^\S', line) and not line.startswith('#') and not re.match(r'^-\s', line):
                          break
                      if line and not line.startswith('  ') and not line.startswith('#'):
                          lines[i] = '  ' + line
                      elif line.startswith('- '):
                          lines[i] = '  ' + line
                      i += 1
                  p.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          # Report conflicts; do not silently choose a side.
          conflicts = []
          for p in (ROOT / 'src').rglob('*'):
              if p.is_file() and p.suffix in {'.ts', '.tsx', '.mts', '.cts'}:
                  text = p.read_text(encoding='utf-8', errors='replace')
                  if any(marker in text for marker in ('<<<<<<<', '=======', '>>>>>>>')):
                      conflicts.append(str(p))
          if conflicts:
              print('Unresolved merge markers remain:')
              for item in conflicts:
                  print(item)
              raise SystemExit(2)

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src knowledge
          if git diff --cached --quiet; then
            echo 'No repair changes produced.'
            exit 0
          fi
          git commit -m 'fix: recover TypeScript syntax integrity'
          git push origin HEAD:agent/lb1-proyecto-compilable

      - name: Remove one-shot repair workflow
        shell: bash
        run: |
          git rm .github/workflows/lb1-repair-once.yml
          git commit -m 'chore: remove one-shot LB-1 repair workflow'
          git push origin HEAD:agent/lb1-proyecto-compilable
