name: Batch Apply

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "Ruta del manifest JSON"
        required: false
        default: "tools/batch-manifest.json"

permissions:
  contents: write

jobs:
  batch-apply:
    name: Apply batch manifest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify manifest
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          node -e "
          const fs = require('fs');
          const path = process.env.MANIFEST;

          if (!fs.existsSync(path)) {
            console.error('ERROR: No existe el manifest: ' + path);
            process.exit(1);
          }

          const data = JSON.parse(fs.readFileSync(path, 'utf8'));

          if (!data || !Array.isArray(data.files)) {
            console.error('ERROR: El manifest debe contener un array files');
            process.exit(1);
          }

          for (const [i, file] of data.files.entries()) {
            if (!file || typeof file.path !== 'string') {
              console.error('ERROR: Entrada ' + i + ' sin path válido');
              process.exit(1);
            }

            if (typeof file.content !== 'string') {
              console.error('ERROR: Entrada ' + i + ' sin content válido');
              process.exit(1);
            }

            if (
              file.path.startsWith('/') ||
              file.path.includes('../') ||
              file.path === '..'
            ) {
              console.error('ERROR: Ruta no permitida: ' + file.path);
              process.exit(1);
            }
          }

          console.log('Manifest válido');
          console.log('Archivos declarados: ' + data.files.length);
          "

      - name: Apply batch manifest
        env:
          MANIFEST: ${{ inputs.manifest }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const manifestPath = process.env.MANIFEST;
          const manifest = JSON.parse(
            fs.readFileSync(manifestPath, 'utf8')
          );

          let created = 0;
          let updated = 0;
          let unchanged = 0;

          for (const file of manifest.files) {
            const target = path.resolve(file.path);

            const relative = path.relative(
              process.cwd(),
              target
            );

            if (
              relative.startsWith('..') ||
              path.isAbsolute(relative)
            ) {
              throw new Error(
                `Ruta fuera del repositorio: ${file.path}`
              );
            }

            fs.mkdirSync(path.dirname(target), {
              recursive: true
            });

            if (fs.existsSync(target)) {
              const previous = fs.readFileSync(
                target,
                'utf8'
              );

              if (previous === file.content) {
                unchanged++;
                console.log(`UNCHANGED ${file.path}`);
                continue;
              }

              fs.writeFileSync(
                target,
                file.content,
                'utf8'
              );

              updated++;
              console.log(`UPDATED   ${file.path}`);
              continue;
            }

            fs.writeFileSync(
              target,
              file.content,
              'utf8'
            );

            created++;
            console.log(`CREATED   ${file.path}`);
          }

          console.log('');
          console.log('==============================');
          console.log('BATCH APPLICATION');
          console.log('==============================');
          console.log(`Created:   ${created}`);
          console.log(`Updated:   ${updated}`);
          console.log(`Unchanged: ${unchanged}`);
          console.log('==============================');
          NODE

      - name: Show changed files
        run: |
          echo "Cambios detectados:"
          git status --short

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No hay cambios que confirmar."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "build: apply batch manifest"

          git push
