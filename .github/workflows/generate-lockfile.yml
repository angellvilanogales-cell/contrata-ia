name: Generate package-lock

on:
  push:
    branches:
      - agent/lb1-proyecto-compilable

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout LB-1 branch
        uses: actions/checkout@v4
        with:
          ref: agent/lb1-proyecto-compilable
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate package-lock.json
        run: npm install --package-lock-only

      - name: Commit package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package-lock.json

          if git diff --cached --quiet; then
            echo "No package-lock.json changes detected."
            exit 0
          fi

          git commit -m "build: generate npm lockfile [skip ci]"
          git push origin agent/lb1-proyecto-compilable
