name: Contrata-IA CI

on:
  push:
    branches:
      - agent/lb1-proyecto-compilable
      - agent/lb2-arquitectura-canonica
      - agent/lb3-recorrido-vertical
  pull_request:
    branches:
      - main
      - agent/lb1-proyecto-compilable
      - agent/lb2-arquitectura-canonica
      - agent/lb3-recorrido-vertical
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-imports:
    name: Audit relative imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit:imports

  audit-architecture:
    name: Validate canonical architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit:architecture

  audit-knowledge:
    name: Validate knowledge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit:knowledge
      - run: npm run audit:knowledge:integrity

  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  tests:
    name: Unit and vertical tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Production build and vertical smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Smoke test application start
        run: npm start
      - name: Execute LB-3 vertical flow
        run: npm run demo:vertical
