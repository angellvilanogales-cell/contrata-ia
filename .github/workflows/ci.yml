name: Contrata-IA CI

on:
  push:
    branches:
      - agent/lb1-proyecto-compilable
  pull_request:
    branches:
      - main
      - agent/lb1-proyecto-compilable
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-knowledge-structure:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/lb1-proyecto-compilable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lb1-proyecto-compilable
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Move misplaced KnowledgeEngine interfaces outside the class
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/domain/conocimiento/KnowledgeEngine.ts')
          s=p.read_text(encoding='utf-8')
          if re.search(r'(?m)^\s*(<<<<<<<.*|=======|>>>>>>>.*)\s*$', s):
              raise SystemExit('Real merge marker found; refusing automatic resolution.')
          cm=re.search(r'export class KnowledgeEngine\s*\{',s)
          if not cm: raise SystemExit('KnowledgeEngine class not found')
          def close(src,o):
              d=0;i=o;st='c'
              while i<len(src):
                  c=src[i];n=src[i+1] if i+1<len(src) else ''
                  if st=='c':
                      if c=='/' and n=='/': st='l';i+=2;continue
                      if c=='/' and n=='*': st='b';i+=2;continue
                      if c=='"': st='d';i+=1;continue
                      if c=="'": st='q';i+=1;continue
                      if c=='`': st='t';i+=1;continue
                      if c=='{': d+=1
                      elif c=='}':
                          d-=1
                          if d==0:return i
                      i+=1;continue
                  if st=='l':
                      if c=='\n':st='c'
                      i+=1;continue
                  if st=='b':
                      if c=='*' and n=='/':st='c';i+=2;continue
                      i+=1;continue
                  if st in ('d','q'):
                      if c=='\\':i+=2;continue
                      if (st=='d' and c=='"') or (st=='q' and c=="'"):st='c'
                      i+=1;continue
                  if st=='t':
                      if c=='\\':i+=2;continue
                      if c=='`':st='c'
                      i+=1
              return None
          start=cm.start();pos=cm.end();blocks=[]
          while True:
              m=re.search(r'export interface\s+[A-Za-z0-9_]+\s*\{',s[pos:])
              if not m:break
              a=pos+m.start();o=pos+m.end()-1;b=close(s,o)
              if b is None:raise SystemExit('Unclosed interface')
              blocks.append((a,b+1,s[a:b+1]));pos=b+1
          if not blocks:raise SystemExit('No misplaced interfaces found')
          for a,b,_ in reversed(blocks):s=s[:a]+s[b:]
          cm=re.search(r'export class KnowledgeEngine\s*\{',s)
          s=s[:cm.start()]+'\n\n'.join(x[2] for x in blocks)+'\n\n\n'+s[cm.start():]
          p.write_text(s,encoding='utf-8')
          print('Moved',len(blocks),'interfaces')
          PY
      - name: Commit repair and restore canonical CI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/ci.yml');s=p.read_text(encoding='utf-8')
          a=s.index('  repair-knowledge-structure:\n');b=s.index('  audit-imports:\n',a)
          s=s[:a]+s[b:]
          s=s.replace('permissions:\n  contents: write\n','permissions:\n  contents: read\n',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/domain/conocimiento/KnowledgeEngine.ts .github/workflows/ci.yml
          git diff --cached --check
          git commit -m 'fix: recover knowledge engine interface structure'
          git push origin HEAD:agent/lb1-proyecto-compilable

  audit-imports:
    name: Audit relative imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit:imports

  audit-knowledge:
    name: Validate knowledge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit:knowledge
      - run: npm run audit:knowledge:integrity

  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
