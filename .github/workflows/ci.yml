name: Contrata-IA CI

on:
  push:
    branches:
      - agent/lb1-proyecto-compilable
  pull_request:
    branches:
      - main
      - agent/lb1-proyecto-compilable
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-knowledge-engine-once:
    name: Recover KnowledgeEngine structure once
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/lb1-proyecto-compilable' && !contains(github.event.pull_request.head.sha, 'fix: recover knowledge engine structure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lb1-proyecto-compilable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Recover KnowledgeEngine structure
        run: node scripts/repair-knowledge-engine-once.mjs
      - name: Commit repaired KnowledgeEngine and restore CI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout HEAD -- .github/workflows/ci.yml
          rm scripts/repair-knowledge-engine-once.mjs
          git add src/domain/conocimiento/KnowledgeEngine.ts .github/workflows/ci.yml
          git add -u scripts/repair-knowledge-engine-once.mjs
          if git diff --cached --quiet; then
            echo "No structural repair produced"
            exit 1
          fi
          git commit -m "fix: recover knowledge engine structure"
          git push origin HEAD:agent/lb1-proyecto-compilable

  audit-imports:
    name: Audit relative imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit:imports

  audit-knowledge:
    name: Validate knowledge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit:knowledge
      - run: npm run audit:knowledge:integrity

  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
