name: Contrata-IA CI

on:
  push:
    branches:
      - agent/lb1-proyecto-compilable
      - agent/lb2-arquitectura-canonica
      - agent/lb3-recorrido-vertical
      - agent/lb4-motor-normativo
      - agent/lb5-documentos-administrativos
      - agent/lb6-api-ui-integracion
      - agent/lb7-qa-seguridad-v1
  pull_request:
    branches:
      - main
      - agent/lb1-proyecto-compilable
      - agent/lb2-arquitectura-canonica
      - agent/lb3-recorrido-vertical
      - agent/lb4-motor-normativo
      - agent/lb5-documentos-administrativos
      - agent/lb6-api-ui-integracion
      - agent/lb7-qa-seguridad-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-imports:
    name: Audit relative imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit:imports

  audit-architecture:
    name: Validate canonical architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit:architecture

  audit-knowledge:
    name: Validate knowledge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit:knowledge
      - run: npm run audit:knowledge:integrity

  audit-normative:
    name: Validate LB-4 normative pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit:normative

  audit-documents:
    name: Validate LB-5 document model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit:documents

  audit-lb6:
    name: Validate LB-6 dual intake and interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit:lb6

  audit-lb7:
    name: Validate LB-7 operations and security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run audit:lb7

  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  tests:
    name: Unit, vertical, normative, document, intake and security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Production build and end-to-end smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Smoke test application start
        run: npm start
      - name: Execute LB-3 vertical flow
        run: npm run demo:vertical
      - name: Execute LB-4 normative MVP
        run: npm run demo:lb4
      - name: Generate LB-5 administrative documents
        run: npm run demo:lb5
      - name: Execute LB-6 dual intake demo
        run: npm run demo:lb6
      - name: Smoke test authenticated API, persistence and backup
        env:
          CONTRATA_IA_AUTH_REQUIRED: "1"
          CONTRATA_IA_ADMIN_TOKEN: "ci-lb7-admin-token"
          CONTRATA_IA_DATA_DIR: "/tmp/contrata-ia-lb7"
        run: |
          rm -rf "$CONTRATA_IA_DATA_DIR"
          start_server() {
            npm run serve > /tmp/contrata-ia-lb7.log 2>&1 &
            SERVER_PID=$!
            for i in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:3000/api/health > /tmp/health.json; then return 0; fi
              sleep 0.25
            done
            cat /tmp/contrata-ia-lb7.log
            return 1
          }
          start_server
          test "$(curl --silent -o /tmp/unauth.json -w '%{http_code}' http://127.0.0.1:3000/api/questions)" = "401"
          curl --fail --silent -H "Authorization: Bearer $CONTRATA_IA_ADMIN_TOKEN" http://127.0.0.1:3000/api/questions > /tmp/questions.json
          grep -q 'contractingAuthority' /tmp/questions.json
          curl --fail --silent http://127.0.0.1:3000/ | grep -q 'Nuevo expediente guiado'
          curl --fail --silent -X POST -H "Authorization: Bearer $CONTRATA_IA_ADMIN_TOKEN" -H 'Content-Type: application/json' -d '{"mode":"GUIDED"}' http://127.0.0.1:3000/api/cases > /tmp/case.json
          CASE_ID=$(node -e "const fs=require('fs');process.stdout.write(JSON.parse(fs.readFileSync('/tmp/case.json','utf8')).id)")
          test -n "$CASE_ID"
          kill $SERVER_PID
          wait $SERVER_PID 2>/dev/null || true
          start_server
          curl --fail --silent -H "Authorization: Bearer $CONTRATA_IA_ADMIN_TOKEN" "http://127.0.0.1:3000/api/cases/$CASE_ID" > /tmp/restored.json
          grep -q "$CASE_ID" /tmp/restored.json
          curl --fail --silent -X POST -H "Authorization: Bearer $CONTRATA_IA_ADMIN_TOKEN" http://127.0.0.1:3000/api/admin/backup > /tmp/backup.json
          grep -q 'backups' /tmp/backup.json
          test -f "$CONTRATA_IA_DATA_DIR/audit/security.jsonl"
          kill $SERVER_PID
          wait $SERVER_PID 2>/dev/null || true
      - name: Verify LB-5 and LB-6 artifacts
        run: |
          test -f artifacts/lb5/manifest.json
          test "$(find artifacts/lb5 -name '*.docx' | wc -l)" -ge 4
          test "$(find artifacts/lb5 -name '*.pdf' | wc -l)" -ge 4
          test -f artifacts/lb6/lb6-manifest.json
          test "$(find artifacts/lb6 -name 'Ficha_Datos_*.docx' | wc -l)" -ge 1
          test "$(find artifacts/lb6 -name '*.docx' | wc -l)" -ge 4
          test "$(find artifacts/lb6 -name '*.pdf' | wc -l)" -ge 3
      - name: Preserve LB-5 document package
        uses: actions/upload-artifact@v4
        with:
          name: lb5-administrative-documents
          path: artifacts/lb5
          if-no-files-found: error
          retention-days: 30
      - name: Preserve LB-6 intake and generated package
        uses: actions/upload-artifact@v4
        with:
          name: lb6-intake-and-documents
          path: artifacts/lb6
          if-no-files-found: error
          retention-days: 30
