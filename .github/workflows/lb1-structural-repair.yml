name: LB1 structural repair

on:
  push:
    branches:
      - agent/lb1-proyecto-compilable
    paths:
      - scripts/lb1-structural-repair.mjs
      - .github/workflows/lb1-structural-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lb1-proyecto-compilable
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Run structural repair
        run: node scripts/lb1-structural-repair.mjs
      - name: Remove one-shot helpers
        run: |
          rm -f scripts/lb1-structural-repair.mjs
          rm -f .github/workflows/lb1-structural-repair.yml
      - name: Commit repaired structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No structural changes produced"
            exit 1
          fi
          git commit -m "fix: recover remaining LB-1 class structures"
          git push origin HEAD:agent/lb1-proyecto-compilable
