name: Vitest diagnostic

on:
  push:
    branches:
      - agent/lb7-qa-seguridad-v1

permissions:
  contents: read

jobs:
  vitest-diagnostic:
    name: Capture exact Vitest failure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run Vitest and preserve exit code
        shell: bash
        run: |
          mkdir -p artifacts/vitest-diagnostic
          set +e
          npx vitest run --reporter=json --outputFile=artifacts/vitest-diagnostic/report.json
          code=$?
          echo "$code" > artifacts/vitest-diagnostic/exit-code.txt
          exit 0
      - name: Upload Vitest diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-diagnostic
          path: artifacts/vitest-diagnostic
          if-no-files-found: error
          retention-days: 1
      - name: Preserve test failure status
        shell: bash
        run: exit "$(cat artifacts/vitest-diagnostic/exit-code.txt)"
