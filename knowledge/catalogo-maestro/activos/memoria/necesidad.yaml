# ==========================================================
# CONTRATA IA
# MÓDULO DE CONOCIMIENTO
# MEMORIA JUSTIFICATIVA
# BLOQUE: NECESIDAD DEL CONTRATO
# ==========================================================

schema: CONTRATAIA.ACTIVO.1.0

identificacion:

  id: MEMORIA.NECESIDAD

  codigo: MEM.NEC

  titulo: Justificación de la necesidad del contrato

  categoria: MEMORIA

  subcategoria: NECESIDAD

  tipo: ACTIVO_DOCUMENTAL

versionado:

  version: 1.0.0

  estado: vigente

  autor: CONTRATA IA

  fechaCreacion: 2026-07-30

  fechaRevision: 2026-07-30

descripcion: >

  Este módulo contiene el conocimiento necesario para construir la
  justificación de la necesidad de un contrato administrativo conforme
  a la Ley 9/2017 de Contratos del Sector Público.

objetivo:

  principal: >

    Justificar documentalmente la existencia de una necesidad pública
    cuya satisfacción requiere la celebración de un contrato.

  secundarios:

    - Garantizar la motivación del expediente.

    - Justificar el interés público.

    - Servir de base para el resto del expediente.

aplicabilidad:

  contratos:

    - servicios

    - suministros

    - obras

    - concesion_servicios

    - concesion_obras

    - mixto

  procedimientos:

    - abierto

    - abierto_simplificado

    - abierto_simplificado_abreviado

    - negociado

    - menor

referenciasNormativas:

  principal:

    ley: Ley 9/2017

    articulo: 28

    descripcion: Necesidad e idoneidad del contrato

  complementarias:

    - Ley 39/2015

    - Ley 40/2015

    - Principios de buena administración

conceptos:

  necesidad:

    descripcion: >

      Carencia objetiva cuya satisfacción resulta imprescindible para
      garantizar el funcionamiento del servicio público.

  interesPublico:

    descripcion: >

      Finalidad pública perseguida mediante la contratación.

  eficiencia:

    descripcion: >

      La solución contractual debe ser la alternativa más eficiente
      para satisfacer la necesidad detectada.

variables:

  necesitaJustificacionInsuficiencia:

    tipo: boolean

    defecto: true

  requiereCPV:

    tipo: boolean

    defecto: true

  admiteLotes:

    tipo: boolean

    defecto: true

dependencias:

  previas:

    - OBJETO

    - UNIDAD_PROPONENTE

  posteriores:

    - CPV

    - PROCEDIMIENTO

    - LOTES

reglasSeleccion:

  - id: NEC-001

    descripcion: >

      Toda memoria deberá incorporar un bloque de necesidad.

    prioridad: 100

  - id: NEC-002

    descripcion: >

      La necesidad deberá describirse de forma objetiva.

    prioridad: 95

  - id: NEC-003

    descripcion: >

      No se admitirán expresiones genéricas sin relación con el objeto
      contractual.

    prioridad: 90

  - id: NEC-004

    descripcion: >

      La necesidad deberá guardar coherencia con el objeto del contrato.

    prioridad: 90

criteriosCalidad:

  claridad:

    obligatorio: true

  concrecion:

    obligatorio: true

  coherencia:

    obligatorio: true

  objetividad:

    obligatorio: true

  motivacion:

    obligatorio: true

variantes:

  generica:

    descripcion: >

      Variante utilizada cuando todavía no se dispone de información
      específica del expediente.

  servicios:

    descripcion: >

      Variante específica para contratos de servicios.

  suministros:

    descripcion: >

      Variante específica para contratos de suministro.

  obras:

    descripcion: >

      Variante específica para contratos de obras.

  concesiones:

    descripcion: >

      Variante específica para concesiones.

bloquesDocumentales:

  introduccion:

    obligatorio: true

  descripcionNecesidad:

    obligatorio: true

  interesPublico:

    obligatorio: true

  conclusion:

    obligatorio: true

textos:

  introduccion:

    base: |

      La presente memoria tiene por objeto justificar la necesidad de
      celebrar el contrato propuesto, de conformidad con lo previsto en
      el artículo 28 de la Ley 9/2017, de 8 de noviembre, de Contratos
      del Sector Público.

  interesPublico:

    base: |

      La actuación proyectada responde a una necesidad vinculada al
      interés público cuya satisfacción resulta imprescindible para el
      adecuado funcionamiento del servicio.

#
# ==========================================================
# VARIANTES DOCUMENTALES
# ==========================================================

redacciones:

  generica:

    titulo: Necesidad genérica

    texto: |

      Se ha identificado una necesidad objetiva cuya satisfacción resulta
      imprescindible para garantizar el correcto funcionamiento de las
      competencias atribuidas al órgano de contratación.

      Dicha necesidad no puede ser atendida adecuadamente mediante los
      recursos actualmente disponibles, siendo necesaria la celebración
      del presente contrato.

      La contratación proyectada constituye la solución más eficiente y
      adecuada para satisfacer el interés público perseguido.

  servicios:

    titulo: Contrato de servicios

    texto: |

      El órgano gestor precisa disponer de servicios especializados para
      asegurar el adecuado desarrollo de las funciones que tiene
      encomendadas.

      La naturaleza técnica de dichas prestaciones exige su ejecución
      mediante contratación externa, garantizando la continuidad del
      servicio y la calidad de las prestaciones.

      La contratación permitirá alcanzar los objetivos previstos con
      criterios de eficacia, eficiencia y racionalización del gasto
      público.

  suministros:

    titulo: Contrato de suministro

    texto: |

      El funcionamiento ordinario de la unidad administrativa requiere el
      suministro de bienes que actualmente no pueden obtenerse mediante
      los recursos disponibles.

      La adquisición de dichos bienes resulta imprescindible para mantener
      la continuidad de la actividad administrativa y garantizar la
      adecuada prestación del servicio público.

  obras:

    titulo: Contrato de obras

    texto: |

      Se ha constatado la necesidad de ejecutar actuaciones materiales
      destinadas a conservar, mejorar o adecuar las infraestructuras
      afectadas.

      Las actuaciones previstas resultan imprescindibles para garantizar
      las condiciones de seguridad, funcionalidad y servicio exigibles.

  concesion:

    titulo: Contrato de concesión

    texto: |

      La gestión indirecta de la prestación permitirá garantizar una mejor
      organización de los recursos públicos manteniendo los niveles de
      calidad exigidos.

#
# ==========================================================
# OBJETIVOS PÚBLICOS
# ==========================================================

objetivosPublicos:

  generales:

    - Garantizar la continuidad del servicio público.

    - Mejorar la eficiencia administrativa.

    - Optimizar los recursos públicos.

    - Incrementar la calidad del servicio.

    - Cumplir las competencias atribuidas al órgano gestor.

  especificos:

    descripcion: >

      Los objetivos específicos deberán adaptarse automáticamente al
      objeto concreto del contrato.

#
# ==========================================================
# CRITERIOS DE REDACCIÓN
# ==========================================================

criteriosRedaccion:

  prohibiciones:

    - Utilizar expresiones genéricas sin contenido.

    - Incluir afirmaciones no justificadas.

    - Repetir literalmente el objeto del contrato.

    - Introducir criterios de adjudicación.

    - Incorporar referencias económicas.

  recomendaciones:

    - Utilizar lenguaje administrativo.

    - Mantener un tono objetivo.

    - Fundamentar todas las afirmaciones.

    - Relacionar la necesidad con el interés público.

#
# ==========================================================
# VALIDACIONES JURÍDICAS
# ==========================================================

validaciones:

  - id: VAL-NEC-001

    descripcion: Debe existir necesidad pública.

    severidad: critica

  - id: VAL-NEC-002

    descripcion: Debe existir interés público.

    severidad: critica

  - id: VAL-NEC-003

    descripcion: Debe existir coherencia con el objeto.

    severidad: critica

  - id: VAL-NEC-004

    descripcion: Debe justificarse la contratación.

    severidad: alta

  - id: VAL-NEC-005

    descripcion: Debe utilizar lenguaje administrativo.

    severidad: media

#
# ==========================================================
# REGLAS PARA EL MOTOR EXPERTO
# ==========================================================

motorExperto:

  seleccionAutomatica:

    prioridad:

      servicios: 100

      suministros: 100

      obras: 100

      concesion_servicios: 95

      concesion_obras: 95

  composicion:

    ordenarPor:

      - introduccion

      - descripcionNecesidad

      - interesPublico

      - conclusion

  comportamiento:

    combinarVariantes: true

    eliminarDuplicidades: true

    validarCoherencia: true

    generarObservaciones: true

#
# ==========================================================
# OBSERVACIONES
# ==========================================================

observaciones:

  - >

    Este módulo constituye el punto de partida para toda la Memoria
    Justificativa.

  - >

    Ningún expediente podrá generarse sin superar las validaciones
    definidas en este módulo.

  - >

    El contenido generado deberá ser posteriormente validado por el
    órgano promotor del expediente.

#
# ==========================================================
# FIN DE LA PARTE 2
# ==========================================================

#
# ==========================================================
# CASUÍSTICA ADMINISTRATIVA
# ==========================================================

casuistica:

  contratoNuevo:

    descripcion: >

      La necesidad deriva de una actuación no cubierta por contratos
      actualmente vigentes.

    redaccion: |

      La necesidad que motiva el presente expediente responde a una
      actuación que actualmente no se encuentra cubierta mediante ningún
      contrato en vigor, resultando imprescindible promover un nuevo
      procedimiento de contratación para garantizar la continuidad del
      servicio público.

  continuidadServicio:

    descripcion: >

      El contrato garantiza la continuidad de un servicio existente.

    redaccion: |

      La contratación proyectada resulta imprescindible para garantizar
      la continuidad de un servicio esencial cuya interrupción produciría
      perjuicios para el normal funcionamiento de la actividad
      administrativa.

  incrementoActividad:

    descripcion: >

      Aumento de la carga de trabajo.

    redaccion: |

      El incremento experimentado en la actividad administrativa hace
      insuficientes los medios actualmente disponibles, siendo necesario
      acudir a la contratación pública para asegurar una adecuada
      prestación del servicio.

  nuevaNormativa:

    descripcion: >

      La necesidad viene motivada por cambios normativos.

    redaccion: |

      La entrada en vigor de nuevas obligaciones legales exige adaptar
      los medios disponibles para garantizar el cumplimiento de la
      normativa aplicable.

#
# ==========================================================
# REGLAS DE DECISIÓN
# ==========================================================

reglasDecision:

  - id: DEC-001

    condicion: contrato_existente == false

    accion: utilizar_variante("contratoNuevo")

  - id: DEC-002

    condicion: continuidad_servicio == true

    accion: utilizar_variante("continuidadServicio")

  - id: DEC-003

    condicion: incremento_actividad == true

    accion: utilizar_variante("incrementoActividad")

  - id: DEC-004

    condicion: cambio_normativo == true

    accion: utilizar_variante("nuevaNormativa")

#
# ==========================================================
# DETECCIÓN DE ERRORES
# ==========================================================

errores:

  - codigo: ERR-NEC-001

    descripcion: >

      La necesidad no describe una finalidad pública.

    gravedad: critica

    accion: bloquear_documento

  - codigo: ERR-NEC-002

    descripcion: >

      La necesidad reproduce únicamente el objeto del contrato.

    gravedad: alta

    accion: solicitar_revision

  - codigo: ERR-NEC-003

    descripcion: >

      No existe relación entre la necesidad y las competencias del órgano.

    gravedad: critica

    accion: bloquear_documento

  - codigo: ERR-NEC-004

    descripcion: >

      La necesidad contiene afirmaciones sin motivación suficiente.

    gravedad: alta

    accion: solicitar_revision

#
# ==========================================================
# OBSERVACIONES PARA EL MOTOR
# ==========================================================

observacionesMotor:

  generarAdvertenciaSi:

    - longitud_texto < 150

    - interes_publico == false

    - necesidad_generica == true

    - objeto_no_relacionado == true

  sugerenciasAutomaticas:

    - ampliar_descripcion

    - justificar_interes_publico

    - justificar_competencia

    - revisar_objeto

#
# ==========================================================
# PREGUNTAS QUE DEBE REALIZAR EL ASISTENTE
# ==========================================================

preguntasUsuario:

  - id: PREG-001

    pregunta: >

      ¿Qué problema concreto pretende resolver el contrato?

    obligatoria: true

  - id: PREG-002

    pregunta: >

      ¿Qué consecuencias tendría no celebrar este contrato?

    obligatoria: true

  - id: PREG-003

    pregunta: >

      ¿Existe actualmente otro contrato que cubra esta necesidad?

    obligatoria: true

  - id: PREG-004

    pregunta: >

      ¿La necesidad deriva de una nueva competencia o de un incremento
      de actividad?

    obligatoria: false

#
# ==========================================================
# SALIDAS GENERADAS
# ==========================================================

salidas:

  memoria:

    obligatorio: true

  informeInsuficiencia:

    relacionado: true

  planContratacion:

    relacionado: true

#
# ==========================================================
# FIN PARTE 3
# ==========================================================

#
# ==========================================================
# MATRIZ DE CASOS DE USO
# ==========================================================

casosUso:

  contratoMenor:

    descripcion: >

      Necesidad correspondiente a contratos menores.

    requiere:

      - necesidad

      - interesPublico

    prohibe:

      - referencias_lotes

      - referencias_SARA

    observacion: >

      La necesidad deberá justificar expresamente que el contrato resulta
      imprescindible y que la prestación no puede satisfacerse mediante
      medios propios.

  procedimientoAbierto:

    descripcion: Procedimiento abierto.

    requiere:

      - necesidad

      - interesPublico

      - insuficiencia_medios

      - coherencia_objeto

  abiertoSimplificado:

    descripcion: Procedimiento abierto simplificado.

    requiere:

      - necesidad

      - interesPublico

      - insuficiencia_medios

  negociado:

    descripcion: Procedimiento negociado.

    requiere:

      - necesidad

      - interesPublico

      - motivacion_negociado

  SARA:

    descripcion: Contratos sujetos a regulación armonizada.

    requiere:

      - necesidad

      - interesPublico

      - insuficiencia_medios

      - publicidad_europea

#
# ==========================================================
# REGLAS DE COHERENCIA
# ==========================================================

coherencia:

  comprobarObjeto:

    descripcion: >

      La necesidad debe guardar relación directa con el objeto
      contractual.

  comprobarCPV:

    descripcion: >

      La necesidad deberá ser compatible con el CPV seleccionado.

  comprobarProcedimiento:

    descripcion: >

      La necesidad deberá justificar el procedimiento elegido cuando la
      normativa así lo exija.

  comprobarLotes:

    descripcion: >

      La necesidad deberá ser coherente con la división o no en lotes.

#
# ==========================================================
# REGLAS DE CALIDAD DOCUMENTAL
# ==========================================================

calidad:

  longitud:

    minima: 150

    recomendada: 350

    maxima: 1500

  parrafos:

    minimo: 3

    recomendado: 5

  frases:

    longitudMedia: 25

  lenguaje:

    evitar:

      - "se considera"

      - "parece"

      - "podría"

      - "quizás"

    recomendar:

      - "resulta necesario"

      - "se justifica"

      - "es imprescindible"

      - "garantizar"

#
# ==========================================================
# INDICADORES DE RIESGO
# ==========================================================

riesgos:

  bajo:

    descripcion: >

      Necesidad correctamente motivada.

  medio:

    descripcion: >

      Necesidad insuficientemente desarrollada.

  alto:

    descripcion: >

      La necesidad presenta carencias que pueden comprometer la validez
      del expediente.

  critico:

    descripcion: >

      No existe motivación suficiente para iniciar el procedimiento.

#
# ==========================================================
# ACCIONES AUTOMÁTICAS DEL MOTOR
# ==========================================================

accionesMotor:

  riesgoBajo:

    accion:

      generar_documento

  riesgoMedio:

    accion:

      generar_advertencia

  riesgoAlto:

    accion:

      solicitar_ampliacion

  riesgoCritico:

    accion:

      bloquear_expediente

#
# ==========================================================
# OBSERVACIONES PARA IA
# ==========================================================

instruccionesIA:

  - >

    Nunca inventar necesidades.

  - >

    No utilizar frases genéricas si existen datos suficientes del
    expediente.

  - >

    Priorizar siempre la normativa frente a ejemplos documentales.

  - >

    Si existen varias variantes válidas deberá elegirse la más específica.

  - >

    Toda afirmación deberá poder justificarse mediante normativa o hechos
    del expediente.

#
# ==========================================================
# RELACIONES CON OTROS MÓDULOS
# ==========================================================

relaciones:

  conectaCon:

    - insuficiencia-medios.yaml

    - objeto.yaml

    - cpv.yaml

    - procedimiento.yaml

    - lotes.yaml

    - solvencia.yaml

    - presupuesto.yaml

    - duracion.yaml

#
# ==========================================================
# ESTADÍSTICAS DEL MÓDULO
# ==========================================================

estadisticas:

  prioridadSistema: 100

  reutilizable: true

  admiteVariantes: true

  admiteIA: true

  requiereValidacionHumana: true

#
# ==========================================================
# FIN PARTE 4
# ==========================================================

#
# ==========================================================
# BIBLIOTECA DE EJEMPLOS ADMINISTRATIVOS
# ==========================================================

ejemplosAdministrativos:

  ejemplo001:

    nombre: Servicio de mantenimiento

    tipoContrato: servicios

    calidad: excelente

    texto: |

      La presente contratación responde a la necesidad de garantizar el
      adecuado mantenimiento de las instalaciones gestionadas por la
      Consejería, asegurando la continuidad del servicio y evitando la
      interrupción de actividades esenciales para el funcionamiento del
      centro.

      La inexistencia de medios suficientes para realizar dichas tareas
      con recursos propios hace imprescindible acudir a la contratación
      externa.

  ejemplo002:

    nombre: Suministro de equipamiento

    tipoContrato: suministros

    calidad: excelente

    texto: |

      El equipamiento actualmente disponible resulta insuficiente para
      atender las necesidades derivadas del incremento de actividad de la
      unidad administrativa.

      La adquisición prevista permitirá garantizar la continuidad de la
      prestación del servicio en condiciones adecuadas de eficacia y
      eficiencia.

  ejemplo003:

    nombre: Obras de adecuación

    tipoContrato: obras

    calidad: excelente

    texto: |

      Las actuaciones proyectadas tienen por finalidad adecuar las
      instalaciones existentes a las necesidades funcionales actuales,
      garantizando el cumplimiento de la normativa vigente y mejorando la
      seguridad de las personas usuarias.

#
# ==========================================================
# EJEMPLOS INCORRECTOS
# ==========================================================

ejemplosIncorrectos:

  - texto: |

      Se considera conveniente contratar este servicio.

    motivo: >

      No existe motivación suficiente.

  - texto: |

      Hace falta realizar un contrato.

    motivo: >

      No describe ninguna necesidad pública.

  - texto: |

      Se contratará porque es necesario.

    motivo: >

      Redacción circular.

  - texto: |

      Es conveniente disponer del suministro.

    motivo: >

      No explica por qué resulta conveniente.

#
# ==========================================================
# PATRONES DE REDACCIÓN
# ==========================================================

patrones:

  inicio:

    - >

      Se ha detectado la necesidad de...

    - >

      El órgano promotor precisa...

    - >

      Resulta imprescindible...

    - >

      La adecuada prestación del servicio exige...

  desarrollo:

    - >

      Dicha necesidad deriva de...

    - >

      La situación actual pone de manifiesto...

    - >

      Los medios actualmente disponibles...

  cierre:

    - >

      En consecuencia, la contratación propuesta constituye la solución
      más adecuada para satisfacer el interés público perseguido.

#
# ==========================================================
# EXPRESIONES RECOMENDADAS
# ==========================================================

expresionesRecomendadas:

  - imprescindible

  - interés público

  - adecuada prestación

  - garantizar

  - continuidad

  - eficacia

  - eficiencia

  - competencia

  - necesidad objetiva

  - motivación suficiente

#
# ==========================================================
# EXPRESIONES A EVITAR
# ==========================================================

expresionesProhibidas:

  - creemos

  - pensamos

  - parece

  - probablemente

  - quizá

  - sería conveniente

  - entendemos

  - opinamos

#
# ==========================================================
# INDICADORES DE CALIDAD DOCUMENTAL
# ==========================================================

indicadores:

  excelente:

    requisitos:

      - necesidad_clara

      - interes_publico

      - coherencia_objeto

      - motivacion_completa

      - lenguaje_administrativo

  aceptable:

    requisitos:

      - necesidad

      - interes_publico

  deficiente:

    requisitos:

      - redaccion_generica

      - falta_motivacion

      - frases_vacias

#
# ==========================================================
# MÉTRICAS PARA IA
# ==========================================================

metricas:

  puntuacionMaxima: 100

  criterios:

    motivacion:

      peso: 30

    claridad:

      peso: 20

    coherencia:

      peso: 20

    normativa:

      peso: 20

    estilo:

      peso: 10

#
# ==========================================================
# RECOMENDACIONES AUTOMÁTICAS
# ==========================================================

recomendaciones:

  siPuntuacionMenor70:

    - ampliar motivación

    - justificar interés público

    - revisar coherencia

  siPuntuacionMenor50:

    - bloquear documento

    - solicitar revisión completa

#
# ==========================================================
# FIN PARTE 5
# ==========================================================

#
# ==========================================================
# INTEGRACIÓN CON EL EXPEDIENTE
# ==========================================================

integracionExpediente:

  posicionDocumento:

    documento: Memoria Justificativa

    capitulo: I

    apartado: Justificación de la necesidad

    obligatorio: true

  genera:

    - descripcionNecesidad

    - interesPublico

    - motivacionContratacion

    - antecedentesNecesidad

  alimenta:

    - objeto.yaml

    - insuficiencia-medios.yaml

    - procedimiento.yaml

    - cpv.yaml

    - lotes.yaml

    - solvencia.yaml

#
# ==========================================================
# INFORMACIÓN NECESARIA
# ==========================================================

entradasRequeridas:

  obligatorias:

    - organoContratacion

    - unidadPromotora

    - descripcionNecesidad

    - finalidadPublica

  recomendadas:

    - antecedentes

    - situacionActual

    - consecuenciasNoContratar

    - objetivos

    - usuariosAfectados

#
# ==========================================================
# SALIDAS HACIA OTROS MÓDULOS
# ==========================================================

salidasMotor:

  objeto:

    envia:

      - descripcionNecesidad

      - finalidadPublica

  insuficienciaMedios:

    envia:

      - descripcionNecesidad

      - recursosActuales

      - limitaciones

  procedimiento:

    envia:

      - urgencia

      - complejidad

      - continuidadServicio

  cpv:

    envia:

      - descripcionActividad

      - naturalezaPrestacion

#
# ==========================================================
# REGLAS DE NAVEGACIÓN
# ==========================================================

flujo:

  siguiente:

    - objeto.yaml

  siExisteInsuficiencia:

    siguiente:

      - insuficiencia-medios.yaml

  despues:

    - cpv.yaml

    - procedimiento.yaml

#
# ==========================================================
# MATRIZ DE COMPATIBILIDAD
# ==========================================================

compatibilidad:

  memoria:

    compatible: true

  pcap:

    compatible: true

  ppt:

    compatible: true

  informe:

    compatible: true

  resolucionInicio:

    compatible: true

  anuncioLicitacion:

    compatible: false

#
# ==========================================================
# CONTROLES DE CONSISTENCIA
# ==========================================================

consistencia:

  comprobar:

    - necesidad_vs_objeto

    - necesidad_vs_cpv

    - necesidad_vs_procedimiento

    - necesidad_vs_insuficiencia

    - necesidad_vs_presupuesto

  acciones:

    incoherenciaLeve:

      advertir: true

    incoherenciaGrave:

      bloquear: true

#
# ==========================================================
# REGLAS DE EXPLICABILIDAD
# ==========================================================

explicabilidad:

  activar: true

  registrar:

    - reglaAplicada

    - varianteSeleccionada

    - normativaUtilizada

    - moduloOrigen

    - fechaGeneracion

    - versionModulo

#
# ==========================================================
# AUDITORÍA
# ==========================================================

auditoria:

  registrarCambios: true

  registrarUsuario: true

  registrarVersion: true

  registrarNormativa: true

  registrarActivos:

    - necesidad

    - objeto

    - cpv

    - procedimiento

#
# ==========================================================
# TRAZABILIDAD INTERNA
# ==========================================================

trazabilidad:

  origen:

    modulo: MEMORIA.NECESIDAD

    version: 1.0.0

  relaciones:

    precede:

      - objeto.yaml

    complementa:

      - insuficiencia-medios.yaml

    condiciona:

      - procedimiento.yaml

      - cpv.yaml

      - lotes.yaml

#
# ==========================================================
# REGLAS PARA IA GENERATIVA
# ==========================================================

ia:

  permitirReescritura: true

  mantenerSentidoJuridico: true

  mantenerReferenciasNormativas: true

  prohibido:

    - inventarHechos

    - modificarNormativa

    - eliminarJustificaciones

    - alterarObjetivosPublicos

#
# ==========================================================
# INDICADORES DE MADUREZ
# ==========================================================

madurez:

  nivel:

    actual: M3

    descripcion: >

      Módulo documental avanzado con reglas jurídicas,
      conocimiento reutilizable, validaciones,
      explicabilidad e integración completa con el expediente.

#
# ==========================================================
# PREPARADO PARA VERSIONADO
# ==========================================================

versionFutura:

  admite:

    - IA_semantica

    - RAG

    - Busquedas_vectoriales

    - Ontologia

    - Knowledge_Graph

#
# ==========================================================
# FIN PARTE 6
# ==========================================================

#
# ==========================================================
# DICCIONARIO SEMÁNTICO
# ==========================================================

diccionarioSemantico:

  necesidad:

    definicion: >

      Carencia objetiva cuya satisfacción resulta imprescindible para
      garantizar el ejercicio de las competencias atribuidas al órgano
      de contratación.

    sinonimos:

      - necesidad administrativa

      - necesidad pública

      - necesidad funcional

    relacionados:

      - interesPublico

      - objeto

      - insuficienciaMedios

  interesPublico:

    definicion: >

      Finalidad perseguida por la Administración mediante la celebración
      del contrato y vinculada al cumplimiento de sus competencias.

    relacionados:

      - necesidad

      - competencia

      - servicioPublico

  insuficienciaMedios:

    definicion: >

      Imposibilidad objetiva de atender la necesidad mediante los medios
      personales o materiales propios.

  objeto:

    definicion: >

      Prestación concreta que permitirá satisfacer la necesidad
      previamente identificada.

#
# ==========================================================
# TAXONOMÍA DEL CONOCIMIENTO
# ==========================================================

taxonomia:

  nivel1:

    - Memoria

    - PCAP

    - PPT

    - Informes

  nivel2:

    memoria:

      - necesidad

      - objeto

      - cpv

      - lotes

      - procedimiento

      - solvencia

      - presupuesto

      - plazo

  nivel3:

    necesidad:

      - descripcion

      - motivacion

      - interesPublico

      - antecedentes

#
# ==========================================================
# RELACIONES SEMÁNTICAS
# ==========================================================

grafoConocimiento:

  nodos:

    - necesidad

    - objeto

    - cpv

    - procedimiento

    - lotes

    - solvencia

    - presupuesto

    - plazo

    - interesPublico

    - insuficienciaMedios

  relaciones:

    - origen: necesidad

      destino: objeto

      tipo: determina

    - origen: objeto

      destino: cpv

      tipo: clasifica

    - origen: cpv

      destino: procedimiento

      tipo: condiciona

    - origen: procedimiento

      destino: publicidad

      tipo: determina

    - origen: necesidad

      destino: insuficienciaMedios

      tipo: requiere

#
# ==========================================================
# PALABRAS CLAVE
# ==========================================================

keywords:

  principales:

    - necesidad

    - contratación

    - interés público

    - servicio público

    - eficiencia

    - eficacia

    - continuidad

    - competencia

    - contratación pública

    - expediente

  secundarias:

    - LCSP

    - memoria

    - procedimiento

    - objeto

    - CPV

#
# ==========================================================
# ETIQUETAS VECTORIALES
# ==========================================================

embeddings:

  categoria:

    memoria

  dominio:

    contratacion_publica

  especialidad:

    justificacion_necesidad

  importancia:

    critica

#
# ==========================================================
# COMPATIBILIDAD CON RAG
# ==========================================================

rag:

  indexable: true

  chunking:

    recomendado: 800

    maximo: 1200

  estrategia:

    - normativa

    - casuistica

    - ejemplos

    - reglas

#
# ==========================================================
# COMPATIBILIDAD CON KNOWLEDGE GRAPH
# ==========================================================

knowledgeGraph:

  exportable: true

  formato:

    - RDF

    - JSON-LD

    - GraphML

#
# ==========================================================
# BÚSQUEDA SEMÁNTICA
# ==========================================================

busqueda:

  admite:

    - similitud

    - sinonimos

    - conceptos

    - normativa

    - relaciones

#
# ==========================================================
# PREPARACIÓN PARA IA
# ==========================================================

iaSemantica:

  responderPreguntas: true

  localizarNormativa: true

  justificarRespuestas: true

  citarActivosRelacionados: true

#
# ==========================================================
# MÉTRICAS DEL MÓDULO
# ==========================================================

metricasModulo:

  complejidad:

    alta

  reutilizacion:

    muy_alta

  dependencia:

    estructural

  criticidad:

    maxima

#
# ==========================================================
# HOJA DE RUTA DEL MÓDULO
# ==========================================================

roadmap:

  version_1_1:

    - ampliar_casuistica

    - incorporar_jurisprudencia

    - incorporar_informes_JCCA

  version_1_2:

    - aprendizaje_semantico

    - recomendaciones_contextuales

  version_2_0:

    - razonamiento_juridico

    - inferencia

    - motor_experto_semantico

#
# ==========================================================
# FIN PARTE 7
# ==========================================================

#
# ==========================================================
# ANEXOS TÉCNICOS
# ==========================================================

anexos:

  referenciasCruzadas:

    - modulo: objeto.yaml
      relacion: derivacion_directa

    - modulo: insuficiencia-medios.yaml
      relacion: complementario

    - modulo: cpv.yaml
      relacion: clasificacion

    - modulo: procedimiento.yaml
      relacion: decision

  normativaRelacionada:

    principal:

      - Ley 9/2017

      - Ley 39/2015

      - Ley 40/2015

    secundaria:

      - Directivas Europeas de Contratación

      - Instrucciones Junta de Andalucía

      - Informes JCCA

#
# ==========================================================
# HISTORIAL DEL MÓDULO
# ==========================================================

historial:

  versiones:

    - version: 1.0.0

      fecha: 2026-07-30

      descripcion: >

        Primera versión completa del módulo de conocimiento.

      autor: CONTRATA IA

  cambiosPrevistos:

    - Incorporación de jurisprudencia.

    - Integración con base documental.

    - Aprendizaje semántico.

    - Reglas adaptativas.

#
# ==========================================================
# COMPATIBILIDAD
# ==========================================================

compatibilidad:

  motorDocumental:

    compatible: true

  motorReglas:

    compatible: true

  motorSemantico:

    compatible: true

  motorIA:

    compatible: true

  RAG:

    compatible: true

  KnowledgeGraph:

    compatible: true

#
# ==========================================================
# EXPORTACIÓN
# ==========================================================

exportacion:

  formatos:

    - YAML

    - JSON

    - JSON-LD

    - RDF

  serializable: true

#
# ==========================================================
# SEGURIDAD
# ==========================================================

seguridad:

  modificablePor:

    - administrador

    - responsable_conocimiento

  lectura:

    - sistema

    - motor_documental

    - motor_reglas

    - motor_ia

#
# ==========================================================
# VALIDACIÓN FINAL
# ==========================================================

validacionFinal:

  comprobar:

    - identificacion

    - normativa

    - reglas

    - textos

    - variantes

    - dependencias

    - trazabilidad

    - relaciones

    - metadatos

  resultadoEsperado:

    modulo_valido

#
# ==========================================================
# INDICADORES DE CALIDAD
# ==========================================================

indicadoresCalidad:

  completitud:

    objetivo: 100

  coherencia:

    objetivo: 100

  reutilizacion:

    objetivo: 100

  trazabilidad:

    objetivo: 100

  explicabilidad:

    objetivo: 100

#
# ==========================================================
# DOCUMENTACIÓN
# ==========================================================

documentacion:

  descripcion: >

    Este módulo constituye el patrón oficial para todos los módulos de
    conocimiento de CONTRATA IA.

  objetivo:

    Servir como fuente única de conocimiento reutilizable para la
    generación automática de expedientes administrativos.

#
# ==========================================================
# OBSERVACIONES FINALES
# ==========================================================

observacionesFinales:

  - >

    Ningún texto generado por este módulo sustituye la validación jurídica
    del órgano competente.

  - >

    Todas las decisiones generadas deberán ser trazables hasta la norma
    que las fundamenta.

  - >

    Toda modificación del presente módulo deberá mantener la
    compatibilidad con el esquema oficial de activos documentales.

#
# ==========================================================
# FIRMA DEL MÓDULO
# ==========================================================

firma:

  proyecto: CONTRATA IA

  modulo: MEMORIA.NECESIDAD

  version: 1.0.0

  estado: PRODUCCION

  arquitectura:

    conocimiento_documental

  mantenedor:

    Banco de Conocimiento

#
# ==========================================================
# FIN DEL MÓDULO
# ==========================================================
