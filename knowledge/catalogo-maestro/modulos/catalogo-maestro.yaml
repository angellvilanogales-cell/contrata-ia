  solvencia

  clasificacion

  prohibicionesContratar

  habilitacionProfesional

# ============================================================================
# CONCEPTOS RELATIVOS A LA EJECUCIÓN
# ============================================================================

ejecucion:

  responsableContrato

  penalidades

  modificacion

  recepcion

  liquidacion

# ============================================================================
# ESTADOS DE VALIDACIÓN
# ============================================================================

estadosValidacion:

  pendiente

  correcto

  revisar

  error

  bloqueado

# ============================================================================
# NIVELES DE CRITICIDAD
# ============================================================================

criticidad:

  informativa

  baja

  media

  alta

  critica

# ============================================================================
# TIPOS DE MENSAJE DEL SISTEMA
# ============================================================================

mensajes:

  informacion

  recomendacion

  advertencia

  error

  bloqueo

# ============================================================================
# CATEGORÍAS DE REGLAS
# ============================================================================

categoriasReglas:

  normativa

  documental

  tecnica

  automatica

  validacion

  inferencia

# ============================================================================
# CLASIFICACIÓN DE LAS DECISIONES
# ============================================================================

decisiones:

  automatica

  asistida

  manual

# ============================================================================
# DICCIONARIO DE SINÓNIMOS
# ============================================================================

sinonimos:

  expediente:

    - procedimiento

    - contratación

  licitador:

    - empresa

    - operadorEconomico

  adjudicatario:

    - contratista

# ============================================================================
# INFORMACIÓN PARA EL KNOWLEDGE GRAPH
# ============================================================================

knowledgeGraph:

  entidades:

    - Expediente

    - Contrato

    - Necesidad

    - Objeto

    - CPV

    - Procedimiento

    - Solvencia

    - Licitador

    - Documento

# ============================================================================
# FIN PARTE 3 DE 6
# ============================================================================

# ============================================================================
# DICCIONARIO FUNCIONAL DEL SISTEMA EXPERTO
# ============================================================================

diccionarioFuncional:

  descripcion: >

    Define todos los conceptos funcionales utilizados por los motores de
    inferencia de CONTRATA IA. Su finalidad es evitar que cada módulo
    implemente definiciones diferentes para una misma operación.

# ============================================================================
# MOTORES DEL SISTEMA
# ============================================================================

motoresSistema:

  MotorNecesidad:

    descripcion:

      Analiza y valida la necesidad pública.

  MotorObjeto:

    descripcion:

      Determina el objeto contractual.

  MotorCPV:

    descripcion:

      Selecciona el código CPV.

  MotorProcedimiento:

    descripcion:

      Determina el procedimiento de adjudicación.

  MotorLotes:

    descripcion:

      Analiza la división en lotes.

  MotorSolvencia:

    descripcion:

      Calcula la solvencia exigible.

  MotorPublicidad:

    descripcion:

      Determina la publicidad obligatoria.

  MotorCriterios:

    descripcion:

      Genera los criterios de adjudicación.

  MotorDocumental:

    descripcion:

      Genera todos los documentos administrativos.

# ============================================================================
# TIPOS DE VALIDACIÓN
# ============================================================================

tiposValidacion:

  sintactica

  semantica

  normativa

  documental

  funcional

  cruzada

# ============================================================================
# TIPOS DE REGLA
# ============================================================================

tiposRegla:

