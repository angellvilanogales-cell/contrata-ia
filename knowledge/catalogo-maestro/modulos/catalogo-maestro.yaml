  asistida

  manual

# ============================================================================
# RESULTADOS POSIBLES
# ============================================================================

resultadoValidacion:

  correcto

  advertencia

  error

  bloqueo

# ============================================================================
# PRIORIDAD DE EJECUCIÓN
# ============================================================================

prioridadMotores:

