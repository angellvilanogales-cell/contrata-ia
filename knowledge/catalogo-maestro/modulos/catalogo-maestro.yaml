# ============================================================================
# CONTRATA IA
# BANCO DE CONOCIMIENTO
# ============================================================================
#
# MÓDULO..............: CATÁLOGO MAESTRO
# CÓDIGO..............: MEM.CATALOGO
# VERSIÓN.............: 1.0.0
# ESTADO..............: PRODUCCIÓN
# TIPO................: DICCIONARIO MAESTRO
# CRITICIDAD..........: MÁXIMA
#
# ESTE MÓDULO DEFINE LOS CONCEPTOS COMUNES UTILIZADOS POR TODO EL
# SISTEMA EXPERTO.
#
# NINGÚN MÓDULO DEBERÁ DEFINIR NUEVAMENTE ESTOS ELEMENTOS.
#
# ============================================================================

schema:

  id: CONTRATAIA.CATALOGO.MAESTRO

  codigo: MEM.CATALOGO

  version: 1.0.0

  estado: produccion

# ============================================================================
# OBJETIVO
# ============================================================================

objetivo:

  descripcion: >

    Centralizar todos los conceptos comunes utilizados por los módulos
    del Banco de Conocimiento para evitar duplicidades, garantizar la
    coherencia documental y facilitar el mantenimiento del sistema.

# ============================================================================
# ÁMBITO
# ============================================================================

ambito:

  afectaA:

    - MEM.NEC

    - MEM.OBJ

    - MEM.CPV

    - MEM.PROCEDIMIENTO

    - MEM.LOTES

    - MEM.SOLVENCIA

    - MEM.CRITERIOS

    - MEM.PUBLICIDAD

    - MEM.DOCUMENTOS

# ============================================================================
# TIPOS DE CONTRATO
# ============================================================================

tiposContrato:

  - obras

  - servicios

  - suministros

  - concesion_obras

  - concesion_servicios

  - mixto

# ============================================================================
# TIPOS DE PRESTACIÓN
# ============================================================================

tiposPrestacion:

  - principal

  - accesoria

  - complementaria

  - opcional

# ============================================================================
# ESTADOS DEL EXPEDIENTE
# ============================================================================

estadosExpediente:

  - borrador

  - validacion

  - revision

  - aprobado

  - licitado

  - adjudicado

  - formalizado

  - ejecutandose

  - finalizado

  - archivado

# ============================================================================
# NIVELES DE RIESGO
# ============================================================================

nivelesRiesgo:

  - bajo

  - medio

  - alto

  - critico

# ============================================================================
# NIVELES DE CONFIANZA
# ============================================================================

nivelesConfianza:

  excelente:

    minimo: 95

  alta:

    minimo: 85

  media:

    minimo: 70

  baja:

    minimo: 50

  insuficiente:

    menorQue: 50

# ============================================================================
# PRIORIDADES
# ============================================================================

prioridades:

  maxima

  alta

  media

  baja

# ============================================================================
# MOTORES DEL SISTEMA
# ============================================================================

motores:

  - MotorObjeto

  - MotorCPV

  - MotorProcedimiento

  - MotorLotes

  - MotorSolvencia

  - MotorPublicidad

  - MotorDocumental

  - RuleEngine

  - WorkflowEngine

# ============================================================================
# FIN PARTE 1 DE 6
# ============================================================================

# ============================================================================
# VOCABULARIO ADMINISTRATIVO COMÚN
# ============================================================================

vocabulario:

  descripcion: >

    Este apartado normaliza la terminología administrativa utilizada por
    todos los módulos de CONTRATA IA con objeto de garantizar la
    consistencia documental.

# ============================================================================
# ÓRGANOS
# ============================================================================

organos:

  contratacion:

    descripcion:

      Órgano competente para aprobar el expediente y adjudicar el
      contrato.

  unidadPromotora:

    descripcion:

      Unidad responsable de promover la contratación.

  unidadTramitadora:

    descripcion:

      Unidad encargada de la tramitación administrativa.

  responsableContrato:

    descripcion:

      Persona responsable del seguimiento de la ejecución contractual.

# ============================================================================
# ACTORES DEL EXPEDIENTE
# ============================================================================

actores:

  internos:

    - órganoContratación

    - unidadPromotora

    - unidadTramitadora

    - asesoríaJurídica

    - intervención

    - mesaContratación

    - responsableContrato

  externos:

    - licitador

    - adjudicatario

    - contratista

    - subcontratista

# ============================================================================
# TIPOS DOCUMENTALES
# ============================================================================

tiposDocumentales:

  principales:

    - memoriaJustificativa

    - informeInsuficienciaMedios

    - informeNecesidad

    - PCAP

    - PPT

    - resoluciónInicio

    - informeFiscalización

    - anuncioLicitación

    - propuestaAdjudicación

    - resoluciónAdjudicación

    - contrato

    - actaRecepción

# ============================================================================
# FASES DEL EXPEDIENTE
# ============================================================================

fasesExpediente:

  planificación

  preparación

  aprobación

  licitación

  evaluación

  adjudicación

  formalización

  ejecución

  seguimiento

  liquidación

  archivo

# ============================================================================
# TIPOS DE PROCEDIMIENTO
# ============================================================================

procedimientos:

  abiertos:

    - abierto

    - abiertoSimplificado

    - abiertoSimplificadoAbreviado

  restringidos:

    - restringido

  negociación:

    - negociadoPublicidad

    - negociadoSinPublicidad

  especiales:

    - diálogoCompetitivo

    - asociaciónInnovación

# ============================================================================
# TIPOS DE TRAMITACIÓN
# ============================================================================

tramitaciones:

  ordinaria

  urgente

  emergencia

# ============================================================================
# TIPOS DE REGULACIÓN
# ============================================================================

regulacion:

  SARA

  NoSARA

# ============================================================================
# TIPOS DE CRITERIOS
# ============================================================================

criterios:

  automaticos

  juicioValor

  mixtos

# ============================================================================
# TIPOS DE SOLVENCIA
# ============================================================================

solvencias:

  economica

  financiera

  tecnica

  profesional

# ============================================================================
# GARANTÍAS
# ============================================================================

garantias:

  provisional

  definitiva

  complementaria

  noProcede

# ============================================================================
# PUBLICIDAD
# ============================================================================

publicidad:

  DOUE

  PlataformaContratacionEstado

  PerfilContratante

  BOJA

  BOE

# ============================================================================
# MOTORES QUE CONSUMEN ESTE VOCABULARIO
# ============================================================================

consumidores:

  - MotorObjeto

  - MotorCPV

  - MotorProcedimiento

  - MotorSolvencia

  - MotorLotes

  - MotorPublicidad

  - MotorDocumental

  - WorkflowEngine

# ============================================================================
# FIN PARTE 2 DE 6
# ============================================================================

# ============================================================================
# DICCIONARIO JURÍDICO COMÚN
# ============================================================================

diccionarioJuridico:

  descripcion: >

    Define los conceptos jurídicos fundamentales utilizados por todos los
    motores de CONTRATA IA. Ningún módulo deberá redefinir estos términos.

# ============================================================================
# CONCEPTOS BÁSICOS
# ============================================================================

conceptos:

  objetoContrato:

    descripcion: >

      Prestación cuya realización constituye la finalidad del contrato.

  necesidad:

    descripcion: >

      Carencia o problema público cuya satisfacción justifica la
      contratación.

  prestacionPrincipal:

    descripcion: >

      Prestación que determina el régimen jurídico del contrato.

  prestacionAccesoria:

    descripcion: >

      Prestación complementaria que no altera la naturaleza jurídica del
      contrato.

  contratoMixto:

    descripcion: >

      Contrato integrado por prestaciones propias de distintos tipos
      contractuales.

# ============================================================================
# PRINCIPIOS DE LA CONTRATACIÓN PÚBLICA
# ============================================================================

principiosLCSP:

  igualdad

  libreConcurrencia

  transparencia

  publicidad

  proporcionalidad

  eficiencia

  integridad

  noDiscriminacion

# ============================================================================
# CONCEPTOS ECONÓMICOS
# ============================================================================

conceptosEconomicos:

  valorEstimado

  presupuestoBaseLicitacion

  precioContrato

  IVA

  modificacionEconomica

# ============================================================================
# CONCEPTOS TEMPORALES
# ============================================================================

conceptosTemporales:

  plazoEjecucion

  plazoPresentacionOfertas

  prorroga

  plazoGarantia

  duracionContrato

# ============================================================================
# CONCEPTOS DOCUMENTALES
# ============================================================================

conceptosDocumentales:

  memoria

  PCAP

  PPT

  anuncio

  informe

  resolucion

  acta

  contrato

# ============================================================================
# CONCEPTOS RELATIVOS AL LICITADOR
# ============================================================================

