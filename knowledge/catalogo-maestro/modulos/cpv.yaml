    2:

      prestaciónPrincipal

    3:

      valorEstimadoPrestación

    4:

      descripciónObjeto

    5:

      prestacionesAccesorias

# ============================================================================
# REGLAS DE EXPERIENCIA
# ============================================================================

experiencia:

  recomendaciones:

    - Nunca seleccionar el CPV únicamente por el título del expediente.

    - Analizar siempre la prestación realmente contratada.

    - Priorizar la finalidad administrativa frente a la denominación.

    - Revisar contratos mixtos manualmente cuando existan dudas.

