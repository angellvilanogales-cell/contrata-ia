# ============================================================================
# CONTRATA IA
# BANCO DE CONOCIMIENTO
# ============================================================================
#
# MÓDULO..............: CÓDIGOS CPV
# CÓDIGO..............: MEM.CPV
# VERSIÓN.............: 1.0.0
# ESTADO..............: PRODUCCIÓN
# TIPO................: MÓDULO DE CONOCIMIENTO
# CRITICIDAD..........: MÁXIMA
# DEPENDE.............:
#   - MEM.NEC
#   - MEM.OBJ
#
# UTILIZADO POR.......:
#   - Motor CPV
#   - Motor Procedimiento
#   - Motor Solvencia
#   - Motor Lotes
#   - Motor Publicidad
#   - Workflow
#   - Expediente
#   - PCAP
#   - PPT
#   - Memoria
#
# NORMATIVA BASE......:
#   - Reglamento (CE) 213/2008
#   - Ley 9/2017 LCSP
#
# AUTOR...............: CONTRATA IA
#
# ============================================================================

schema:

  id: CONTRATAIA.MODULO.CPV

  codigo: MEM.CPV

  version: 1.0.0

  estado: produccion

# ============================================================================
# OBJETIVO
# ============================================================================

objetivo:

  descripcion: >

    Determinar automáticamente el código CPV principal y, cuando
    proceda, los códigos CPV secundarios que describen correctamente el
    objeto del contrato conforme al Reglamento (CE) 213/2008 y a la Ley
    9/2017 de Contratos del Sector Público.

# ============================================================================
# FUNDAMENTO JURÍDICO
# ============================================================================

normativa:

  principal:

    reglamento:

      Reglamento (CE) 213/2008

    descripcion: >

      Aprueba el Vocabulario Común de Contratos Públicos (CPV).

  relacionada:

    ley:

      Ley 9/2017

    referencias:

      - articulo 99

      - articulo 116

      - anuncios de licitación

      - DOUE

      - Plataforma de Contratación

# ============================================================================
# DEFINICIÓN DEL CPV
# ============================================================================

concepto:

  nombre:

    Common Procurement Vocabulary

  siglas:

    CPV

  definicion:

    >

      Sistema europeo normalizado destinado a clasificar el objeto de los
      contratos públicos mediante códigos numéricos homogéneos.

# ============================================================================
# FINALIDAD
# ============================================================================

finalidad:

  principales:

    - identificar el objeto contractual

    - clasificar correctamente el contrato

    - facilitar la publicidad

    - mejorar la transparencia

    - homogeneizar licitaciones

    - facilitar estadísticas

    - permitir búsquedas automáticas

# ============================================================================
# PRINCIPIOS
# ============================================================================

principios:

  unicidad:

    >

      Debe existir un CPV principal.

  coherencia:

    >

      Debe guardar relación directa con el objeto contractual.

  objetividad:

    >

      La selección no dependerá del órgano contratante.

  trazabilidad:

    >

      Toda selección deberá justificarse.

# ============================================================================
# ESTRUCTURA GENERAL DEL CPV
# ============================================================================

estructura:

  codigo:

    longitud: 8

  digitoControl:

    longitud: 1

  formato:

    ########-#

  niveles:

    division

    grupo

    clase

    categoria

# ============================================================================
# VARIABLES DEL MÓDULO
# ============================================================================

variables:

  objetoContrato:

    tipo: texto

    obligatorio: true

  tipoContrato:

    tipo: lista

    obligatorio: true

  prestaciones:

    tipo: lista

    obligatorio: false

  finalidad:

    tipo: texto

    obligatorio: false

  sectorActividad:

    tipo: lista

    obligatorio: false

# ============================================================================
# SALIDAS
# ============================================================================

salidas:

  CPVPrincipal

  CPVSecundarios

  descripcionCPV

  nivelConfianza

  justificacionSeleccion

  advertencias

# ============================================================================
# DEPENDENCIAS
# ============================================================================

dependencias:

  entrada:

    - MEM.NEC

    - MEM.OBJ

  salida:

    - MEM.PROCEDIMIENTO

    - MEM.SOLVENCIA

    - MEM.LOTES

    - MEM.PUBLICIDAD

    - MEM.CRITERIOS

# ============================================================================
# FIN PARTE 1 DE 10
# ============================================================================

# ============================================================================
# ARQUITECTURA DEL Vocabulario Común de Contratos Públicos (CPV)
# ============================================================================

arquitectura:

  fuenteOficial:

    nombre:

      Reglamento (CE) 213/2008

    organismo:

      Comisión Europea

  estructuraJerarquica:

    niveles:

      - Division

      - Grupo

      - Clase

      - Categoría

      - Código

  descripcion:

    >

      El CPV se organiza mediante una estructura jerárquica donde cada
      nivel incrementa el grado de precisión respecto al objeto del
      contrato.

# ============================================================================
# ESTRUCTURA DEL CÓDIGO
# ============================================================================

estructuraCodigo:

  longitud:

    codigo: 8

    control: 1

  formato:

    ########-#

  ejemplo:

    codigo:

      30213300-8

# ============================================================================
# COMPONENTES DEL CÓDIGO
# ============================================================================

componentes:

  dosPrimerosDigitos:

    descripcion:

      División principal

  cuatroPrimeros:

    descripcion:

      Grupo

  cincoPrimeros:

    descripcion:

      Clase

  sietePrimeros:

    descripcion:

      Categoría

  ochoPrimeros:

    descripcion:

      Código específico

  ultimoDigito:

    descripcion:

      Dígito de control

# ============================================================================
# CLASIFICACIÓN GENERAL
# ============================================================================

clasificacionGeneral:

  bienes:

    correspondeHabitualmente:

      suministros

  servicios:

    correspondeHabitualmente:

      servicios

  obras:

    correspondeHabitualmente:

      obras

# ============================================================================
# TIPOS DE CÓDIGOS
# ============================================================================

tiposCPV:

  principal:

    obligatorio: true

    descripcion:

      Código que identifica la prestación principal.

  secundarios:

    obligatorio: false

    descripcion:

      Códigos complementarios que describen prestaciones accesorias.

# ============================================================================
# REGLAS GENERALES
# ============================================================================

reglasGenerales:

  - id: CPV-001

    prioridad: 100

    descripcion:

      Todo expediente tendrá un único CPV principal.

  - id: CPV-002

    prioridad: 95

    descripcion:

      Los CPV secundarios únicamente podrán describir prestaciones
      accesorias.

  - id: CPV-003

    prioridad: 95

    descripcion:

      El CPV deberá corresponder a la prestación principal.

  - id: CPV-004

    prioridad: 90

    descripcion:

      No podrá seleccionarse un CPV incompatible con el objeto.

# ============================================================================
# CRITERIOS DE SELECCIÓN
# ============================================================================

criteriosSeleccion:

  prioridad:

    - prestaciónPrincipal

    - finalidad

    - resultadoEsperado

    - naturalezaContrato

    - contenidoPrestacion

# ============================================================================
# MATRIZ OBJETO → CPV
# ============================================================================

objetoCPV:

  reglaGeneral:

    descripcion:

      El objeto contractual determina el CPV principal.

  excepciones:

    contratoMixto

    prestacionesAccesorias

# ============================================================================
# CONTRATOS MIXTOS
# ============================================================================

contratosMixtos:

  permitido:

    true

  determinar:

    prestacionPrincipal

  CPVPrincipal:

    asociadoPrestacionPrincipal

  CPVSecundarios:

    asociadosPrestacionesAccesorias

# ============================================================================
# VARIABLES CALCULADAS
# ============================================================================

variablesCalculadas:

  numeroCPV

  existeCPVSecundario

  nivelPrecision

  nivelConfianza

  requiereRevisionManual

# ============================================================================
# VALIDACIONES INICIALES
# ============================================================================

validaciones:

  comprobar:

    - existeObjeto

    - tipoContratoDefinido

    - descripcionSuficiente

    - longitudMinimaDescripcion

    - coherenciaObjeto

# ============================================================================
# SALIDA DEL MOTOR
# ============================================================================

resultado:

  devolver:

    CPVPrincipal

    descripcionCPV

    CPVSecundarios

    confianza

    justificacion

# ============================================================================
# FIN PARTE 2 DE 10
# ============================================================================

# ============================================================================
# MOTOR DE INFERENCIA CPV
# ============================================================================

motorInferencia:

  descripcion: >

    El motor de inferencia selecciona automáticamente el código CPV más
    adecuado analizando el objeto contractual, las prestaciones, la
    finalidad y la naturaleza jurídica del contrato.

  objetivo:

    minimizarIntervencionManual: true

    justificarSeleccion: true

# ============================================================================
# ENTRADAS DEL MOTOR
# ============================================================================

entradas:

  obligatorias:

    objetoContrato

    tipoContrato

  recomendadas:

    prestaciones

    finalidad

    palabrasClave

    sectorActividad

# ============================================================================
# PROCESO DE SELECCIÓN
# ============================================================================

procesoSeleccion:

  fases:

    - analizarObjeto

    - identificarPrestacionPrincipal

    - localizarCategoriaCPV

    - buscarCoincidencias

    - calcularConfianza

    - seleccionarPrincipal

    - proponerSecundarios

    - justificarResultado

# ============================================================================
# IDENTIFICACIÓN DE LA PRESTACIÓN PRINCIPAL
# ============================================================================

prestacionPrincipal:

  criterioGeneral:

    descripcion: >

      La prestación principal será aquella que represente el núcleo del
      contrato y determine su régimen jurídico conforme a la LCSP.

  indicadores:

    - mayorValorEconomico

    - mayorImportanciaFuncional

    - finalidadPrincipal

# ============================================================================
# REGLAS DE INFERENCIA
# ============================================================================

reglasInferencia:

  - id: INF-CPV-001

    prioridad: 100

    descripcion:

      Si existe una única prestación claramente identificada.

    accion:

      seleccionarCPVPrincipal

  - id: INF-CPV-002

    prioridad: 98

    descripcion:

      Si existen varias prestaciones.

    accion:

      determinarPrestacionPrincipal

  - id: INF-CPV-003

    prioridad: 95

    descripcion:

      Las prestaciones accesorias originarán CPV secundarios.

    accion:

      generarCPVSecundarios

  - id: INF-CPV-004

    prioridad: 90

    descripcion:

      Si existen dudas relevantes.

    accion:

      solicitarRevisionManual

# ============================================================================
# COINCIDENCIA SEMÁNTICA
# ============================================================================

coincidenciaSemantica:

  utilizar:

    descripcionObjeto

    finalidad

    prestaciones

    sinonimos

    vocabularioTecnico

  calcular:

    porcentajeCoincidencia

# ============================================================================
# NIVEL DE CONFIANZA
# ============================================================================

confianza:

  excelente:

    minimo: 95

  alta:

    minimo: 85

  media:

    minimo: 70

  baja:

    minimo: 50

  insuficiente:

    menorQue: 50

# ============================================================================
# ACCIONES SEGÚN EL NIVEL DE CONFIANZA
# ============================================================================

accionesConfianza:

  excelente:

    seleccionarAutomaticamente: true

  alta:

    seleccionarAutomaticamente: true

  media:

    proponerRevision: true

  baja:

    solicitarConfirmacion: true

  insuficiente:

    bloquearSeleccion: true

# ============================================================================
# GESTIÓN DE CPV SECUNDARIOS
# ============================================================================

cpvSecundarios:

  permitido: true

  limiteMaximo: 5

  criterio:

    prestacionesAccesorias

# ============================================================================
# REGLAS DE PRIORIDAD
# ============================================================================

prioridades:

  1:

    prestacionPrincipal

  2:

    finalidad

  3:

    objetoContrato

  4:

    palabrasClave

  5:

    sectorActividad

# ============================================================================
# VALIDACIÓN DE RESULTADOS
# ============================================================================

validacionResultado:

  comprobar:

    - existeCPVPrincipal

    - coherenciaObjeto

    - coherenciaTipoContrato

    - ausenciaDuplicados

    - codigosValidos

# ============================================================================
# SALIDA DEL MOTOR
# ============================================================================

salidaMotor:

  generar:

    codigoPrincipal

    descripcionPrincipal

    codigosSecundarios

    nivelConfianza

    reglasAplicadas

    justificacion

    incidencias

# ============================================================================
# FIN PARTE 3 DE 10
# ============================================================================

# ============================================================================
# CASUÍSTICA ADMINISTRATIVA
# ============================================================================

casuistica:

  suministroUnico:

    descripcion: >

      El contrato tiene por objeto exclusivamente la adquisición de
      bienes muebles.

    resultado:

      CPVPrincipal:

        suministros

      CPVSecundarios: []

  servicioUnico:

    descripcion: >

      El contrato consiste exclusivamente en la prestación de servicios.

    resultado:

      CPVPrincipal:

        servicios

  obraUnica:

    descripcion: >

      El contrato tiene por objeto la ejecución de una obra.

    resultado:

      CPVPrincipal:

        obras

  contratoMixto:

    descripcion: >

      El contrato incorpora prestaciones pertenecientes a diferentes
      categorías CPV.

    accion:

      determinarPrestacionPrincipal

      generarCPVSecundarios

  acuerdoMarco:

    descripcion: >

      El CPV deberá representar el conjunto de prestaciones previstas en
      el acuerdo marco.

  sistemaDinamico:

    descripcion: >

      El CPV deberá abarcar la totalidad de las categorías susceptibles
      de contratación.

# ============================================================================
# MATRIZ DE RELACIÓN TIPO DE CONTRATO → CPV
# ============================================================================

relacionTipoContrato:

  obras:

    CPVPermitido:

      categoriaObras

  servicios:

    CPVPermitido:

      categoriaServicios

  suministros:

    CPVPermitido:

      categoriaSuministros

  concesionServicios:

    CPVPermitido:

      categoriaServicios

  concesionObras:

    CPVPermitido:

      categoriaObras

# ============================================================================
# REGLAS ESPECIALES
# ============================================================================

reglasEspeciales:

  - id: ESP-CPV-001

    descripcion:

      No podrán utilizarse CPV incompatibles entre sí como principales.

  - id: ESP-CPV-002

    descripcion:

      Los CPV secundarios nunca modificarán la naturaleza jurídica del
      contrato.

  - id: ESP-CPV-003

    descripcion:

      El CPV principal deberá corresponder siempre con la prestación
      económicamente predominante cuando exista contrato mixto.

  - id: ESP-CPV-004

    descripcion:

      Cuando existan varias prestaciones equivalentes se solicitará
      revisión técnica.

# ============================================================================
# CASOS QUE REQUIEREN VALIDACIÓN MANUAL
# ============================================================================

revisionManual:

  obligatoria:

    - contratoMixtoComplejo

    - innovacion

    - prestacionesExperimentales

    - variosSectoresActividad

    - descripcionInsuficiente

# ============================================================================
# DETECCIÓN DE INCONSISTENCIAS
# ============================================================================

inconsistencias:

  - codigo: INC-001

    descripcion:

      El CPV pertenece a una categoría incompatible con el tipo de
      contrato.

  - codigo: INC-002

    descripcion:

      El objeto describe servicios y el CPV corresponde a suministros.

  - codigo: INC-003

    descripcion:

      El objeto describe obras y el CPV pertenece a servicios.

  - codigo: INC-004

    descripcion:

      Existen varios CPV principales.

# ============================================================================
# ADVERTENCIAS
# ============================================================================

advertencias:

  - descripcion:

      La utilización de un CPV excesivamente genérico puede dificultar la
      concurrencia.

  - descripcion:

      Un CPV demasiado específico puede limitar injustificadamente el
      mercado.

  - descripcion:

      Debe comprobarse siempre la vigencia del código CPV utilizado.

# ============================================================================
# PROPUESTAS AUTOMÁTICAS
# ============================================================================

propuestas:

  generar:

    CPVPrincipal

    alternativas

    CPVSecundarios

    nivelConfianza

    justificacion

# ============================================================================
# JUSTIFICACIÓN AUTOMÁTICA
# ============================================================================

justificacion:

  incluir:

    objeto

    prestacionPrincipal

    reglasAplicadas

    normativa

    nivelConfianza

    CPVSeleccionado

# ============================================================================
# INTEGRACIÓN CON EL EXPEDIENTE
# ============================================================================

expediente:

  actualizar:

    fichaObjeto

    memoria

    PCAP

    PPT

    anuncioLicitacion

    plataformaContratacion

# ============================================================================
# PREPARACIÓN PARA KNOWLEDGE GRAPH
# ============================================================================

knowledgeGraph:

  relaciones:

    OBJETO

    PROCEDIMIENTO

    LOTES

    SOLVENCIA

    CRITERIOS

    PUBLICIDAD

# ============================================================================
# FIN PARTE 4 DE 10
# ============================================================================

# ============================================================================
# MOTOR DE VALIDACIÓN INTELIGENTE DEL CPV
# ============================================================================

motorValidacion:

  descripcion: >

    Este motor verifica que el código CPV seleccionado sea coherente con
    el objeto del contrato, la prestación principal, el tipo de contrato
    y el resto de módulos del expediente.

  ejecutar:

    automaticamente: true

# ============================================================================
# VALIDACIONES OBLIGATORIAS
# ============================================================================

validaciones:

  - id: VAL-CPV-001

    prioridad: 100

    descripcion:

      Debe existir exactamente un CPV principal.

    accion:

      validarCPVPrincipal

  - id: VAL-CPV-002

    prioridad: 100

    descripcion:

      El CPV principal deberá corresponder con la prestación principal.

    accion:

      validarPrestacionPrincipal

  - id: VAL-CPV-003

    prioridad: 95

    descripcion:

      Los CPV secundarios deberán describir únicamente prestaciones
      accesorias.

    accion:

      validarSecundarios

  - id: VAL-CPV-004

    prioridad: 95

    descripcion:

      El CPV deberá ser compatible con el tipo contractual.

    accion:

      validarTipoContrato

  - id: VAL-CPV-005

    prioridad: 90

    descripcion:

      El CPV deberá existir en el catálogo oficial vigente.

    accion:

      validarExistencia

# ============================================================================
# COMPROBACIONES CRUZADAS
# ============================================================================

comprobacionesCruzadas:

  objeto:

    comprobar: true

  procedimiento:

    comprobar: true

  lotes:

    comprobar: true

  solvencia:

    comprobar: true

  criterios:

    comprobar: true

  presupuesto:

    comprobar: true

# ============================================================================
# MATRIZ DE COHERENCIA
# ============================================================================

coherencia:

  objetoCPV:

    obligatoria: true

  CPVTipoContrato:

    obligatoria: true

  CPVProcedimiento:

    obligatoria: true

  CPVPublicidad:

    obligatoria: true

  CPVLotes:

    obligatoria: true

# ============================================================================
# DETECCIÓN DE ERRORES
# ============================================================================

errores:

  criticos:

    - variosCPVPrincipales

    - CPVInexistente

    - CPVContradictorio

    - tipoContratoIncompatible

  graves:

    - descripcionInsuficiente

    - CPVGenerico

    - CPVSecundarioIncorrecto

  leves:

    - descripcionMejorable

    - confianzaMedia

# ============================================================================
# ACCIONES CORRECTORAS
# ============================================================================

acciones:

  variosCPVPrincipales:

    eliminarDuplicados

  CPVGenerico:

    proponerMayorPrecision

  descripcionInsuficiente:

    solicitarAmpliacion

  confianzaBaja:

    solicitarRevisionHumana

# ============================================================================
# NIVEL DE CONFIANZA
# ============================================================================

nivelConfianza:

  calcular:

    objeto

    prestaciones

    finalidad

    coincidenciaSemantica

    reglasAplicadas

  devolver:

    porcentaje

# ============================================================================
# JUSTIFICACIÓN DE LA DECISIÓN
# ============================================================================

justificacion:

  incluirSiempre:

    objeto

    prestacionPrincipal

    CPVPrincipal

    normativa

    reglasAplicadas

    confianza

# ============================================================================
# VALIDACIÓN PARA PLATAFORMA DE CONTRATACIÓN
# ============================================================================

plataformaContratacion:

  comprobar:

    codigoValido

    formatoCorrecto

    longitudCorrecta

    existenciaCatalogo

# ============================================================================
# COMPATIBILIDAD CON GIRO
# ============================================================================

GIRO:

  validar:

    CPVPrincipal

    CPVSecundarios

    descripcion

# ============================================================================
# INDICADORES
# ============================================================================

indicadores:

  CPVCorrecto:

    objetivo: 100

  confianzaMedia:

    objetivo: 90

  revisionesManuales:

    objetivo: 5

# ============================================================================
# SALIDA DEL VALIDADOR
# ============================================================================

salida:

  estado:

    valido

    revisar

    rechazado

  informe:

    generarAutomaticamente: true

# ============================================================================
# FIN PARTE 5 DE 10
# ============================================================================

# ============================================================================
# MOTOR DE RECOMENDACIONES CPV
# ============================================================================

motorRecomendaciones:

  descripcion: >

    Este motor analiza la calidad de la selección realizada y propone
    mejoras cuando detecta oportunidades para aumentar la precisión del
    código CPV seleccionado.

  ejecutar:

    despuesDeValidacion: true

# ============================================================================
# OBJETIVOS
# ============================================================================

objetivos:

  - mejorarPrecision

  - reducirErrores

  - aumentarTransparencia

  - facilitarConcurrencia

  - mejorarCalidadExpediente

# ============================================================================
# RECOMENDACIONES AUTOMÁTICAS
# ============================================================================

recomendaciones:

  - id: REC-CPV-001

    prioridad: alta

    condicion:

      CPVGenerico: true

    accion:

      Proponer un código CPV de mayor precisión.

  - id: REC-CPV-002

    prioridad: alta

    condicion:

      confianzaMenor:

        valor: 80

    accion:

      Revisar la descripción del objeto del contrato.

  - id: REC-CPV-003

    prioridad: media

    condicion:

      multiplesPrestaciones: true

    accion:

      Analizar la conveniencia de utilizar CPV secundarios.

  - id: REC-CPV-004

    prioridad: media

    condicion:

      descripcionMuyBreve: true

    accion:

      Solicitar ampliación de la descripción del objeto.

  - id: REC-CPV-005

    prioridad: baja

    condicion:

      excesoDetalle: true

    accion:

      Simplificar la descripción administrativa.

# ============================================================================
# DETECCIÓN DE CPV DEMASIADO GENÉRICOS
# ============================================================================

deteccionGenericos:

  descripcion:

    El sistema detectará códigos CPV excesivamente amplios cuando exista
    un código más específico que describa mejor la prestación.

  accion:

    proponerMayorPrecision

# ============================================================================
# DETECCIÓN DE CPV EXCESIVAMENTE ESPECÍFICOS
# ============================================================================

deteccionEspecificos:

  descripcion:

    Cuando el CPV seleccionado limite innecesariamente la concurrencia,
    el sistema propondrá un nivel superior dentro de la jerarquía CPV.

  accion:

    proponerCategoriaSuperior

# ============================================================================
# RECOMENDACIONES SOBRE EL OBJETO
# ============================================================================

objeto:

  comprobar:

    claridad

    precisión

    coherencia

    neutralidad

  mejoras:

    - ampliarPrestaciones

    - eliminarAmbigüedades

    - mejorarTerminología

# ============================================================================
# COHERENCIA CON LA LCSP
# ============================================================================

coherenciaLCSP:

  verificar:

    objeto

    necesidad

    tipoContrato

    procedimiento

    publicidad

  resultado:

    informeCoherencia

# ============================================================================
# PROPUESTAS AL USUARIO
# ============================================================================

propuestas:

  mostrar:

    codigoPrincipal

    codigosAlternativos

    porcentajeConfianza

    ventajas

    inconvenientes

# ============================================================================
# PRIORIZACIÓN DE ALTERNATIVAS
# ============================================================================

alternativas:

  maximo:

    3

  ordenarPor:

    - confianza

    - precisión

    - coherencia

# ============================================================================
# EXPLICACIÓN PARA EL USUARIO
# ============================================================================

