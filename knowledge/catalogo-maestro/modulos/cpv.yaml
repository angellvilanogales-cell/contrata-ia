casuisticaAvanzada:

  objetivo: >

    Proporcionar reglas específicas para aquellos expedientes cuya
    clasificación CPV presenta mayor complejidad o genera dudas
    frecuentes durante la tramitación administrativa.

# ============================================================================
# CONTRATOS TIC
# ============================================================================

contratosTIC:

  detectar:

    palabrasClave:

      - software

      - hardware

      - aplicación

      - desarrollo

      - mantenimiento informático

      - ciberseguridad

      - servidores

      - cloud

      - inteligencia artificial

      - licencias

  recomendaciones:

    comprobarPrestacionPrincipal: true

    separar:

      suministroHardware

      desarrolloSoftware

      mantenimiento

# ============================================================================
# CONTRATOS DE FORMACIÓN
# ============================================================================

