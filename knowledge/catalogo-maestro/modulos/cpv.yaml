snippets:

  seleccionCPV:

    texto: >

      El código CPV ha sido seleccionado atendiendo a la prestación
      principal objeto del contrato, de conformidad con el Reglamento
      (CE) 213/2008 y con el artículo 99 de la Ley 9/2017.

  contratoMixto:

    texto: >

      Al tratarse de un contrato mixto, el código CPV principal se ha
      determinado conforme a la prestación económicamente y
      funcionalmente predominante.

  CPVSecundarios:

    texto: >

      Se incorporan códigos CPV secundarios para describir prestaciones
      accesorias sin alterar la naturaleza jurídica del contrato.

