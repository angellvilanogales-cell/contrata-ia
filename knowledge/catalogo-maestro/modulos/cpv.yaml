    reglasAplicadas

    diferenciasConAlternativas

    referenciasNormativas

# ============================================================================
# RECOMENDACIONES PARA EL TRAMITADOR
# ============================================================================

tramitador:

  avisos:

    - Revisar siempre el objeto antes de modificar un CPV.

    - Evitar seleccionar códigos por similitud de nombre.

    - Priorizar la prestación principal sobre las accesorias.

    - Utilizar CPV secundarios únicamente cuando aporten información
      relevante.

# ============================================================================
# APRENDIZAJE SUPERVISADO
# ============================================================================

