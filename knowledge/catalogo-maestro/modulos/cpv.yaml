# ============================================================================

suministroInstalacion:

  comprobar:

    costeInstalacion

    importanciaFuncional

  regla:

    La instalación accesoria no modifica el CPV principal cuando el
    suministro constituye la prestación predominante.

# ============================================================================
# CONTRATOS DE OBRAS
# ============================================================================

obras:

  comprobar:

    proyecto

    direcciónFacultativa

    ejecuciónMaterial

  distinguir:

    obraNueva

    reforma

    rehabilitación

    conservación

