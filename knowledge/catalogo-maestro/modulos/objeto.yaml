# ============================================================================
# CONTRATA IA
# BANCO DE CONOCIMIENTO
# ============================================================================
#
# MÓDULO..............: OBJETO DEL CONTRATO
# CÓDIGO..............: MEM.OBJ
# VERSIÓN.............: 1.0.0
# ESTADO..............: PRODUCCIÓN
# TIPO................: MÓDULO DE CONOCIMIENTO
# CRITICIDAD..........: MÁXIMA
# DEPENDE.............: MEM.NEC
# UTILIZADO POR.......:
#   - Memoria Justificativa
#   - PCAP
#   - PPT
#   - Motor CPV
#   - Motor de Procedimiento
#   - Motor de Lotes
#   - Motor de Solvencia
# AUTOR...............: CONTRATA IA
# ============================================================================
#
schema:

  id: CONTRATAIA.MODULO.OBJETO

  codigo: MEM.OBJ

  version: 1.0.0

  estado: produccion

# ============================================================================
# OBJETIVO DEL MÓDULO
# ============================================================================

objetivo:

  descripcion: >

    Determinar correctamente el objeto del contrato, describiendo de
    forma precisa la prestación que pretende contratar la Administración
    y garantizando que dicha descripción permita identificar la
    naturaleza jurídica del contrato, seleccionar correctamente el código
    CPV, definir la división en lotes y determinar el procedimiento de
    adjudicación conforme a la LCSP.

# ============================================================================
# FUNDAMENTO JURÍDICO
# ============================================================================

normativa:

  principal:

    ley: Ley 9/2017

    articulo: 99

    descripcion: >

      Objeto del contrato.

  relacionada:

    - articulo: 28
      descripcion: Necesidad e idoneidad.

    - articulo: 116
      descripcion: Expediente de contratación.

    - articulo: 145
      descripcion: Criterios de adjudicación.

# ============================================================================
# DEFINICIÓN DEL CONCEPTO
# ============================================================================

concepto:

  nombre:

    Objeto del contrato

  definicion: >

    Prestación concreta que la Administración pretende obtener mediante
    un contrato público para satisfacer una necesidad previamente
    justificada.

  principios:

    - claridad

    - precisión

    - objetividad

    - neutralidad

    - proporcionalidad

# ============================================================================
# OBJETIVOS DEL OBJETO CONTRACTUAL
# ============================================================================

objetivos:

  principales:

    - describir exactamente la prestación

    - evitar ambigüedades

    - permitir identificar el CPV

    - permitir determinar el procedimiento

    - facilitar la concurrencia

# ============================================================================
# CARACTERÍSTICAS OBLIGATORIAS
# ============================================================================

caracteristicas:

  obligatorias:

    - descripción suficiente

    - coherencia con la necesidad

    - ausencia de referencias discriminatorias

    - neutralidad tecnológica

    - precisión técnica

  recomendadas:

    - lenguaje administrativo

    - estructura homogénea

    - terminología CPV

# ============================================================================
# VARIABLES DEL MÓDULO
# ============================================================================

variables:

  descripcionPrestacion:

    tipo: texto

    obligatorio: true

  tipoContrato:

    tipo: lista

    obligatorio: true

    valores:

      - obras

      - servicios

      - suministros

      - concesion_servicios

      - concesion_obras

      - mixto

  finalidad:

    tipo: texto

    obligatorio: true

  alcance:

    tipo: texto

    obligatorio: false

# ============================================================================
# FIN PARTE 1
# ============================================================================

# ============================================================================
# RELACIÓN CON LA NECESIDAD
# ============================================================================

relacionNecesidad:

  descripcion: >

    El objeto del contrato deberá derivar directa y exclusivamente de la
    necesidad previamente justificada en el expediente.

  comprobaciones:

    - existeNecesidad

    - coherenciaConNecesidad

    - finalidadCoincidente

    - competenciaAdministrativa

# ============================================================================
# PRINCIPIOS JURÍDICOS
# ============================================================================

principios:

  igualdad:

    descripcion: >

      El objeto no podrá favorecer directa ni indirectamente a ningún
      operador económico.

  libreCompetencia:

    descripcion: >

      La definición del objeto deberá facilitar la concurrencia.

  proporcionalidad:

    descripcion: >

      El objeto únicamente comprenderá las prestaciones necesarias para
      satisfacer la necesidad.

  eficiencia:

    descripcion: >

      El objeto deberá permitir una utilización eficiente de los recursos
      públicos.

# ============================================================================
# REGLAS GENERALES
# ============================================================================

reglas:

  - id: OBJ-001

    prioridad: 100

    descripcion: >

      Todo objeto deberá estar vinculado a una necesidad previamente
      acreditada.

    condicion:

      necesidadExiste: true

    accion:

      permitirContinuar: true

  - id: OBJ-002

    prioridad: 100

    descripcion: >

      No podrá existir más de un objeto principal.

    condicion:

      objetosPrincipales:

        maximo: 1

    accion:

      validar: true

  - id: OBJ-003

    prioridad: 95

    descripcion: >

      Las prestaciones accesorias deberán guardar relación directa con
      el objeto principal.

    accion:

      comprobarPrestacionesAccesorias: true

  - id: OBJ-004

    prioridad: 90

    descripcion: >

      El objeto deberá describirse mediante prestaciones y nunca mediante
      marcas comerciales.

    accion:

      comprobarNeutralidad: true

# ============================================================================
# RESTRICCIONES
# ============================================================================

restricciones:

  prohibido:

    - utilizarMarcas

    - utilizarFabricantes

    - limitarCompetencia

    - referenciasDiscriminatorias

    - descripcionAmbigua

  permitido:

    - referenciasTecnicasNormalizadas

    - normasUNE

    - normasISO

# ============================================================================
# CLASIFICACIÓN DEL OBJETO
# ============================================================================

clasificacion:

  principal:

    obras

    servicios

    suministros

    concesion_obras

    concesion_servicios

    mixto

  especial:

    innovacion

    defensa

    social

    sanitario

    tecnologico

# ============================================================================
# DETERMINACIÓN DEL TIPO CONTRACTUAL
# ============================================================================

tipoContractual:

  criterio:

    prestacionPrincipal

  reglas:

    contratoMixto:

      determinarPrestacionPrincipal: true

      aplicarLCSP: true

# ============================================================================
# VARIABLES DERIVADAS
# ============================================================================

variablesDerivadas:

  genera:

    - codigoCPV

    - tipoProcedimiento

    - posibilidadLotes

    - solvencia

    - criteriosAdjudicacion

    - plazo

# ============================================================================
# DEPENDENCIAS
# ============================================================================

dependencias:

  entrada:

    - MEM.NEC

  salida:

    - MEM.CPV

    - MEM.PROC

    - MEM.LOTES

    - MEM.SOLV

    - MEM.CRITERIOS

# ============================================================================
# VALIDACIONES
# ============================================================================

validaciones:

  automaticas:

    - objetoNoVacio

    - longitudMinima

    - lenguajeAdministrativo

    - coherenciaNecesidad

    - ausenciaMarcas

    - tipoContratoValido

  manuales:

    - revisionTecnica

    - validacionUnidadPromotora

# ============================================================================
# CASOS ESPECIALES
# ============================================================================

casosEspeciales:

  contratoMixto:

    permitido: true

    requiereJustificacion: true

  objetoComplejo:

    permitido: true

    requiereDescripcionAmpliada: true

  objetoInnovador:

    permitido: true

    requiereMotivacion: true

# ============================================================================
# FIN PARTE 2
# ============================================================================

# ============================================================================
# CASUÍSTICA DEL OBJETO CONTRACTUAL
# ============================================================================

casuistica:

  suministroSimple:

    descripcion: >

      Adquisición de bienes homogéneos sin instalación significativa.

    resultado:

      tipoContrato: suministros

      admiteLotes: true

  suministroInstalacion:

    descripcion: >

      Suministro que incorpora instalación o puesta en funcionamiento.

    comprobar:

      prestacionPrincipal

  servicioIntelectual:

    descripcion: >

      Prestaciones basadas fundamentalmente en conocimiento técnico,
      científico o profesional.

    caracteristicas:

      - creatividad

      - planificación

      - consultoría

      - asistencia técnica

  mantenimiento:

    descripcion: >

      Prestaciones periódicas destinadas a conservar instalaciones,
      edificios, equipos o sistemas.

    tipo:

      servicios

  obraNueva:

    descripcion: >

      Ejecución de una obra de nueva planta.

    tipo:

      obras

  reforma:

    descripcion: >

      Actuaciones de reforma, reparación o adecuación.

    tipo:

      obras

  contratoMixto:

    descripcion: >

      Existencia de varias prestaciones diferentes.

    aplicar:

      determinarPrestacionPrincipal

# ============================================================================
# MATRIZ DE DECISIÓN
# ============================================================================

matrizDecision:

  - id: MAT-OBJ-001

    condicion:

      prestacionPrincipal: servicios

    resultado:

      tipoContrato: servicios

  - id: MAT-OBJ-002

    condicion:

      prestacionPrincipal: suministros

    resultado:

      tipoContrato: suministros

  - id: MAT-OBJ-003

    condicion:

      prestacionPrincipal: obras

    resultado:

      tipoContrato: obras

  - id: MAT-OBJ-004

    condicion:

      contratoMixto: true

    resultado:

      ejecutar:

        determinarPrestacionPrincipal

# ============================================================================
# REGLAS DE REDACCIÓN
# ============================================================================

redaccion:

  comenzarPor:

    - verbo

    - prestación

    - finalidad

  evitar:

    - frases ambiguas

    - objetivos políticos

    - referencias económicas

    - criterios de adjudicación

  utilizar:

    - lenguaje administrativo

    - lenguaje técnico

    - terminología LCSP

# ============================================================================
# VARIANTES DOCUMENTALES
# ============================================================================

variantes:

  suministro:

    texto: |

      El objeto del contrato consiste en el suministro de los bienes
      necesarios para satisfacer la necesidad previamente justificada,
      incluyendo todas las prestaciones accesorias imprescindibles para
      su correcta utilización.

  servicios:

    texto: |

      El objeto del contrato consiste en la prestación de los servicios
      descritos en la presente memoria, destinados a garantizar el
      adecuado funcionamiento del servicio público.

  obras:

    texto: |

      El objeto del contrato consiste en la ejecución de las obras
      necesarias para alcanzar las condiciones funcionales previstas en
      la presente memoria justificativa.

  mixto:

    texto: |

      El contrato integra diversas prestaciones, considerándose como
      principal aquella que determina su régimen jurídico conforme a la
      legislación vigente.

# ============================================================================
# VALIDACIONES JURÍDICAS
# ============================================================================

validacionesJuridicas:

  - id: VAL-OBJ-001

    descripcion:

      El objeto debe ser único.

    gravedad:

      critica

  - id: VAL-OBJ-002

    descripcion:

      El objeto debe ser determinado.

    gravedad:

      critica

  - id: VAL-OBJ-003

    descripcion:

      El objeto debe ser posible.

    gravedad:

      critica

  - id: VAL-OBJ-004

    descripcion:

      El objeto debe guardar relación con la necesidad.

    gravedad:

      critica

  - id: VAL-OBJ-005

    descripcion:

      Debe permitir la selección del CPV.

    gravedad:

      alta

# ============================================================================
# DETECCIÓN DE ERRORES
# ============================================================================

errores:

  - codigo: ERR-OBJ-001

    descripcion:

      Objeto excesivamente genérico.

    accion:

      solicitarRevision

  - codigo: ERR-OBJ-002

    descripcion:

      Objeto excesivamente amplio.

    accion:

      proponerDivisionLotes

  - codigo: ERR-OBJ-003

    descripcion:

      Objeto incompatible con la necesidad.

    accion:

      bloquearExpediente

  - codigo: ERR-OBJ-004

    descripcion:

      No puede determinarse el tipo contractual.

    accion:

      solicitarAclaracion

# ============================================================================
# PREGUNTAS PARA EL ASISTENTE
# ============================================================================

preguntasIA:

  - ¿Qué pretende contratar exactamente la Administración?

  - ¿Cuál es la prestación principal?

  - ¿Existen prestaciones accesorias?

  - ¿Puede dividirse en lotes?

  - ¿Qué resultado final espera obtener la Administración?

# ============================================================================
# OBSERVACIONES PARA EL MOTOR EXPERTO
# ============================================================================

motorExperto:

  generarResumen: true

  detectarCPV: true

  detectarTipoContrato: true

  detectarContratoMixto: true

  proponerLotes: true

  validarCoherencia: true

# ============================================================================
# FIN PARTE 3
# ============================================================================

# ============================================================================
# MOTOR DE INFERENCIA DEL OBJETO CONTRACTUAL
# ============================================================================

motorInferencia:

  descripcion: >

    A partir de la información introducida por el usuario el sistema
    determinará automáticamente las características principales del
    contrato.

  entradas:

    necesidad

    descripcionPrestacion

    finalidad

    alcance

  genera:

    tipoContrato

    CPV

    procedimiento

    posibilidadDivisionLotes

    tipoSolvencia

    complejidad

# ============================================================================
# REGLAS DE INFERENCIA
# ============================================================================

inferencia:

  - id: INF-OBJ-001

    prioridad: 100

    descripcion:

      Si existe ejecución material de obra.

    condicion:

      contiene:

        - construir

        - ejecutar obra

        - reforma

        - rehabilitación

        - ampliación

    resultado:

      tipoContrato:

        obras

  - id: INF-OBJ-002

    prioridad: 100

    descripcion:

      Si el objetivo principal consiste en adquirir bienes.

    condicion:

      contiene:

        - suministro

        - adquisición

        - compra

        - entrega

    resultado:

      tipoContrato:

        suministros

  - id: INF-OBJ-003

    prioridad: 100

    descripcion:

      Si la prestación consiste en actividad profesional.

    condicion:

      contiene:

        - mantenimiento

        - limpieza

        - asistencia

        - consultoría

        - vigilancia

        - formación

    resultado:

      tipoContrato:

        servicios

# ============================================================================
# NIVEL DE COMPLEJIDAD
# ============================================================================

complejidad:

  baja:

    descripcion:

      Prestación perfectamente definida.

  media:

    descripcion:

      Varias prestaciones relacionadas.

  alta:

    descripcion:

      Prestaciones complejas o mixtas.

# ============================================================================
# DETERMINACIÓN DEL CPV
# ============================================================================

cpv:

  estrategia:

    localizarPrestacionPrincipal

  reglas:

    - buscarCoincidenciaExacta

    - buscarCoincidenciaSemantica

    - proponerAlternativas

    - justificarSeleccion

# ============================================================================
# RELACIÓN CON EL MOTOR CPV
# ============================================================================

integracionCPV:

  enviar:

    descripcionPrestacion

    tipoContrato

    finalidad

  recibir:

    codigoPrincipal

    codigosSecundarios

    confianza

# ============================================================================
# RELACIÓN CON LOTES
# ============================================================================

integracionLotes:

  comprobar:

    prestacionesIndependientes

    ambitosTerritoriales

    especialidades

    volumenPrestacion

  resultado:

    recomendarDivision

# ============================================================================
# RELACIÓN CON PROCEDIMIENTO
# ============================================================================

integracionProcedimiento:

  enviar:

    tipoContrato

    valorEstimado

    CPV

  recibir:

    procedimiento

    publicidad

    plazos

# ============================================================================
# REGLAS DE CALIDAD DOCUMENTAL
# ============================================================================

calidadDocumental:

  descripcion:

    minimaPalabras:

      30

    maximaPalabras:

      500

  comprobar:

    claridad

    coherencia

    ausenciaDuplicidades

    lenguajeAdministrativo

# ============================================================================
# PATRONES DE REDACCIÓN
# ============================================================================

patrones:

  inicio:

    - El objeto del contrato consiste en...

    - Constituye el objeto del presente contrato...

    - La finalidad del contrato es...

  desarrollo:

    - incluyendo

    - comprendiendo

    - abarcando

    - incorporando

  cierre:

    - de conformidad con la necesidad previamente acreditada.

    - conforme a la presente memoria justificativa.

# ============================================================================
# FRASES PROHIBIDAS
# ============================================================================

frasesProhibidas:

  - mejor empresa

  - marca determinada

  - proveedor habitual

  - empresa concreta

  - cualquier otra referencia discriminatoria

# ============================================================================
# CONTROL DE COHERENCIA
# ============================================================================

coherencia:

  comprobar:

    necesidadObjeto

    objetoCPV

    objetoProcedimiento

    objetoLotes

    objetoSolvencia

    objetoPresupuesto

# ============================================================================
# SALIDA DEL MÓDULO
# ============================================================================

salida:

  genera:

    descripcionObjeto

    tipoContrato

    propuestaCPV

    propuestaLotes

    propuestaProcedimiento

    resumenTecnico

    informeValidacion

# ============================================================================
# FIN PARTE 4
# ============================================================================

# ============================================================================
# MOTOR DE RECOMENDACIONES
# ============================================================================

recomendaciones:

  descripcion: >

    El módulo podrá formular recomendaciones técnicas destinadas a
    mejorar la calidad jurídica y administrativa del objeto del contrato.

  objetivos:

    - mejorar_precision

    - facilitar_concurrencia

    - reducir_riesgos

    - aumentar_seguridad_juridica

# ============================================================================
# RECOMENDACIONES AUTOMÁTICAS
# ============================================================================

recomendacionesAutomaticas:

  - id: REC-OBJ-001

    condicion:

      longitudDescripcion:

        menorQue: 40

    recomendacion:

      Ampliar la descripción del objeto contractual.

  - id: REC-OBJ-002

    condicion:

      contieneMarcas: true

    recomendacion:

      Sustituir las referencias comerciales por especificaciones
      funcionales o técnicas.

  - id: REC-OBJ-003

    condicion:

      contratoMixto: true

    recomendacion:

      Justificar expresamente la prestación principal.

  - id: REC-OBJ-004

    condicion:

      multiplesPrestaciones: true

    recomendacion:

      Analizar la conveniencia de dividir el contrato en lotes.

# ============================================================================
# RIESGOS JURÍDICOS
# ============================================================================

riesgos:

  muyAltos:

    - objetoIndeterminado

    - objetoImposible

    - objetoDiscriminatorio

    - restriccionCompetencia

  altos:

    - descripcionInsuficiente

    - contratoMixtoSinJustificacion

    - ausenciaPrestacionPrincipal

  medios:

    - excesoDetalle

    - terminologiaNoNormalizada

# ============================================================================
# MATRIZ DE RIESGO
# ============================================================================

matrizRiesgo:

  impacto:

    bajo

    medio

    alto

    critico

  probabilidad:

    baja

    media

    alta

# ============================================================================
# BUENAS PRÁCTICAS
# ============================================================================

buenasPracticas:

  siempre:

    - describirLaPrestacion

    - utilizarLenguajeObjetivo

    - identificarResultadoEsperado

    - justificarPrestacionesAccesorias

    - mantenerCoherenciaConLaNecesidad

  evitar:

    - copiarPliegosAntiguos

    - incluirClausulasInnecesarias

    - mezclarObjetivosDiferentes

# ============================================================================
# INDICADORES DE CALIDAD DEL OBJETO
# ============================================================================

indicadores:

  descripcionClara:

    peso: 20

  coherenciaNecesidad:

    peso: 20

  precisionTecnica:

    peso: 20

  neutralidad:

    peso: 20

  identificacionCPV:

    peso: 20

# ============================================================================
# PUNTUACIÓN DEL MÓDULO
# ============================================================================

evaluacion:

  maxima:

    100

  niveles:

    excelente:

      desde: 95

    alta:

      desde: 85

    aceptable:

      desde: 70

    revisar:

      desde: 50

    rechazar:

      desde: 0

# ============================================================================
# OBSERVACIONES PARA EL ORQUESTADOR
# ============================================================================

workflow:

  ejecutarDespues:

    MEM.NEC

  ejecutarAntes:

    MEM.CPV

    MEM.PROCEDIMIENTO

    MEM.LOTES

    MEM.SOLVENCIA

    MEM.CRITERIOS

# ============================================================================
# DATOS PARA EL KNOWLEDGE GRAPH
# ============================================================================

knowledgeGraph:

  nodo:

    OBJETO_CONTRATO

  relaciones:

    - NECESIDAD

    - CPV

    - LOTES

    - PROCEDIMIENTO

    - SOLVENCIA

    - PRESUPUESTO

    - CRITERIOS

# ============================================================================
# PREPARACIÓN PARA EMBEDDINGS
# ============================================================================

embeddings:

  indexar:

    descripcionObjeto

    finalidad

    conceptos

    ejemplos

    reglas

  prioridad:

    alta

# ============================================================================
# INFORMACIÓN PARA RAG
# ============================================================================

rag:

  recuperar:

    normativa

    reglas

    ejemplos

    recomendaciones

    variantes

  contextoMinimo:

    necesidad

    objeto

# ============================================================================
# HISTORIAL DEL MÓDULO
# ============================================================================

historial:

  version:

    1.0.0

  cambios:

    - Creación inicial del módulo.

  estado:

    Producción

# ============================================================================
# FIN PARTE 5
# ============================================================================

# ============================================================================
# CASOS DE USO ADMINISTRATIVOS
# ============================================================================

casosUso:

  - id: CASO-001

    nombre: Servicio de limpieza

    tipoContrato: servicios

    prestaciones:

      - limpieza

      - suministro de consumibles

    admiteLotes: true

    CPVPrincipal:

      determinarAutomaticamente: true

  - id: CASO-002

    nombre: Suministro de equipos informáticos

    tipoContrato: suministros

    prestaciones:

      - adquisición

      - entrega

      - garantía

      - instalación

    comprobarPrestacionPrincipal: true

  - id: CASO-003

    nombre: Obra de reforma

    tipoContrato: obras

    prestaciones:

      - demolición

      - construcción

      - acabados

    proyectoObligatorio: true

  - id: CASO-004

    nombre: Contrato mixto

    tipoContrato: mixto

    determinarPrestacionPrincipal: true

# ============================================================================
# CASOS NO PERMITIDOS
# ============================================================================

casosNoPermitidos:

  - objetoMultipleSinRelacion

  - objetoIndeterminado

  - objetoInviable

  - objetoConMarcaComercial

  - objetoDiscriminatorio

  - objetoSinNecesidad

# ============================================================================
# MATRIZ DE DECISIONES
# ============================================================================

matriz:

  descripcionPrestacion:

    determina:

      tipoContrato

      CPV

      procedimiento

      lotes

      solvencia

      criterios

  tipoContrato:

    determina:

      normativaAplicable

      publicidad

      plazos

# ============================================================================
# CONOCIMIENTO EXPERTO
# ============================================================================

conocimientoExperto:

  recomendaciones:

    - El objeto debe describir prestaciones, nunca procedimientos.

    - El objeto no debe contener criterios de adjudicación.

    - El objeto no debe incorporar solvencia.

    - El objeto no debe incluir penalidades.

    - El objeto debe mantenerse estable durante toda la licitación.

# ============================================================================
# PREGUNTAS DINÁMICAS
# ============================================================================

preguntasDinamicas:

  primera:

    texto:

      ¿Qué necesita realmente contratar la Administración?

  segunda:

    texto:

      ¿Cuál será el resultado final que recibirá la Administración?

  tercera:

    texto:

      ¿Existen varias prestaciones independientes?

  cuarta:

    texto:

      ¿La prestación consiste principalmente en ejecutar obras, prestar
      servicios o suministrar bienes?

# ============================================================================
# GENERACIÓN DE RESUMEN
# ============================================================================

resumenAutomatico:

  generar: true

  incluir:

    - tipoContrato

