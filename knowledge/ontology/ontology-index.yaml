# =============================================================================
# CONTRATA-IA
# KNOWLEDGE ONTOLOGY
# MASTER INDEX
# =============================================================================

ontology:

  name: CONTRATA-IA Ontology

  version: 1.0.0

  language: es-ES

  jurisdiction: Spain

  administration: Junta de Andalucía

  domain: Public Procurement

# =============================================================================
# PURPOSE
# =============================================================================

purpose:

  description: >

    Central semantic model used by the Expert System.

    Defines every concept, relationship and legal entity used
    during reasoning.

# =============================================================================
# KNOWLEDGE MODEL
# =============================================================================

knowledgeModel:

  ontologyDriven: true

  semanticReasoning: true

  deterministicInference: true

  explainableKnowledge: true

# =============================================================================
# ROOT DOMAINS
# =============================================================================

domains:

  contracts

  procedures

  cpv

  organizations

  actors

  documents

  legalEntities

  administrativeStates

  contractExecution

  legalRelationships

  legalSources

  jurisprudence

  doctrine

  reports

  templates

# =============================================================================
# REPOSITORIES
# =============================================================================

repositories:

  contracts:

    file: contracts.yaml

  procedures:

    file: procedures.yaml

  cpv:

    file: cpv.yaml

  organizations:

    file: organizations.yaml

  actors:

    file: actors.yaml

  documents:

    file: documents.yaml

  legalEntities:

    file: legal_entities.yaml

  administrativeStates:

    file: administrative_states.yaml

  contractExecution:

    file: contract_execution.yaml

  legalRelationships:

    file: legal_relationships.yaml

# =============================================================================
# EXTENDED REPOSITORIES
# =============================================================================

extendedRepositories:

  legislation:

    file: legislation.yaml

  jurisprudence:

    file: jurisprudence.yaml

  consultiveReports:

    file: consultive_reports.yaml

  doctrine:

    file: doctrine.yaml

  glossary:

    file: glossary.yaml

  taxonomy:

    file: taxonomy.yaml

# =============================================================================
# LOADING ORDER
# =============================================================================

loadingSequence:

  glossary

  taxonomy

  legalEntities

  organizations

  actors

  contracts

  procedures

  cpv

  documents

  legalRelationships

  legislation

  doctrine

  jurisprudence

  reports

  templates

  # =============================================================================
# SEMANTIC CORE
# NÚCLEO SEMÁNTICO DE LA ONTOLOGÍA
# =============================================================================

semanticCore:

  enabled: true

  deterministic: true

  ontologyDriven: true

  semanticValidation: true

  inferRelationships: true

# =============================================================================
# CORE PRINCIPLES
# =============================================================================

semanticPrinciples:

  uniqueIdentity: true

  explicitRelationships: true

  inheritanceSupported: true

  compositionSupported: true

  semanticIntegrity: true

  legalConsistency: true

# =============================================================================
# ROOT ENTITY
# =============================================================================

rootEntity:

  id: ENTITY

  description: Root semantic object

# =============================================================================
# ENTITY CATEGORIES
# =============================================================================

entityCategories:

  legal

  administrative

  contractual

  documentary

  organizational

  procedural

  economic

  temporal

  geographical

# =============================================================================
# IDENTIFICATION MODEL
# =============================================================================

identificationModel:

  uniqueIdentifier: true

  globallyUnique: true

  immutableIdentifier: true

  semanticIdentifier: true

# =============================================================================
# COMMON ATTRIBUTES
# =============================================================================

commonAttributes:

  identifier

  code

  name

  description

  status

  version

  validFrom

  validTo

  createdAt

  updatedAt

# =============================================================================
# SEMANTIC RELATION TYPES
# =============================================================================

relationshipTypes:

  isA

  partOf

  dependsOn

  references

  requires

  authorizes

  prohibits

  modifies

  extends

  replaces

# =============================================================================
# INHERITANCE
# =============================================================================

inheritance:

  enabled: true

  multipleInheritance: false

  overrideAllowed: false

  preserveParentProperties: true

# =============================================================================
# COMPOSITION
# =============================================================================

composition:

  enabled: true

  recursiveComposition: true

  aggregateChildren: true

# =============================================================================
# VALIDATION RULES
# =============================================================================

semanticValidation:

  verifyIdentifiers: true

  verifyRelationships: true

  verifyInheritance: true

  verifyComposition: true

  verifyIntegrity: true

# =============================================================================
# DEPENDENCY GRAPH
# =============================================================================

dependencyGraph:

  enabled: true

  directedGraph: true

  acyclicValidation: true

  detectCircularDependencies: true

# =============================================================================
# KNOWLEDGE NAVIGATION
# =============================================================================

knowledgeNavigation:

  parentTraversal: true

  childTraversal: true

  relationshipTraversal: true

  dependencyTraversal: true

# =============================================================================
# SEMANTIC INDEXES
# =============================================================================

semanticIndexes:

  entityIndex: true

  relationshipIndex: true

  dependencyIndex: true

  inheritanceIndex: true

# =============================================================================
# PERFORMANCE
# =============================================================================

semanticPerformance:

  preloadCoreEntities: true

  optimizeTraversal: true

  cacheRelationships: true

# =============================================================================
# RESULT
# =============================================================================

semanticCoreResult:

  success: semanticCoreReady

  failure: semanticCoreInitializationFailed

