# ============================================================================
# CONTRATA IA
# MOTOR DE REGLAS DE PLIEGOS
# Archivo:
# knowledge/rules/pliegos.rules.yaml
#
# Núcleo jurídico para la generación automática de:
#   • PCAP
#   • PPT
#   • Cuadro de Características
#   • Anexos
#   • Informes
#   • Memorias
#
# Basado en:
#   • Ley 9/2017 (LCSP)
#   • Ley 39/2015
#   • Ley 40/2015
#   • ENI
#   • ENS
#   • RGPD
#   • Directivas Europeas
# ============================================================================

modulo:

  id: PLIEGOS

  nombre: Motor de elaboración de pliegos

  version: "1.0.0"

  estado: ACTIVO

  prioridad: maxima

# ============================================================================
# CONFIGURACIÓN GENERAL
# ============================================================================

configuracion:

  generarPCAP: true

  generarPPT: true

  generarMemoria: true

  generarInformeNecesidad: true

  generarCuadroCaracteristicas: true

  generarAnexos: true

  generarDocumentacionComplementaria: true

  validacionNormativa: true

  razonamientoIA: true

  registrarAuditoria: true

# ============================================================================
# INTEGRACIÓN CON EL RESTO DEL SISTEMA
# ============================================================================

dependencias:

  workflow:

    obligatorio: true

  expediente:

    obligatorio: true

  documentos:

    obligatorio: true

  conocimiento:

    obligatorio: true

  ia:

    obligatorio: true

  auditoria:

    obligatorio: true

  cpv:

    obligatorio: true

  validacion:

    obligatorio: true

# ============================================================================
# OBJETIVOS DEL MOTOR
# ============================================================================

objetivos:

  - elaborarDocumentacion

  - aplicarNormativa

  - reducirErrores

  - justificarDecisiones

  - mantenerTrazabilidad

  - facilitarRevisionTecnica

# ============================================================================
# PRINCIPIOS GENERALES
# ============================================================================

principios:

  igualdad:

    obligatorio: true

  libreConcurrencia:

    obligatorio: true

  transparencia:

    obligatorio: true

  proporcionalidad:

    obligatorio: true

  eficiencia:

    obligatorio: true

  integridad:

    obligatorio: true

  sostenibilidad:

    obligatorio: true

# ============================================================================
# REGLA PLG-001
# ============================================================================

- id: PLG-001

  nombre: Inicio de elaboración del pliego

  prioridad: maxima

  condicion:

    evento:

      crear.expediente

  accion:

    cambiarEstado:

      nuevoEstado: ELABORACION_PLIEGO

  resultado:

    continuar

  justificar:

    Todo expediente comenzará con la elaboración del pliego correspondiente.

  referencia:

    LCSP

# ----------------------------------------------------------------------------
# REGLA PLG-002
# ----------------------------------------------------------------------------

- id: PLG-002

  nombre: Verificación de expediente

  prioridad: maxima

  condicion:

    estadoActual: ELABORACION_PLIEGO

  accion:

    verificar:

      expedienteExiste

  resultado:

    continuar

  justificar:

    No podrá elaborarse ningún pliego sin expediente administrativo.

  referencia:

    Ley39_2015

# ----------------------------------------------------------------------------
# REGLA PLG-003
# ----------------------------------------------------------------------------

- id: PLG-003

  nombre: Validación de órgano de contratación

  prioridad: maxima

  condicion:

    expedienteExiste: true

  accion:

    verificar:

      organoContratacion

  resultado:

    continuar

  justificar:

    El órgano de contratación deberá estar correctamente identificado.

  referencia:

    LCSP

# ----------------------------------------------------------------------------
# REGLA PLG-004
# ----------------------------------------------------------------------------

- id: PLG-004

  nombre: Validación de unidad promotora

  prioridad: alta

  condicion:

    organoContratacion: valido

  accion:

    verificar:

      unidadPromotora

  resultado:

    continuar

  justificar:

    Todo expediente deberá identificar la unidad promotora.

  referencia:

    LCSP

# ----------------------------------------------------------------------------
# REGLA PLG-005
# ----------------------------------------------------------------------------

- id: PLG-005

  nombre: Registro de inicio

  prioridad: alta

  condicion:

    unidadPromotora: valida

  accion:

    registrar:

      inicioPliego

  resultado:

    continuar

  justificar:

    El inicio del procedimiento quedará registrado para auditoría.

  referencia:

    ENS

# ----------------------------------------------------------------------------
# REGLA PLG-006
# ----------------------------------------------------------------------------

- id: PLG-006

  nombre: Comunicación al Workflow

  prioridad: media

  condicion:

    inicioPliegoRegistrado: true

  accion:

    publicarEvento:

      nombre: pliego.iniciado

  resultado:

    continuar

  justificar:

    El Workflow Engine iniciará automáticamente la fase de elaboración documental.

  referencia:

    CONTRATA_IA

# ============================================================================
# CONFIGURACIÓN DEL BLOQUE
# ============================================================================

inicio:

  verificarExpediente: true

  verificarOrgano: true

  verificarUnidad: true

  registrarInicio: true

  publicarEventos: true

# ============================================================================
# FIN PARTE 1 DE 30
# ============================================================================

# ============================================================================
# DETERMINACIÓN DEL OBJETO DEL CONTRATO
# Artículos 99 y concordantes LCSP
# ============================================================================

objetoContrato:

  activo: true

  validarNecesidad: true

  validarUnidadFuncional: true

  detectarFraccionamiento: true

  sugerirCPV: true

# ============================================================================
# REGLA PLG-007
# ============================================================================

- id: PLG-007

  nombre: Inicio definición del objeto contractual

  prioridad: maxima

  condicion:

    evento:

      pliego.iniciado

  accion:

    cambiarEstado:

      nuevoEstado: DEFINICION_OBJETO

  resultado:

    continuar

  justificar:

    La primera fase jurídica consiste en determinar correctamente el objeto del contrato.

  referencia:

    LCSP_99

# ----------------------------------------------------------------------------
# REGLA PLG-008
# ----------------------------------------------------------------------------

- id: PLG-008

  nombre: Comprobación de necesidad pública

  prioridad: maxima

  condicion:

    estadoActual: DEFINICION_OBJETO

  accion:

    verificar:

      necesidadPublica

  resultado:

    continuar

  justificar:

    El objeto contractual deberá responder a una necesidad pública real.

  referencia:

    LCSP_28

# ----------------------------------------------------------------------------
# REGLA PLG-009
# ----------------------------------------------------------------------------

- id: PLG-009

  nombre: Verificación de competencia administrativa

  prioridad: maxima

  condicion:

    necesidadPublica: validada

  accion:

    verificar:

      competenciaAdministrativa

  resultado:

    continuar

  justificar:

    La necesidad deberá encontrarse dentro del ámbito competencial del órgano.

  referencia:

    Ley40_2015

# ----------------------------------------------------------------------------
# REGLA PLG-010
# ----------------------------------------------------------------------------

- id: PLG-010

  nombre: Identificación del objeto principal

  prioridad: maxima

  condicion:

    competenciaAdministrativa: valida

  accion:

    identificar:

      objetoPrincipal

  resultado:

    continuar

  justificar:

    El sistema identificará el objeto principal del contrato.

  referencia:

    LCSP_99

# ----------------------------------------------------------------------------
# REGLA PLG-011
# ----------------------------------------------------------------------------

- id: PLG-011

  nombre: Identificación de prestaciones accesorias

  prioridad: alta

  condicion:

    objetoPrincipalIdentificado: true

  accion:

    detectar:

      prestacionesAccesorias

  resultado:

    continuar

  justificar:

    Se identificarán las prestaciones accesorias vinculadas al objeto principal.

  referencia:

    LCSP

# ----------------------------------------------------------------------------
# REGLA PLG-012
# ----------------------------------------------------------------------------

- id: PLG-012

  nombre: Comprobación de unidad funcional

  prioridad: maxima

  condicion:

    prestacionesAccesoriasDetectadas: true

  accion:

    verificar:

      unidadFuncional

  resultado:

    continuar

  justificar:

    Las prestaciones deberán constituir una unidad funcional.

  referencia:

    LCSP_99

# ----------------------------------------------------------------------------
# REGLA PLG-013
# ----------------------------------------------------------------------------

- id: PLG-013

  nombre: Detección de fraccionamiento indebido

  prioridad: maxima

  condicion:

    unidadFuncionalVerificada: true

  accion:

    analizar:

      posibleFraccionamiento

  resultado:

    continuar

  justificar:

    El sistema comprobará la inexistencia de fraccionamiento prohibido.

  referencia:

    LCSP_99_2

# ----------------------------------------------------------------------------
# REGLA PLG-014
# ----------------------------------------------------------------------------

- id: PLG-014

  nombre: Evaluación del riesgo de fraccionamiento

  prioridad: alta

  condicion:

    posibleFraccionamientoAnalizado: true

  accion:

    calcular:

      riesgoFraccionamiento

  resultado:

    continuar

  justificar:

    Se calculará un índice de riesgo de fraccionamiento.

  referencia:

    CONTRATA_IA

# ----------------------------------------------------------------------------
# REGLA PLG-015
# ----------------------------------------------------------------------------

- id: PLG-015

  nombre: Generación de alerta

  prioridad: maxima

  condicion:

    riesgoFraccionamiento:

      mayorQue: 80

  accion:

    generar:

      alertaFraccionamiento

  resultado:

    continuar

  justificar:

    Cuando el riesgo sea elevado se avisará al responsable del expediente.

  referencia:

    CONTRATA_IA

# ----------------------------------------------------------------------------
# REGLA PLG-016
# ----------------------------------------------------------------------------

- id: PLG-016

  nombre: Confirmación del objeto definitivo

  prioridad: maxima

  condicion:

    riesgoFraccionamiento:

      menorIgual: 80

  accion:

    confirmar:

      objetoDefinitivo

  resultado:

    continuar

  justificar:

    El objeto contractual quedará definitivamente establecido.

  referencia:

    LCSP

# ----------------------------------------------------------------------------
# REGLA PLG-017
# ----------------------------------------------------------------------------

- id: PLG-017

  nombre: Preparación para búsqueda CPV

  prioridad: alta

  condicion:

    objetoDefinitivoConfirmado: true

  accion:

    publicarEvento:

      nombre: objeto.definido

  resultado:

    continuar

  justificar:

    El motor CPV podrá iniciar la identificación automática de códigos.

  referencia:

    CONTRATA_IA

# ----------------------------------------------------------------------------
# REGLA PLG-018
# ----------------------------------------------------------------------------

- id: PLG-018

  nombre: Registro de auditoría

  prioridad: alta

  condicion:

    siempre: true

  accion:

    registrar:

      auditoriaObjetoContrato

  resultado:

    continuar

  justificar:

    Todas las actuaciones sobre el objeto contractual quedarán registradas.

  referencia:

    ENS

# ============================================================================
# CONFIGURACIÓN DEL BLOQUE
# ============================================================================

objeto:

  validarNecesidad: true

  validarCompetencia: true

  detectarPrestaciones: true

  comprobarUnidadFuncional: true

  detectarFraccionamiento: true

  calcularRiesgo: true

  registrarAuditoria: true

# ============================================================================
# FIN PARTE 2 DE 30
# ============================================================================

# ============================================================================
# SELECCIÓN AUTOMÁTICA DE CÓDIGOS CPV
# Reglamento (CE) 2195/2002
# LCSP Art. 99
# ============================================================================

cpv:

  activo: true

  buscarCPVPrincipal: true

  buscarCPVSecundarios: true

  validarCorrespondencia: true

  registrarAuditoria: true

# ============================================================================
# REGLA PLG-019
# ============================================================================

- id: PLG-019

  nombre: Inicio identificación CPV

  prioridad: maxima

  condicion:

    evento:

      objeto.definido

  accion:

    cambiarEstado:

      nuevoEstado: IDENTIFICACION_CPV

  resultado:

    continuar

  justificar:

    Definido el objeto contractual comenzará la identificación automática de los códigos CPV.

  referencia:

    ReglamentoCPV

# ----------------------------------------------------------------------------
# REGLA PLG-020
# ----------------------------------------------------------------------------

- id: PLG-020

  nombre: Análisis semántico del objeto

  prioridad: maxima

  condicion:

    estadoActual: IDENTIFICACION_CPV

  accion:

    analizar:

      descripcionObjeto

  resultado:

    continuar

  justificar:

    El sistema analizará lingüísticamente la descripción del objeto.

  referencia:

    CONTRATA_IA

# ----------------------------------------------------------------------------
# REGLA PLG-021
# ----------------------------------------------------------------------------

- id: PLG-021

  nombre: Localización de CPV candidatos

  prioridad: maxima

  condicion:

    descripcionObjetoAnalizada: true

  accion:

    buscar:

      cpvCoincidentes

  resultado:

    continuar

  justificar:

    Se localizarán todos los códigos CPV compatibles.

  referencia:

    ReglamentoCPV

# ----------------------------------------------------------------------------
# REGLA PLG-022
# ----------------------------------------------------------------------------

- id: PLG-022

  nombre: Cálculo de similitud

  prioridad: alta

  condicion:

    cpvCoincidentesEncontrados: true

  accion:

    calcular:

      porcentajeCoincidencia

  resultado:

    continuar

  justificar:

    Se calculará la similitud entre el objeto y cada CPV.

  referencia:

    CONTRATA_IA

# ----------------------------------------------------------------------------
# REGLA PLG-023
# ----------------------------------------------------------------------------

- id: PLG-023

  nombre: Selección del CPV principal

  prioridad: maxima

  condicion:

    porcentajeCoincidenciaCalculado: true

  accion:

    seleccionar:

      cpvPrincipal

  resultado:

    continuar

  justificar:

    Se seleccionará automáticamente el CPV con mayor correspondencia.

  referencia:

    ReglamentoCPV

# ----------------------------------------------------------------------------
# REGLA PLG-024
# ----------------------------------------------------------------------------

- id: PLG-024

  nombre: Selección de CPV secundarios

  prioridad: alta

  condicion:

    cpvPrincipalSeleccionado: true

  accion:

    seleccionar:

      cpvSecundarios

  resultado:

    continuar

  justificar:

    Se propondrán códigos CPV secundarios cuando existan prestaciones complementarias.

  referencia:

    ReglamentoCPV

# ----------------------------------------------------------------------------
# REGLA PLG-025
# ----------------------------------------------------------------------------

- id: PLG-025

  nombre: Validación jurídica del CPV

  prioridad: maxima

  condicion:

    cpvSecundariosSeleccionados: true

  accion:

    verificar:

      coherenciaCPV

  resultado:

    continuar

  justificar:

    El sistema comprobará la coherencia jurídica entre el objeto contractual y los códigos CPV.

  referencia:

    LCSP_99

# ----------------------------------------------------------------------------
# REGLA PLG-026
# ----------------------------------------------------------------------------

- id: PLG-026

  nombre: Detección de incompatibilidades

  prioridad: alta

  condicion:

    coherenciaCPVVerificada: true

  accion:

    detectar:

      incompatibilidadesCPV

  resultado:

    continuar

  justificar:

    Se identificarán incompatibilidades entre distintos códigos CPV.

  referencia:

    CONTRATA_IA

# ----------------------------------------------------------------------------
# REGLA PLG-027
# ----------------------------------------------------------------------------

- id: PLG-027

  nombre: Generación de propuesta CPV

  prioridad: maxima

  condicion:

    incompatibilidadesCPVDetectadas: false

  accion:

    generar:

      propuestaCPV

  resultado:

    continuar

  justificar:

    Se generará la propuesta definitiva de clasificación CPV.

  referencia:

    ReglamentoCPV

# ----------------------------------------------------------------------------
# REGLA PLG-028
# ----------------------------------------------------------------------------

- id: PLG-028

  nombre: Publicación del resultado

  prioridad: alta

  condicion:

    propuestaCPVGenerada: true

  accion:

    publicarEvento:

      nombre: cpv.definido

  resultado:

    continuar

  justificar:

    El resto de motores utilizarán la clasificación CPV obtenida.

  referencia:

    CONTRATA_IA

# ----------------------------------------------------------------------------
# REGLA PLG-029
# ----------------------------------------------------------------------------

- id: PLG-029

  nombre: Registro de auditoría CPV

  prioridad: alta

  condicion:

    siempre: true

  accion:

    registrar:

      auditoriaCPV

  resultado:

    continuar

  justificar:

    Todas las decisiones relativas a la clasificación CPV quedarán registradas.

  referencia:

    ENS

# ============================================================================
# CONFIGURACIÓN DEL BLOQUE
# ============================================================================

cpvConfig:

  analizarObjeto: true

  buscarPrincipal: true

  buscarSecundarios: true

  validarCoherencia: true

  detectarIncompatibilidades: true

  registrarAuditoria: true

# ============================================================================
# FIN PARTE 3 DE 30
# ============================================================================

# ============================================================================
# JUSTIFICACIÓN DE LA NECESIDAD E INSUFICIENCIA DE MEDIOS
# Artículos 28 y 116 LCSP
# ============================================================================

necesidad:

  activa: true

  justificarNecesidad: true

  justificarInsuficiencia: true

  verificarCompetencia: true

  registrarAuditoria: true

# ============================================================================
# REGLA PLG-030
# ============================================================================

- id: PLG-030

  nombre: Inicio de la justificación de la necesidad

  prioridad: maxima

  condicion:

    evento:

      cpv.definido

  accion:

    cambiarEstado:

      nuevoEstado: JUSTIFICACION_NECESIDAD

  resultado:

    continuar

  justificar:

    Tras la definición del objeto y del CPV deberá justificarse la necesidad administrativa.

  referencia:

    LCSP_28

# ----------------------------------------------------------------------------
# REGLA PLG-031
# ----------------------------------------------------------------------------

- id: PLG-031

  nombre: Comprobación de la competencia administrativa

  prioridad: maxima

  condicion:

    estadoActual: JUSTIFICACION_NECESIDAD

  accion:

    verificar:

      competenciaAdministrativa

  resultado:

    continuar

  justificar:

    La necesidad deberá encontrarse dentro de las competencias del órgano.

  referencia:

    Ley40_2015

# ----------------------------------------------------------------------------
# REGLA PLG-032
# ----------------------------------------------------------------------------

- id: PLG-032

  nombre: Identificación del interés público

  prioridad: maxima

  condicion:

    competenciaAdministrativa: valida

  accion:

    identificar:

      interesPublico

  resultado:

    continuar

  justificar:

    Toda contratación deberá perseguir un fin público determinado.

  referencia:

    LCSP_28

# ----------------------------------------------------------------------------
# REGLA PLG-033
# ----------------------------------------------------------------------------

- id: PLG-033

  nombre: Elaboración de la memoria justificativa

  prioridad: maxima

  condicion:

    interesPublicoIdentificado: true

  accion:

    generar:

      memoriaJustificativa

  resultado:

    continuar

  justificar:

    El sistema redactará automáticamente la memoria justificativa.

  referencia:

    LCSP_116

# ----------------------------------------------------------------------------
# REGLA PLG-034
# ----------------------------------------------------------------------------

- id: PLG-034

  nombre: Evaluación de medios propios

  prioridad: maxima

  condicion:

    memoriaJustificativaGenerada: true

  accion:

    analizar:

      mediosPropiosDisponibles

  resultado:

    continuar

  justificar:

    Se evaluará la disponibilidad de medios personales y materiales propios.

  referencia:

    LCSP_28

# ----------------------------------------------------------------------------
# REGLA PLG-035
# ----------------------------------------------------------------------------

- id: PLG-035

  nombre: Comprobación de suficiencia de medios

  prioridad: maxima

  condicion:

    mediosPropiosDisponiblesAnalizados: true

  accion:

    verificar:

      suficienciaMedios

  resultado:

    continuar

