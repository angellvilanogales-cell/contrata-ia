    LCSP_16

# ----------------------------------------------------------------------------
# REGLA PLG-045
# ----------------------------------------------------------------------------

- id: PLG-045

  nombre: Identificación de contrato de servicios

  prioridad: alta

  condicion:

    objetoPrincipal:

      tipo: servicios

  accion:

    asignar:

      tipoContrato: SERVICIOS

  resultado:

