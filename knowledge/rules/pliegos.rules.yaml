  nombre: Identificación de contrato de suministro

  prioridad: alta

  condicion:

    objetoPrincipal:

      tipo: suministro

  accion:

    asignar:

      tipoContrato: SUMINISTRO

  resultado:

    continuar

  justificar:

    El objeto principal corresponde a un contrato de suministro.

