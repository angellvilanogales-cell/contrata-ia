    LCSP_28

# ----------------------------------------------------------------------------
# REGLA PLG-036
# ----------------------------------------------------------------------------

- id: PLG-036

  nombre: Justificación de insuficiencia de medios

  prioridad: maxima

  condicion:

    suficienciaMedios: false

  accion:

    generar:

      informeInsuficienciaMedios

  resultado:

    continuar

  justificar:

    Se elaborará automáticamente el informe justificativo de insuficiencia de medios.

  referencia:

    LCSP_116

# ----------------------------------------------------------------------------
# REGLA PLG-037
# ----------------------------------------------------------------------------

- id: PLG-037

  nombre: Validación jurídica de la contratación externa

  prioridad: alta

  condicion:

    informeInsuficienciaMediosGenerado: true

  accion:

    verificar:

      contratacionExternaProcedente

  resultado:

    continuar

  justificar:

    El sistema verificará que procede acudir al mercado.

  referencia:

    LCSP

# ----------------------------------------------------------------------------
# REGLA PLG-038
# ----------------------------------------------------------------------------

- id: PLG-038

  nombre: Consolidación documental

  prioridad: alta

  condicion:

    contratacionExternaProcedente: true

  accion:

    consolidar:

      documentacionNecesidad

  resultado:

    continuar

  justificar:

    Toda la documentación justificativa quedará integrada en el expediente.

  referencia:

    ENI

# ----------------------------------------------------------------------------
# REGLA PLG-039
# ----------------------------------------------------------------------------

- id: PLG-039

  nombre: Comunicación al Workflow

  prioridad: media

  condicion:

    documentacionNecesidadConsolidada: true

  accion:

    publicarEvento:

      nombre: necesidad.validada

  resultado:

    continuar

  justificar:

    El Workflow continuará con la preparación económica del contrato.

  referencia:

    CONTRATA_IA

# ----------------------------------------------------------------------------
# REGLA PLG-040
# ----------------------------------------------------------------------------

- id: PLG-040

  nombre: Registro de auditoría

  prioridad: alta

  condicion:

    siempre: true

  accion:

    registrar:

      auditoriaNecesidad

  resultado:

    continuar

  justificar:

    Todas las actuaciones relativas a la necesidad del contrato quedarán registradas.

  referencia:

    ENS

# ============================================================================
# CONFIGURACIÓN DEL BLOQUE
# ============================================================================

justificacion:

  generarMemoria: true

  analizarMedios: true

  justificarInsuficiencia: true

  validarContratacionExterna: true

  consolidarDocumentacion: true

  registrarAuditoria: true

# ============================================================================
# FIN PARTE 4 DE 30
# ============================================================================

# ============================================================================
# DETERMINACIÓN DEL TIPO DE CONTRATO
# Artículos 13 a 18 LCSP
# ============================================================================

tipoContrato:

  activo: true

  clasificarAutomaticamente: true

  detectarContratoMixto: true

  aplicarReglasPrevalencia: true

  registrarAuditoria: true

# ============================================================================
# REGLA PLG-041
# ============================================================================

- id: PLG-041

  nombre: Inicio de clasificación contractual

  prioridad: maxima

  condicion:

    evento:

      necesidad.validada

  accion:

    cambiarEstado:

      nuevoEstado: CLASIFICACION_CONTRATO

  resultado:

    continuar

  justificar:

