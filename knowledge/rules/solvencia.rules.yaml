# ============================================================================
# CONTRATA IA
# BANCO DE REGLAS
# ============================================================================
#
# MÓDULO..............: SOLVENCIA
# CÓDIGO..............: RULE.SOLVENCIA
# VERSIÓN.............: 1.0.0
# ESTADO..............: PRODUCCIÓN
# TIPO................: MOTOR DE REGLAS
# CRITICIDAD..........: MÁXIMA
#
# Determina automáticamente la solvencia exigible conforme a la LCSP,
# garantizando proporcionalidad, vinculación con el objeto del contrato
# y respeto al principio de libre concurrencia.
#
# ============================================================================

schema:

  id:

    CONTRATAIA.RULES.SOLVENCIA

  codigo:

    RULE.SOLVENCIA

  version:

    1.0.0

  estado:

    produccion

# ============================================================================
# OBJETIVO
# ============================================================================

objetivo:

  descripcion: >

    Determinar automáticamente la solvencia económica, financiera,
    técnica y profesional exigible en función del contrato, evitando
    requisitos desproporcionados o incompatibles con la normativa.

# ============================================================================
# ENTRADAS DEL MOTOR
# ============================================================================

entradas:

  obligatorias:

    - tipoContrato

    - valorEstimado

    - CPVPrincipal

    - procedimiento

    - objetoContrato

  opcionales:

    - clasificacionEmpresarial

    - divisionLotes

    - especialComplejidad

# ============================================================================
# SALIDAS
# ============================================================================

salidas:

  generar:

    requiereSolvencia

    tipoSolvencia

    solvenciaEconomica

    solvenciaTecnica

    clasificacionSustitutiva

    justificacion

    reglasAplicadas

# ============================================================================
# PRINCIPIOS LCSP
# ============================================================================

principios:

  proporcionalidad

  libreConcurrencia

  igualdad

  noDiscriminacion

  vinculacionObjetoContrato

# ============================================================================
# VARIABLES CALCULADAS
# ============================================================================

variables:

  requiereClasificacion

  requiereSolvenciaEconomica

  requiereSolvenciaTecnica

  nivelExigencia

# ============================================================================
# PRIORIDAD DEL MOTOR
# ============================================================================

prioridadDecision:

  1:

    tipoContrato

  2:

    objetoContrato

  3:

    CPV

  4:

    procedimiento

  5:

    valorEstimado

  6:

    clasificacion

# ============================================================================
# DEPENDENCIAS
# ============================================================================

dependencias:

  requiere:

    - MEM.OBJ

    - MEM.CPV

    - RULE.PROCEDIMIENTO

    - MEM.CATALOGO

# ============================================================================
# FIN PARTE 1 DE 14
# ============================================================================

# ============================================================================
# DETERMINACIÓN DE LA NECESIDAD DE SOLVENCIA
# ============================================================================

reglas:

# ============================================================================
# RULE-SOL-001
# ============================================================================

  - id:

      SOL-001

    nombre:

      Evaluar necesidad de solvencia

    prioridad:

      maxima

    accion:

      evaluarNecesidadSolvencia

# ============================================================================
# RULE-SOL-002
# ============================================================================

  - id:

      SOL-002

    nombre:

      Consultar normativa aplicable

    prioridad:

      maxima

    accion:

      consultar:

        PARAM.SOLVENCIA

# ============================================================================
# RULE-SOL-003
# ============================================================================

  - id:

      SOL-003

    nombre:

      Analizar tipo de contrato

    entradas:

      - tipoContrato

      - procedimiento

      - valorEstimado

    accion:

      clasificarContrato

# ============================================================================
# RULE-SOL-004
# ============================================================================

  - id:

      SOL-004

    nombre:

      Analizar objeto contractual

    entradas:

      - objetoContrato

      - CPVPrincipal

    accion:

      evaluarObjeto

# ============================================================================
# RULE-SOL-005
# ============================================================================

  - id:

      SOL-005

    nombre:

      Determinar obligatoriedad

    accion:

      comprobarObligacionLegal

# ============================================================================
# RULE-SOL-006
# ============================================================================

  - id:

      SOL-006

    nombre:

      Solvencia exigible

    condicion:

      requiereSolvencia:

        true

    resultado:

      continuarCalculo:

        true

# ============================================================================
# RULE-SOL-007
# ============================================================================

  - id:

      SOL-007

    nombre:

      Solvencia no exigible

    condicion:

      requiereSolvencia:

        false

    resultado:

      continuarCalculo:

        false

# ============================================================================
# RULE-SOL-008
# ============================================================================

  - id:

      SOL-008

    nombre:

      Verificar proporcionalidad

    condicion:

      requiereSolvencia: true

    accion:

      comprobarProporcionalidad

# ============================================================================
# VARIABLES DE DECISIÓN
# ============================================================================

variables:

  requiereSolvencia

  motivoExigencia

  nivelExigencia

  continuarCalculo

# ============================================================================
# VALIDACIONES
# ============================================================================

validaciones:

  comprobar:

    tipoContrato

    procedimiento

    objetoContrato

    valorEstimado

    normativaAplicable

# ============================================================================
# RESULTADOS POSIBLES
# ============================================================================

resultado:

  requiereSolvencia

  noRequiereSolvencia

  revisarManual

# ============================================================================
# JUSTIFICACIÓN AUTOMÁTICA
# ============================================================================

justificacion:

  generar:

    incluir:

      tipoContrato

      objetoContrato

      procedimiento

      normativaAplicable

      motivoExigencia

      reglasAplicadas

# ============================================================================
# MOTOR DOCUMENTAL
# ============================================================================

motorDocumental:

  insertar:

