# ============================================================================
# CONTRATA IA
# RULE.EVALUACION
# Motor Central de Evaluación de Ofertas
# ============================================================================
#
# Versión: 1.0.0
# Estado: DESARROLLO
#
# Este motor coordina todo el proceso de evaluación de ofertas conforme a la
# Ley 9/2017, de Contratos del Sector Público (LCSP).
#
# No calcula únicamente puntuaciones.
#
# Actúa como orquestador de todos los motores jurídicos:
#
#   • RULE.OBJETO
#   • RULE.PROCEDIMIENTO
#   • RULE.SOLVENCIA
#   • RULE.CRITERIOS
#   • RULE.PCAP
#   • RULE.PPT
#   • RULE.MEMORIA
#   • RULE.EXPEDIENTE
#
# Además coordina:
#
#   • Workflow Engine
#   • Auditor Jurídico IA
#   • Motor IA
#
# ============================================================================

modulo:

  id: RULE.EVALUACION

  nombre: Motor Central de Evaluación

  version: "1.0.0"

  estado: DESARROLLO

# ============================================================================
# OBJETIVO
# ============================================================================

objetivo:

  descripcion: >

    Coordinar íntegramente el procedimiento de evaluación de ofertas,
    aplicando automáticamente la LCSP y las reglas definidas por los
    distintos motores de CONTRATA IA.

# ============================================================================
# FUNCIONES PRINCIPALES
# ============================================================================

funciones:

  - Recepción de ofertas

  - Validación documental

  - Gestión de subsanaciones

  - Validación de solvencia

  - Ejecución de criterios automáticos

  - Gestión del juicio de valor

  - Integración de puntuaciones

  - Gestión de empates

  - Gestión de ofertas anormalmente bajas

  - Clasificación automática

  - Generación de propuesta de adjudicación

  - Auditoría

  - Explicabilidad

  - Certificación

# ============================================================================
# MOTORES CON LOS QUE INTERACTÚA
# ============================================================================

dependencias:

  consultar:

    - RULE.OBJETO

    - RULE.PROCEDIMIENTO

    - RULE.SOLVENCIA

    - RULE.CRITERIOS

    - RULE.PCAP

    - RULE.PPT

    - RULE.MEMORIA

    - RULE.EXPEDIENTE

# ============================================================================
# EVENTOS DE ENTRADA
# ============================================================================

eventosEntrada:

  - expediente.iniciado

  - procedimiento.validado

  - objeto.validado

  - solvencia.validada

  - criterios.validados

  - ofertas.recibidas

# ============================================================================
# EVENTOS DE SALIDA
# ============================================================================

eventosSalida:

  - evaluacion.iniciada

  - ofertas.validadas

  - puntuaciones.calculadas

  - clasificacion.generada

  - propuesta.adjudicacion

  - workflow.actualizar

  - auditoria.actualizada

# ============================================================================
# MÁQUINA DE ESTADOS
# ============================================================================

estados:

  - INICIAL

  - RECEPCION_OFERTAS

  - VALIDACION_DOCUMENTAL

  - SUBSANACION

  - VALIDACION_SOLVENCIA

  - EVALUACION_AUTOMATICA

  - JUICIO_VALOR

  - INTEGRACION

  - EMPATES

  - OFERTAS_ANORMALMENTE_BAJAS

  - CLASIFICACION

  - PROPUESTA_ADJUDICACION

  - FINALIZADO

# ============================================================================
# CONFIGURACIÓN GENERAL
# ============================================================================

configuracion:

  workflowAutomatico: true

  auditoriaAutomatica: true

  explicabilidadAutomatica: true

  registrarEventos: true

  generarMetricas: true

# ============================================================================
# REGLAS DEL MOTOR
# ============================================================================

- id: EVA-001

  nombre: Inicio del proceso de evaluación

  prioridad: maxima

  condicion:

    expedienteCompleto: true

  accion:

    cambiarEstado:

      nuevoEstado: RECEPCION_OFERTAS

  resultado:

    continuar

  justificar:

    La evaluación únicamente podrá iniciarse cuando el expediente se
    encuentre completo y preparado para recibir ofertas.

  referencia:

    LCSP

# ----------------------------------------------------------------------------

- id: EVA-002

  nombre: Publicación del evento de inicio

  prioridad: maxima

  condicion:

    estadoActual: RECEPCION_OFERTAS

  accion:

    publicarEvento:

      nombre: evaluacion.iniciada

  resultado:

    continuar

  justificar:

    El inicio de la evaluación será comunicado automáticamente al resto
    de motores del sistema.

  referencia:

    CONTRATA_IA

# ----------------------------------------------------------------------------

- id: EVA-003

  nombre: Inicialización de auditoría

  prioridad: alta

  condicion:

    estadoActual: RECEPCION_OFERTAS

  accion:

    iniciarAuditoria: true

  resultado:

    continuar

  justificar:

    Todo el proceso de evaluación quedará auditado desde su inicio.

  referencia:

    CONTRATA_IA

# ----------------------------------------------------------------------------

- id: EVA-004

  nombre: Inicialización del registro de explicabilidad

  prioridad: alta

  condicion:

    estadoActual: RECEPCION_OFERTAS

  accion:

    iniciarExplicabilidad: true

  resultado:

    continuar

  justificar:

    Desde el inicio se registrarán todas las decisiones tomadas por el
    motor para garantizar su completa explicabilidad.

  referencia:

    CONTRATA_IA

