# ============================================================================
# CONTRATA-IA
# RULE ENGINE
# MOTOR DE EJECUCIÓN DEL CONTRATO
# Archivo:
# knowledge/rules/ejecucion.rules.yaml
# ============================================================================

metadata:

  id: RULE.EJECUCION

  nombre: Motor de Ejecución del Contrato

  version: 1.0.0

  estado: PRODUCCION

  propietario: CONTRATA-IA

  descripcion: >
    Motor encargado de controlar toda la ejecución del contrato
    administrativo desde la formalización hasta su extinción,
    incluyendo seguimiento, incidencias, penalidades,
    modificaciones, recepción, liquidación y cierre.

# ============================================================================
# NORMATIVA
# ============================================================================

normativa:

  principal:

    - LCSP

    - Ley39_2015

    - Ley40_2015

    - ENS

    - ENI

  complementaria:

    - AI_ACT

# ============================================================================
# CONFIGURACIÓN GENERAL
# ============================================================================

configuracion:

  auditoriaCompleta: true

  explicabilidad: true

  registrarEventos: true

  registrarCambiosEstado: true

  registrarVersiones: true

  validarNormativa: true

  workflowAutomatico: true

# ============================================================================
# ESTADOS DEL MOTOR
# ============================================================================

estados:

  - FORMALIZADO

  - EJECUCION

  - SEGUIMIENTO

  - INCIDENCIA

  - PENALIDAD

  - MODIFICACION

  - PRORROGA

  - RECEPCION

  - LIQUIDACION

  - CIERRE

# ============================================================================
# EVENTOS
# ============================================================================

eventos:

  inicio:

    contrato.formalizado

  seguimiento:

    seguimiento.programado

    seguimiento.realizado

  incidencias:

    incidencia.detectada

    incidencia.resuelta

  modificaciones:

    modificacion.iniciada

    modificacion.aprobada

  cierre:

    contrato.finalizado

# ============================================================================
# REGLA EJE-001
# ============================================================================

- id: EJE-001

  nombre: Inicio del motor de ejecución

  prioridad: maxima

  condicion:

    evento: contrato.formalizado

  accion:

    cambiarEstado:

      nuevoEstado: FORMALIZADO

  resultado:

    continuar

  justificar:

    La ejecución del contrato comienza tras su formalización.

  referencia:

    LCSP_153

# ----------------------------------------------------------------------------
# REGLA EJE-002
# ----------------------------------------------------------------------------

- id: EJE-002

  nombre: Verificación del contrato formalizado

  prioridad: maxima

  condicion:

    estadoContrato: FORMALIZADO

  accion:

    verificar:

      contratoFormalizado

  resultado:

    continuar

  justificar:

    Únicamente podrán ejecutarse contratos válidamente formalizados.

  referencia:

    LCSP

# ----------------------------------------------------------------------------
# REGLA EJE-003
# ----------------------------------------------------------------------------

- id: EJE-003

  nombre: Activación de la ejecución

  prioridad: maxima

  condicion:

    contratoFormalizado: true

  accion:

    cambiarEstado:

      nuevoEstado: EJECUCION

  resultado:

    continuar

  justificar:

    Verificada la formalización comenzará la ejecución contractual.

  referencia:

    LCSP

# ----------------------------------------------------------------------------
# REGLA EJE-004
# ----------------------------------------------------------------------------

- id: EJE-004

  nombre: Registro del inicio de ejecución

  prioridad: alta

  condicion:

    estadoMotor: EJECUCION

  accion:

    registrar:

      inicioEjecucion

  resultado:

    continuar

  justificar:

    El inicio de la ejecución quedará registrado para auditoría.

  referencia:

    CONTRATA_IA

# ----------------------------------------------------------------------------
# REGLA EJE-005
# ----------------------------------------------------------------------------

- id: EJE-005

  nombre: Publicación del evento de ejecución

  prioridad: alta

  condicion:

    estadoMotor: EJECUCION

  accion:

    publicarEvento:

      nombre: ejecucion.iniciada

  resultado:

    continuar

  justificar:

    El Workflow Engine iniciará el resto de procesos de seguimiento.

  referencia:

    CONTRATA_IA

# ============================================================================
# CONFIGURACIÓN DEL BLOQUE
# ============================================================================

