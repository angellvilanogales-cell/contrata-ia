# REGLA DOC-003
# ----------------------------------------------------------------------------

- id: DOC-003

  nombre: Clasificación documental

  prioridad: maxima

  condicion:

    datosMinimosExpedienteComprobados: true

  accion:

    clasificar:

      tipoContrato

  resultado:

    continuar

  justificar:

    La documentación dependerá del tipo de contrato determinado.

  referencia:

    LCSP

