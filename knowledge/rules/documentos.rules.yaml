# ============================================================================
# CONTRATA-IA
# RULE ENGINE
# MOTOR DOCUMENTAL
#
# Archivo:
# knowledge/rules/documentos.rules.yaml
# ============================================================================

metadata:

  id: RULE.DOCUMENTOS

  nombre: Motor Documental

  version: 1.0.0

  estado: PRODUCCION

  propietario: CONTRATA-IA

  descripcion: >
    Motor encargado de decidir automáticamente qué documentos deben
    generarse durante todo el ciclo de vida del expediente de contratación,
    desde la planificación hasta el archivo definitivo.

# ============================================================================
# NORMATIVA BASE
# ============================================================================

normativa:

  principal:

    - LCSP

    - Ley_39_2015

    - Ley_40_2015

    - ENI

    - ENS

  complementaria:

    - Reglamento_General_LCAP

    - Normativa_Junta_Andalucia

# ============================================================================
# CONFIGURACIÓN GENERAL
# ============================================================================

configuracion:

  generarAutomaticamente: true

  validarAntesGenerar: true

  comprobarFirmas: true

  comprobarMetadatos: true

  comprobarVersiones: true

  generarPDF: true

  generarWORD: true

  generarODT: true

  registrarAuditoria: true

# ============================================================================
# ESTADOS DEL MOTOR DOCUMENTAL
# ============================================================================

estados:

  - INICIAL

  - VALIDANDO

  - GENERANDO

  - REVISION

  - FIRMADO

  - REGISTRADO

  - PUBLICADO

  - ARCHIVADO

# ============================================================================
# TIPOS DOCUMENTALES
# ============================================================================

tiposDocumentales:

  planificacion:

    - memoriaNecesidad

    - memoriaEconomica

    - insuficienciaMedios

    - estudioMercado

    - informeInicio

  preparacion:

    - PCAP

    - PPT

    - informeJuridico

    - informeFiscalizacion

    - resolucionInicio

  licitacion:

    - anuncioLicitacion

    - invitaciones

    - aclaraciones

    - respuestas

  adjudicacion:

    - propuestaAdjudicacion

    - resolucionAdjudicacion

    - requerimientoDocumentacion

  formalizacion:

    - contrato

    - formalizacion

    - publicacionFormalizacion

  ejecucion:

    - actas

    - certificaciones

    - informesResponsable

    - modificaciones

    - prorrogas

    - penalidades

  finalizacion:

    - recepcion

    - liquidacion

    - devolucionGarantia

    - archivo

# ============================================================================
# REGLA DOC-001
# ============================================================================

- id: DOC-001

  nombre: Inicio del motor documental

  prioridad: maxima

  condicion:

    evento:

      expediente.creado

  accion:

    cambiarEstado:

      nuevoEstado: VALIDANDO

  resultado:

    continuar

  justificar:

    Todo expediente deberá iniciar la validación documental antes de
    comenzar la generación de documentos.

  referencia:

    LCSP

# ----------------------------------------------------------------------------
# REGLA DOC-002
# ----------------------------------------------------------------------------

- id: DOC-002

  nombre: Validación datos mínimos

  prioridad: maxima

  condicion:

    estadoActual: VALIDANDO

  accion:

    comprobar:

      datosMinimosExpediente

  resultado:

    continuar

  justificar:

    El sistema comprobará que existen los datos imprescindibles antes
    de generar cualquier documento.

  referencia:

    Ley_39_2015

