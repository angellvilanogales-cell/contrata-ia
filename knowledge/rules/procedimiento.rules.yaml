  comprobar:

    procedimiento

    normativaAplicable

    composicion

    secretario

    presidencia

    vocales

# ============================================================================
# RESULTADOS POSIBLES
# ============================================================================

resultadoMesa:

  obligatoria

  facultativa

  noProcede

# ============================================================================
# JUSTIFICACIÓN AUTOMÁTICA
# ============================================================================

justificacionMesa:

  generar:

    incluir:

      procedimiento

      tipoContrato

      normativaAplicable

      decisionMesa

      reglasAplicadas

# ============================================================================
# MOTOR DOCUMENTAL
# ============================================================================

motorDocumental:

  generar:

    acuerdoConstitucionMesa

    convocatoriaMesa

    actaConstitucion

    actasSesiones

# ============================================================================
# ALERTAS
# ============================================================================

alertasMesa:

  mesaObligatoriaNoConstituida:

    criticidad:

      critica

  composicionIncorrecta:

    criticidad:

      critica

  incompatibilidadDetectada:

    criticidad:

      alta

# ============================================================================
# KNOWLEDGE GRAPH
# ============================================================================

knowledgeGraph:

  nodo:

    MesaContratacion

  relaciones:

    Procedimiento

    OrganoContratacion

    Expediente

# ============================================================================
# TRAZABILIDAD
# ============================================================================

