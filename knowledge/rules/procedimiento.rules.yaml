# ============================================================================
# PROC-044
# ============================================================================

  - id:

      PROC-044

    nombre:

      Evaluar asociación para la innovación

    prioridad:

      alta

    accion:

      comprobarAsociacionInnovacion

# ============================================================================
# PROC-045
# ============================================================================

  - id:

      PROC-045

    nombre:

      Exigir justificación jurídica

    condicion:

      procedimiento:

        excepcional

    resultado:

