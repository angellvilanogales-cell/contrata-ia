# ============================================================================
# CONTRATA IA
# BANCO DE REGLAS
# ============================================================================
#
# MÓDULO..............: PROCEDIMIENTO DE ADJUDICACIÓN
# CÓDIGO..............: RULE.PROCEDIMIENTO
# VERSIÓN.............: 1.0.0
# ESTADO..............: PRODUCCIÓN
# TIPO................: MOTOR DE REGLAS
# CRITICIDAD..........: MÁXIMA
#
# Este módulo determina automáticamente el procedimiento de adjudicación
# aplicable conforme a la Ley 9/2017, de Contratos del Sector Público.
#
# ============================================================================

schema:

  id: CONTRATAIA.RULES.PROCEDIMIENTO

  codigo: RULE.PROCEDIMIENTO

  version: 1.0.0

  estado: produccion

# ============================================================================
# OBJETIVO
# ============================================================================

objetivo:

  descripcion: >

    Determinar automáticamente el procedimiento de adjudicación aplicable
    utilizando las reglas establecidas por la Ley 9/2017 de Contratos del
    Sector Público y el resto de normativa aplicable.

# ============================================================================
# ENTRADAS OBLIGATORIAS
# ============================================================================

entradas:

  obligatorias:

    - tipoContrato

    - valorEstimado

    - CPVPrincipal

    - objetoContrato

  opcionales:

    - divisionLotes

    - urgencia

    - emergencia

    - innovacion

# ============================================================================
# SALIDAS DEL MOTOR
# ============================================================================

salidas:

  generar:

    procedimiento

    subtipoProcedimiento

    publicidad

    armonizacion

    recursoEspecial

    justificacion

    reglasAplicadas

# ============================================================================
# PROCEDIMIENTOS SOPORTADOS
# ============================================================================

procedimientos:

  abierto

  abiertoSimplificado

  abiertoSimplificadoAbreviado

  restringido

  negociadoConPublicidad

  negociadoSinPublicidad

  dialogoCompetitivo

  asociacionInnovacion

# ============================================================================
# PRINCIPIOS RECTORES
# ============================================================================

principios:

  libreConcurrencia

  igualdad

  transparencia

  proporcionalidad

  eficiencia

  integridad

# ============================================================================
# PRIORIDAD DE DECISIÓN
# ============================================================================

prioridadDecision:

  1:

    emergencia

  2:

    normativaEspecial

  3:

    tipoContrato

  4:

    valorEstimado

  5:

    armonizacion

  6:

    procedimiento

# ============================================================================
# VARIABLES CALCULADAS
# ============================================================================

variables:

  sujetoRegulacionArmonizada

  procedimientoRecomendado

  publicidadObligatoria

  recursoEspecial

  requiereMesa

# ============================================================================
# FIN PARTE 1 DE 12
# ============================================================================

# ============================================================================
# REGLAS PRINCIPALES DE DETERMINACIÓN DEL PROCEDIMIENTO
# ============================================================================

reglas:

# ============================================================================
# REGLA 001
# ============================================================================

  - id:

      PROC-001

    nombre:

      Tramitación de emergencia

    prioridad:

      maxima

    condicion:

      emergencia: true

    resultado:

      procedimiento:

        emergencia

    finalizarEvaluacion:

      true

# ============================================================================
# REGLA 002
# ============================================================================

  - id:

      PROC-002

    nombre:

      Tramitación urgente

    prioridad:

      muyAlta

    condicion:

      urgencia: true

    accion:

      mantenerProcedimiento

      aplicarReduccionPlazos

# ============================================================================
# REGLA 003
# ============================================================================

  - id:

      PROC-003

    nombre:

      Determinar tipo contractual

    prioridad:

      alta

    condicion:

      existe:

        tipoContrato

    accion:

      clasificarContrato

# ============================================================================
# REGLA 004
# ============================================================================

  - id:

      PROC-004

    nombre:

      Consultar umbrales económicos

    prioridad:

      alta

    accion:

      consultar:

        PARAM.UMBRALES

# ============================================================================
# REGLA 005
# ============================================================================

  - id:

      PROC-005

    nombre:

      Determinar regulación armonizada

    prioridad:

      alta

    accion:

      evaluarSARA

# ============================================================================
# REGLA 006
# ============================================================================

  - id:

      PROC-006

    nombre:

      Determinar procedimiento abierto

    prioridad:

      media

    condicion:

      procedimientoOrdinario: true

    resultado:

      procedimiento:

        abierto

# ============================================================================
# REGLA 007
# ============================================================================

  - id:

      PROC-007

    nombre:

      Evaluar abierto simplificado

    prioridad:

      media

    accion:

      comprobarSimplificado

# ============================================================================
# REGLA 008
# ============================================================================

  - id:

      PROC-008

    nombre:

      Evaluar abierto simplificado abreviado

    prioridad:

      media

    accion:

      comprobarSimplificadoAbreviado

# ============================================================================
# REGLA 009
# ============================================================================

  - id:

      PROC-009

    nombre:

      Evaluar procedimiento restringido

    prioridad:

      media

    accion:

      comprobarRestringido

# ============================================================================
# REGLA 010
# ============================================================================

  - id:

      PROC-010

    nombre:

      Evaluar procedimientos especiales

    prioridad:

      baja

    accion:

      comprobar:

        dialogoCompetitivo

        asociacionInnovacion

        negociado

# ============================================================================
# MATRIZ DE DECISIÓN
# ============================================================================

matrizDecision:

  entrada:

    tipoContrato

    valorEstimado

    innovacion

    urgencia

    emergencia

  salida:

    procedimiento

# ============================================================================
# VALIDACIONES
# ============================================================================

validaciones:

  comprobarTipoContrato:

    obligatorio: true

  comprobarValorEstimado:

    obligatorio: true

  comprobarObjeto:

    obligatorio: true

# ============================================================================
# TRAZABILIDAD
# ============================================================================

trazabilidad:

  registrar:

    reglaAplicada

    fecha

    usuario

    versionNormativa

# ============================================================================
# FIN PARTE 2 DE 12
# ============================================================================

# ============================================================================
# REGLAS DE DETERMINACIÓN DE CONTRATOS SUJETOS A REGULACIÓN ARMONIZADA
# ============================================================================

reglasSARA:

# ============================================================================
# REGLA PROC-011
# ============================================================================

  - id:

      PROC-011

    nombre:

      Comprobar existencia de umbral SARA

    prioridad:

      muyAlta

    accion:

      consultar:

        PARAM.UMBRALES.SARA

# ============================================================================
# REGLA PROC-012
# ============================================================================

  - id:

      PROC-012

    nombre:

      Determinar si el contrato está sujeto a regulación armonizada

    prioridad:

      muyAlta

    entradas:

      - tipoContrato

      - valorEstimado

      - umbralAplicable

    accion:

      compararValorConUmbral

# ============================================================================
# REGLA PROC-013
# ============================================================================

  - id:

      PROC-013

    nombre:

      Clasificar expediente como SARA

    condicion:

      sujetoRegulacionArmonizada: true

    resultado:

      regulacion:

        SARA

# ============================================================================
# REGLA PROC-014
# ============================================================================

  - id:

      PROC-014

    nombre:

      Clasificar expediente como No SARA

    condicion:

      sujetoRegulacionArmonizada: false

    resultado:

      regulacion:

        NoSARA

# ============================================================================
# EFECTOS DE LA REGULACIÓN ARMONIZADA
# ============================================================================

efectosSARA:

  publicidad:

    DOUE: obligatoria

    PlataformaContratacionSectorPublico: obligatoria

  recursoEspecial:

    evaluarAutomaticamente: true

  plazos:

    calcularConformeLCSP: true

# ============================================================================
# EFECTOS DE LOS CONTRATOS NO SARA
# ============================================================================

efectosNoSARA:

  publicidad:

    PerfilContratante: obligatoria

    DOUE: noProcede

  recursoEspecial:

    evaluarAutomaticamente: true

# ============================================================================
# VALIDACIONES ESPECÍFICAS
# ============================================================================

validacionesSARA:

  comprobar:

    tipoContrato

    valorEstimado

    umbralAplicado

    normativaVigente

# ============================================================================
# JUSTIFICACIÓN AUTOMÁTICA
# ============================================================================

justificacion:

  generar:

    descripcion:

      El sistema ha determinado automáticamente si el contrato está o no
      sujeto a regulación armonizada tras comparar el valor estimado con
      el umbral normativo aplicable al tipo contractual correspondiente.

    incluir:

      tipoContrato

      valorEstimado

      umbralAplicado

      resultado

# ============================================================================
# INFORMACIÓN PARA EL MOTOR DOCUMENTAL
# ============================================================================

motorDocumental:

  insertarEn:

    memoriaJustificativa

    informeProcedimiento

    propuestaInicio

# ============================================================================
# INFORMACIÓN PARA EL KNOWLEDGE GRAPH
# ============================================================================

knowledgeGraph:

  relaciones:

    SARA:

      conectaCon:

        publicidad

        plazos

        recursoEspecial

    NoSARA:

      conectaCon:

        publicidad

        procedimiento

# ============================================================================
# TRAZABILIDAD
# ============================================================================

trazabilidad:

  registrar:

    valorEstimado

    umbralConsultado

    resultadoSARA

    fechaCalculo

# ============================================================================
# FIN PARTE 3 DE 12
# ============================================================================

# ============================================================================
# REGLAS DE PUBLICIDAD DEL PROCEDIMIENTO
# ============================================================================

reglasPublicidad:

# ============================================================================
# PROC-015
# ============================================================================

  - id:

      PROC-015

    nombre:

      Determinar publicidad obligatoria

    prioridad:

      muyAlta

    accion:

      calcularPublicidad

# ============================================================================
# PROC-016
# ============================================================================

  - id:

      PROC-016

    nombre:

      Contratos sujetos a regulación armonizada

    condicion:

      regulacion:

        SARA

    resultado:

      publicidad:

        DOUE: obligatoria

        PlataformaContratacionSectorPublico: obligatoria

        PerfilContratante: obligatoria

# ============================================================================
# PROC-017
# ============================================================================

  - id:

      PROC-017

    nombre:

      Contratos no sujetos a regulación armonizada

    condicion:

      regulacion:

        NoSARA

    resultado:

      publicidad:

        PerfilContratante: obligatoria

# ============================================================================
# PROC-018
# ============================================================================

  - id:

      PROC-018

    nombre:

      Procedimientos negociados

    condicion:

      procedimiento:

        negociadoSinPublicidad

    accion:

      verificarSupuestosLegales

# ============================================================================
# PROC-019
# ============================================================================

  - id:

      PROC-019

    nombre:

      Publicidad adicional

    condicion:

      publicidadComplementaria: true

    resultado:

      permitir:

        BOE

        BOJA

        OtrosMedios

# ============================================================================
# MATRIZ DE PUBLICIDAD
# ============================================================================

matrizPublicidad:

  abierto:

    PerfilContratante

  abiertoSimplificado:

    PerfilContratante

  abiertoSimplificadoAbreviado:

    PerfilContratante

  restringido:

    PerfilContratante

  negociadoConPublicidad:

    PerfilContratante

  negociadoSinPublicidad:

    publicidadLimitada

  dialogoCompetitivo:

    PerfilContratante

  asociacionInnovacion:

    PerfilContratante

# ============================================================================
# INFORMACIÓN PARA EL MOTOR DOCUMENTAL
# ============================================================================

motorDocumental:

  generar:

    anuncioLicitacion

    anuncioDOUE

    anuncioPerfilContratante

  insertar:

    procedimiento

    publicidad

    fechaPublicacion

# ============================================================================
# VALIDACIONES
# ============================================================================

validacionesPublicidad:

  comprobar:

    procedimiento

    regulacion

    publicidadAsignada

    excepciones

# ============================================================================
# ALERTAS
# ============================================================================

alertas:

  publicidad:

    sinPublicidadObligatoria:

      criticidad:

        critica

    publicidadIncorrecta:

      criticidad:

        alta

    publicidadIncompleta:

      criticidad:

        alta

# ============================================================================
# JUSTIFICACIÓN AUTOMÁTICA
# ============================================================================

justificacionPublicidad:

  generar:

    incluir:

      procedimiento

      regulacion

      publicidadAplicable

      reglasAplicadas

      normativa

# ============================================================================
# TRAZABILIDAD
# ============================================================================

trazabilidadPublicidad:

  registrar:

    publicidadCalculada

    anunciosGenerados

    fechaPublicacion

    reglasAplicadas

# ============================================================================
# INFORMACIÓN PARA KNOWLEDGE GRAPH
# ============================================================================

knowledgeGraph:

  nodo:

    Publicidad

  relaciones:

    Procedimiento

    SARA

    PerfilContratante

    DOUE

# ============================================================================
# FIN PARTE 4 DE 12
# ============================================================================

# ============================================================================
# REGLAS DE DETERMINACIÓN DE PLAZOS
# ============================================================================

reglasPlazos:

# ============================================================================
# PROC-020
# ============================================================================

  - id:

      PROC-020

    nombre:

      Consultar catálogo oficial de plazos

    prioridad:

      maxima

    accion:

      consultar:

        PARAM.PLAZOS

# ============================================================================
# PROC-021
# ============================================================================

  - id:

      PROC-021

    nombre:

      Determinar plazo de presentación de ofertas

    prioridad:

      muyAlta

    entradas:

      - procedimiento

      - regulacion

      - tramitacion

    accion:

      calcularPlazoPresentacion

# ============================================================================
# PROC-022
# ============================================================================

  - id:

      PROC-022

    nombre:

      Aplicar reducción por urgencia

    condicion:

      urgencia: true

    accion:

      reducirPlazosLegalmente

# ============================================================================
# PROC-023
# ============================================================================

  - id:

      PROC-023

    nombre:

      Mantener plazos ordinarios

    condicion:

      urgencia: false

    accion:

      aplicarPlazosOrdinarios

# ============================================================================
# PROC-024
# ============================================================================

  - id:

      PROC-024

    nombre:

      Determinar plazo de adjudicación

    accion:

      calcularPlazoAdjudicacion

# ============================================================================
# PROC-025
# ============================================================================

  - id:

      PROC-025

    nombre:

      Determinar plazo de formalización

    accion:

      calcularPlazoFormalizacion

# ============================================================================
# PROC-026
# ============================================================================

  - id:

      PROC-026

    nombre:

      Determinar plazo de ejecución

    accion:

      validarPlazoEjecucion

# ============================================================================
# MATRIZ DE PLAZOS
# ============================================================================

matrizPlazos:

  consultarSiempre:

    PARAM.PLAZOS

  variables:

    procedimiento

    regulacion

    tramitacion

    mediosElectronicos

# ============================================================================
# VALIDACIONES
# ============================================================================

validacionesPlazos:

  comprobar:

    procedimiento

    regulacion

    tramitacion

    plazoCalculado

# ============================================================================
# COMPROBACIONES ESPECIALES
# ============================================================================

comprobaciones:

  noPermitir:

    plazoInferiorAlLegal

    plazoIncompatible

    plazoNoMotivado

# ============================================================================
# JUSTIFICACIÓN AUTOMÁTICA
# ============================================================================

justificacionPlazos:

  generar:

    incluir:

      procedimiento

      regulacion

      tramitacion

      parametroConsultado

      reglasAplicadas

# ============================================================================
# MOTOR DOCUMENTAL
# ============================================================================

motorDocumental:

  insertar:

    plazoPresentacion

    plazoFormalizacion

    plazoEjecucion

    justificacionPlazos

# ============================================================================
# MOTOR DE ALERTAS
# ============================================================================

alertas:

  plazoInferiorLegal:

    criticidad:

      critica

  plazoNoCalculado:

    criticidad:

      critica

  plazoIncompatible:

    criticidad:

      alta

# ============================================================================
# KNOWLEDGE GRAPH
# ============================================================================

knowledgeGraph:

  nodo:

    Plazos

  relaciones:

    Procedimiento

    Publicidad

    Regulacion

    Tramitacion

# ============================================================================
# TRAZABILIDAD
# ============================================================================

trazabilidad:

  registrar:

    procedimiento

    regulacion

    parametroPlazos

    plazoResultado

    reglasAplicadas

# ============================================================================
# FIN PARTE 5 DE 12
# ============================================================================

# ============================================================================
# REGLAS SOBRE MESA DE CONTRATACIÓN Y ÓRGANOS DE ASISTENCIA
# ============================================================================

reglasMesaContratacion:

# ============================================================================
# PROC-027
# ============================================================================

  - id:

      PROC-027

    nombre:

      Evaluar intervención de la Mesa de Contratación

    prioridad:

      alta

    accion:

      evaluarMesaContratacion

# ============================================================================
# PROC-028
# ============================================================================

  - id:

      PROC-028

    nombre:

      Consultar normativa aplicable

    prioridad:

      alta

    accion:

      consultar:

        PARAM.MESA_CONTRATACION

# ============================================================================
# PROC-029
# ============================================================================

  - id:

      PROC-029

    nombre:

      Determinar obligatoriedad de Mesa

    entradas:

      - procedimiento

      - organoContratacion

      - tipoContrato

      - normativaAplicable

    accion:

      comprobarSupuestosLegales

# ============================================================================
# PROC-030
# ============================================================================

  - id:

      PROC-030

    nombre:

      Mesa obligatoria

    condicion:

      mesaContratacion:

        obligatoria

    resultado:

      requiereMesa:

        true

# ============================================================================
# PROC-031
# ============================================================================

  - id:

      PROC-031

    nombre:

      Mesa no obligatoria

    condicion:

      mesaContratacion:

        noObligatoria

    resultado:

      requiereMesa:

        false

# ============================================================================
# PROC-032
# ============================================================================

  - id:

      PROC-032

    nombre:

      Verificar composición

    condicion:

      requiereMesa: true

    accion:

      validarComposicionMesa

# ============================================================================
# PROC-033
# ============================================================================

  - id:

      PROC-033

    nombre:

      Verificar incompatibilidades

    condicion:

      requiereMesa: true

    accion:

      comprobarIncompatibilidades

# ============================================================================
# PROC-034
# ============================================================================

  - id:

      PROC-034

    nombre:

      Registrar constitución de Mesa

    condicion:

      requiereMesa: true

    accion:

      registrarConstitucion

# ============================================================================
# VALIDACIONES
# ============================================================================

