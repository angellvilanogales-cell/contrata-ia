  registrar:

    decision

    normativaAplicada

    composicion

    fechaConstitucion

    reglasAplicadas

# ============================================================================
# FIN PARTE 6 DE 12
# ============================================================================

# ============================================================================
# REGLAS SOBRE RECURSO ESPECIAL EN MATERIA DE CONTRATACIÓN
# ============================================================================

reglasRecursoEspecial:

# ============================================================================
# PROC-035
# ============================================================================

  - id:

      PROC-035

    nombre:

      Evaluar procedencia del recurso especial

    prioridad:

      muyAlta

    accion:

      evaluarRecursoEspecial

# ============================================================================
# PROC-036
# ============================================================================

  - id:

      PROC-036

    nombre:

      Consultar normativa aplicable

    prioridad:

      muyAlta

    accion:

      consultar:

        PARAM.RECURSO_ESPECIAL

# ============================================================================
# PROC-037
# ============================================================================

  - id:

      PROC-037

    nombre:

      Comprobar actos susceptibles de recurso

    entradas:

      - procedimiento

      - tipoContrato

      - actoAdministrativo

      - valorEstimado

    accion:

      comprobarActoRecurrible

# ============================================================================
# PROC-038
# ============================================================================

  - id:

      PROC-038

    nombre:

      Recurso especial procedente

    condicion:

      recursoEspecial:

        procede

    resultado:

      recursoEspecial:

        true

# ============================================================================
# PROC-039
# ============================================================================

  - id:

      PROC-039

    nombre:

      Recurso especial no procedente

    condicion:

      recursoEspecial:

        noProcede

    resultado:

      recursoEspecial:

        false

# ============================================================================
# PROC-040
# ============================================================================

  - id:

      PROC-040

    nombre:

      Determinar órgano competente

    condicion:

      recursoEspecial: true

    accion:

      determinarOrganoResolucion

# ============================================================================
# PROC-041
# ============================================================================

  - id:

      PROC-041

    nombre:

      Determinar efectos suspensivos

    condicion:

      recursoEspecial: true

    accion:

      evaluarSuspensionAutomatica

# ============================================================================
# ACTOS ANALIZADOS
# ============================================================================

actosRecurribles:

  anuncioLicitacion

  pliegos

  exclusion

  adjudicacion

  modificacion

# ============================================================================
# VALIDACIONES
# ============================================================================

validacionesRecurso:

  comprobar:

    tipoContrato

    actoAdministrativo

    normativaAplicable

