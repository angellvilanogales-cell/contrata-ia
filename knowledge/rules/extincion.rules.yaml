# ============================================================================
# CONTRATA-IA
# MOTOR DE REGLAS
# EXTINCIÓN DEL CONTRATO
# Ley 9/2017 de Contratos del Sector Público
# ============================================================================
#
# Archivo:
# knowledge/rules/extincion.rules.yaml
#
# Versión:
# 1.0
#
# Finalidad:
#
# Regular todas las actuaciones relativas a la extinción del contrato,
# tanto por cumplimiento como por resolución, renuncia,
# desistimiento u otras causas previstas legalmente.
#
# Este módulo constituye el cierre jurídico del ciclo contractual.
#
# ============================================================================

version: 1.0

modulo: EXTINCION

descripcion: >

  Motor de reglas encargado de controlar el procedimiento de
  extinción del contrato administrativo conforme a la LCSP.

estado: ACTIVO

autor: CONTRATA-IA

# ============================================================================
# CONFIGURACIÓN GENERAL
# ============================================================================

configuracion:

  verificarLCSP: true

  verificarPCAP: true

  verificarPPT: true

  registrarAuditoria: true

  registrarEventos: true

  registrarTrazabilidad: true

  actualizarWorkflow: true

  actualizarExpediente: true

# ============================================================================
# EVENTOS DE ENTRADA
# ============================================================================

eventosEntrada:

  - contrato.cumplido

  - contrato.resuelto

  - contrato.renunciado

  - contrato.desistido

  - contrato.imposible

  - contrato.finalizado

  - garantia.finalizada

  - expediente.cerrar

# ============================================================================
# ESTADOS POSIBLES
# ============================================================================

estados:

  - EJECUCION

  - GARANTIA

  - EXTINCION

  - RESOLUCION

  - LIQUIDACION

  - CERRADO

# ============================================================================
# BLOQUE GENERAL
# ============================================================================

extincion:

  activa: true

  verificarLegalidad: true

  controlarProcedimiento: true

  registrarAuditoria: true

# ============================================================================
# REGLA EXT-001
# ============================================================================

- id: EXT-001

  nombre: Inicio del procedimiento de extinción

  prioridad: maxima

  condicion:

    evento:

      - contrato.cumplido

      - contrato.resuelto

      - contrato.renunciado

      - contrato.desistido

      - contrato.imposible

  accion:

    cambiarEstado:

      nuevoEstado: EXTINCION

  resultado:

    continuar

  justificar:

    Toda causa legal de terminación iniciará el procedimiento de
    extinción del contrato.

  referencia:

    LCSP

# ----------------------------------------------------------------------------
# REGLA EXT-002
# ----------------------------------------------------------------------------

- id: EXT-002

  nombre: Clasificación de la causa

  prioridad: maxima

  condicion:

    estadoActual: EXTINCION

  accion:

    clasificar:

      causaExtincion

  resultado:

    continuar

  justificar:

    La causa jurídica determinará el procedimiento aplicable.

  referencia:

    LCSP

# ----------------------------------------------------------------------------
# REGLA EXT-003
# ----------------------------------------------------------------------------

- id: EXT-003

  nombre: Registro de inicio

  prioridad: alta

  condicion:

    causaExtincionClasificada: true

  accion:

    registrar:

      inicioProcedimientoExtincion

  resultado:

    continuar

  justificar:

    El expediente registrará el inicio del procedimiento.

  referencia:

    ENI

# ----------------------------------------------------------------------------
# REGLA EXT-004
# ----------------------------------------------------------------------------

- id: EXT-004

  nombre: Comunicación al Workflow Engine

  prioridad: media

  condicion:

    inicioProcedimientoExtincionRegistrado: true

  accion:

    publicarEvento:

      nombre: extincion.iniciada

  resultado:

    continuar

  justificar:

    El Workflow Engine iniciará el flujo correspondiente.

  referencia:

    CONTRATA_IA

# ============================================================================
# CONFIGURACIÓN DEL BLOQUE
# ============================================================================

inicioExtincion:

  clasificarCausa: true

  registrarInicio: true

  actualizarWorkflow: true

  registrarAuditoria: true

# ============================================================================
# FIN PARTE 1 DE 20
# ============================================================================

# ============================================================================
# EXTINCIÓN POR CUMPLIMIENTO DEL CONTRATO
# Artículos 209 y 210 LCSP
# ============================================================================

cumplimientoContrato:

  activo: true

  comprobarPrestaciones: true

  comprobarRecepcion: true

  comprobarLiquidacion: true

  registrarAuditoria: true

# ============================================================================
# REGLA EXT-005
# ============================================================================

- id: EXT-005

  nombre: Inicio del procedimiento por cumplimiento

  prioridad: maxima

  condicion:

    causaExtincion: CUMPLIMIENTO

  accion:

    cambiarEstado:

      nuevoEstado: CUMPLIMIENTO

  resultado:

    continuar

  justificar:

    Cuando la causa de extinción sea el cumplimiento íntegro del contrato se iniciará el procedimiento ordinario de terminación.

  referencia:

    LCSP_209

# ----------------------------------------------------------------------------
# REGLA EXT-006
# ----------------------------------------------------------------------------

- id: EXT-006

  nombre: Verificación de ejecución completa

  prioridad: maxima

  condicion:

    estadoActual: CUMPLIMIENTO

  accion:

    verificar:

      prestacionesCompletadas

  resultado:

    continuar

  justificar:

    El sistema comprobará que todas las prestaciones previstas han sido ejecutadas.

  referencia:

    LCSP_209

# ----------------------------------------------------------------------------
# REGLA EXT-007
# ----------------------------------------------------------------------------

- id: EXT-007

  nombre: Comprobación de recepción definitiva

  prioridad: maxima

  condicion:

    prestacionesCompletadas: true

  accion:

    verificar:

      recepcionDefinitivaRealizada

  resultado:

    continuar

  justificar:

    La recepción definitiva constituye un requisito previo para la extinción ordinaria.

  referencia:

    LCSP_210

# ----------------------------------------------------------------------------
# REGLA EXT-008
# ----------------------------------------------------------------------------

- id: EXT-008

  nombre: Verificación de liquidación

  prioridad: maxima

  condicion:

    recepcionDefinitivaRealizada: true

  accion:

    verificar:

      liquidacionFinalizada

  resultado:

    continuar

  justificar:

    Antes de extinguir el contrato deberá encontrarse finalizada la liquidación económica.

  referencia:

    LCSP

# ----------------------------------------------------------------------------
# REGLA EXT-009
# ----------------------------------------------------------------------------

- id: EXT-009

  nombre: Comprobación del plazo de garantía

  prioridad: alta

  condicion:

    liquidacionFinalizada: true

  accion:

    verificar:

      garantiaFinalizada

  resultado:

    continuar

  justificar:

    Se comprobará que el plazo de garantía haya concluido cuando resulte exigible.

  referencia:

    LCSP_111

# ----------------------------------------------------------------------------
# REGLA EXT-010
# ----------------------------------------------------------------------------

- id: EXT-010

  nombre: Verificación de obligaciones pendientes

  prioridad: alta

  condicion:

    garantiaFinalizada: true

  accion:

    verificar:

      obligacionesPendientes

  resultado:

    continuar

  justificar:

    El contrato no podrá extinguirse mientras existan obligaciones pendientes.

  referencia:

    LCSP

# ----------------------------------------------------------------------------
# REGLA EXT-011
# ----------------------------------------------------------------------------

- id: EXT-011

  nombre: Confirmación del cumplimiento íntegro

  prioridad: maxima

  condicion:

    obligacionesPendientes: false

  accion:

    confirmar:

      cumplimientoIntegro

  resultado:

    continuar

  justificar:

    El órgano competente confirmará el cumplimiento íntegro del contrato.

  referencia:

    LCSP

# ----------------------------------------------------------------------------
# REGLA EXT-012
# ----------------------------------------------------------------------------

- id: EXT-012

  nombre: Registro del cumplimiento

  prioridad: alta

  condicion:

    cumplimientoIntegroConfirmado: true

  accion:

    registrar:

      cumplimientoContrato

  resultado:

    continuar

  justificar:

    El cumplimiento íntegro quedará incorporado al expediente electrónico.

  referencia:

    ENI

# ----------------------------------------------------------------------------
# REGLA EXT-013
# ----------------------------------------------------------------------------

- id: EXT-013

  nombre: Actualización del historial

  prioridad: media

  condicion:

    cumplimientoContratoRegistrado: true

  accion:

    actualizar:

      historialContrato

  resultado:

    continuar

  justificar:

    El historial del contrato reflejará su correcta finalización.

  referencia:

    CONTRATA_IA

# ----------------------------------------------------------------------------
# REGLA EXT-014
# ----------------------------------------------------------------------------

- id: EXT-014

  nombre: Comunicación al Workflow Engine

  prioridad: media

  condicion:

    historialContratoActualizado: true

  accion:

    publicarEvento:

      nombre: contrato.cumplimiento.confirmado

  resultado:

    continuar

  justificar:

    El Workflow Engine continuará el procedimiento de cierre definitivo.

  referencia:

    CONTRATA_IA

# ============================================================================
# CONFIGURACIÓN DEL BLOQUE
# ============================================================================

cumplimiento:

  verificarPrestaciones: true

  verificarRecepcion: true

  verificarLiquidacion: true

  verificarGarantia: true

  registrarCumplimiento: true

  registrarAuditoria: true

# ============================================================================
# FIN PARTE 2 DE 20
# ============================================================================

# ============================================================================
# EXTINCIÓN POR RESOLUCIÓN DEL CONTRATO
# Artículos 211 a 213 LCSP
# ============================================================================

resolucionExtincion:

  activa: true

  verificarCausas: true

  controlarProcedimiento: true

  registrarAuditoria: true

# ============================================================================
# REGLA EXT-015
# ============================================================================

- id: EXT-015

  nombre: Inicio de resolución contractual

  prioridad: maxima

  condicion:

    causaExtincion: RESOLUCION

  accion:

    cambiarEstado:

      nuevoEstado: RESOLUCION

  resultado:

    continuar

  justificar:

    Cuando la causa de extinción sea la resolución contractual se iniciará el procedimiento específico.

  referencia:

    LCSP_211

# ----------------------------------------------------------------------------
# REGLA EXT-016
# ----------------------------------------------------------------------------

- id: EXT-016

  nombre: Identificación de la causa legal

  prioridad: maxima

  condicion:

    estadoActual: RESOLUCION

  accion:

    clasificar:

      causaResolucion

  resultado:

    continuar

  justificar:

    El sistema identificará la causa legal concreta que fundamenta la resolución.

  referencia:

    LCSP_211

# ----------------------------------------------------------------------------
# REGLA EXT-017
# ----------------------------------------------------------------------------

- id: EXT-017

  nombre: Validación jurídica

  prioridad: maxima

  condicion:

    causaResolucionClasificada: true

  accion:

    verificar:

      causaLegalResolucion

  resultado:

    continuar

  justificar:

    Solo procederá la resolución cuando concurra una causa prevista legalmente.

  referencia:

    LCSP_211

# ----------------------------------------------------------------------------
# REGLA EXT-018
# ----------------------------------------------------------------------------

- id: EXT-018

  nombre: Determinación del responsable

  prioridad: alta

  condicion:

    causaLegalResolucion: true

  accion:

    identificar:

      responsableResolucion

  resultado:

    continuar

  justificar:

    El sistema determinará si la causa resulta imputable al contratista, a la Administración o a circunstancias ajenas.

  referencia:

    LCSP_213

# ----------------------------------------------------------------------------
# REGLA EXT-019
# ----------------------------------------------------------------------------

- id: EXT-019

  nombre: Solicitud de informes

  prioridad: alta

  condicion:

    responsableResolucionIdentificado: true

  accion:

    solicitar:

      informesResolucion

  resultado:

    continuar

  justificar:

    Se incorporarán los informes técnicos y jurídicos exigibles.

  referencia:

    LCSP

# ----------------------------------------------------------------------------
# REGLA EXT-020
# ----------------------------------------------------------------------------

- id: EXT-020

  nombre: Inicio del trámite de audiencia

  prioridad: maxima

  condicion:

    informesResolucionEmitidos: true

  accion:

    iniciar:

      audienciaContratista

  resultado:

    continuar

  justificar:

    Se concederá audiencia al contratista cuando proceda.

  referencia:

    Ley39_2015

# ----------------------------------------------------------------------------
# REGLA EXT-021
# ----------------------------------------------------------------------------

- id: EXT-021

  nombre: Registro de alegaciones

  prioridad: alta

  condicion:

    audienciaContratistaFinalizada: true

  accion:

    registrar:

      alegacionesResolucion

  resultado:

    continuar

  justificar:

    Las alegaciones formuladas quedarán incorporadas al expediente.

  referencia:

    Ley39_2015

# ----------------------------------------------------------------------------
# REGLA EXT-022
# ----------------------------------------------------------------------------

- id: EXT-022

  nombre: Evaluación de alegaciones

  prioridad: alta

  condicion:

    alegacionesResolucionRegistradas: true

  accion:

    evaluar:

      alegacionesResolucion

  resultado:

    continuar

  justificar:

    Las alegaciones serán valoradas antes de la resolución definitiva.

  referencia:

    Ley39_2015

# ----------------------------------------------------------------------------
# REGLA EXT-023
# ----------------------------------------------------------------------------

- id: EXT-023

  nombre: Resolución definitiva

  prioridad: maxima

  condicion:

    alegacionesResolucionEvaluadas: true

  accion:

    resolver:

      resolucionContrato

  resultado:

    continuar

  justificar:

    El órgano de contratación resolverá motivadamente el procedimiento.

  referencia:

    LCSP_212

# ----------------------------------------------------------------------------
# REGLA EXT-024
# ----------------------------------------------------------------------------

- id: EXT-024

  nombre: Comunicación al Workflow Engine

  prioridad: media

  condicion:

    resolucionContratoEmitida: true

  accion:

    publicarEvento:

      nombre: resolucion.extincion.finalizada

  resultado:

    continuar

  justificar:

    Finalizado el procedimiento continuará la fase de determinación de efectos económicos.

  referencia:

    CONTRATA_IA

# ============================================================================
# CONFIGURACIÓN DEL BLOQUE
# ============================================================================

resolucion:

  verificarCausas: true

  identificarResponsable: true

  solicitarInformes: true

  tramitarAudiencia: true

  registrarAuditoria: true

# ============================================================================
# FIN PARTE 3 DE 20
# ============================================================================

# ============================================================================
# EFECTOS DE LA RESOLUCIÓN DEL CONTRATO
# Artículo 213 LCSP
# ============================================================================

efectosResolucion:

  activa: true

  calcularConsecuencias: true

  registrarAuditoria: true

# ============================================================================
# REGLA EXT-025
# ============================================================================

- id: EXT-025

  nombre: Inicio del cálculo de efectos

  prioridad: maxima

  condicion:

    resolucionContratoEmitida: true

  accion:

    cambiarEstado:

      nuevoEstado: EFECTOS_RESOLUCION

  resultado:

    continuar

  justificar:

    Una vez resuelto el contrato comenzará la determinación de sus efectos jurídicos y económicos.

  referencia:

    LCSP_213

# ----------------------------------------------------------------------------
# REGLA EXT-026
# ----------------------------------------------------------------------------

- id: EXT-026

  nombre: Determinación del responsable

  prioridad: maxima

  condicion:

    estadoActual: EFECTOS_RESOLUCION

  accion:

    identificar:

      responsableIncumplimiento

  resultado:

    continuar

  justificar:

    El sistema identificará la parte responsable de la resolución contractual.

  referencia:

    LCSP_213

# ----------------------------------------------------------------------------
# REGLA EXT-027
# ----------------------------------------------------------------------------

- id: EXT-027

  nombre: Cálculo de indemnizaciones

  prioridad: maxima

  condicion:

    responsableIncumplimientoIdentificado: true

  accion:

    calcular:

      indemnizacionesProcedentes

  resultado:

    continuar

  justificar:

    Se calcularán las indemnizaciones que correspondan conforme a la legislación vigente.

  referencia:

    LCSP_213

# ----------------------------------------------------------------------------
# REGLA EXT-028
# ----------------------------------------------------------------------------

- id: EXT-028

  nombre: Determinación de prestaciones ejecutadas

  prioridad: alta

  condicion:

    indemnizacionesProcedentesCalculadas: true

  accion:

    calcular:

      prestacionesAceptadas

  resultado:

    continuar

  justificar:

    Se determinarán las prestaciones correctamente ejecutadas antes de la resolución.

  referencia:

    LCSP

# ----------------------------------------------------------------------------
# REGLA EXT-029
# ----------------------------------------------------------------------------

- id: EXT-029

  nombre: Liquidación económica

  prioridad: maxima

  condicion:

    prestacionesAceptadasCalculadas: true

  accion:

    generar:

      liquidacionResolucion

  resultado:

    continuar

  justificar:

    El sistema elaborará la liquidación económica derivada de la resolución.

  referencia:

    LCSP

# ----------------------------------------------------------------------------
# REGLA EXT-030
# ----------------------------------------------------------------------------

- id: EXT-030

  nombre: Valoración de la garantía

  prioridad: maxima

  condicion:

    liquidacionResolucionGenerada: true

  accion:

    evaluar:

      garantiaDefinitiva

  resultado:

    continuar

  justificar:

    Se evaluará la devolución o incautación de la garantía definitiva.

  referencia:

    LCSP_110

# ----------------------------------------------------------------------------
# REGLA EXT-031
# ----------------------------------------------------------------------------

- id: EXT-031

  nombre: Compensaciones económicas

  prioridad: alta

  condicion:

    garantiaDefinitivaEvaluada: true

  accion:

    calcular:

      compensacionesEconomicas

  resultado:

    continuar

  justificar:

    Se calcularán las compensaciones económicas derivadas de la resolución.

  referencia:

    LCSP

# ----------------------------------------------------------------------------
# REGLA EXT-032
# ----------------------------------------------------------------------------

- id: EXT-032

  nombre: Actualización contable

  prioridad: alta

  condicion:

    compensacionesEconomicasCalculadas: true

  accion:

    publicarEvento:

      nombre: contabilidad.actualizar

  resultado:

    continuar

  justificar:

    El módulo económico actualizará la situación contable del contrato.

  referencia:

    CONTRATA_IA

# ----------------------------------------------------------------------------
# REGLA EXT-033
# ----------------------------------------------------------------------------

- id: EXT-033

  nombre: Incorporación al expediente

  prioridad: alta

  condicion:

    contabilidadActualizada: true

  accion:

    actualizar:

      expedienteElectronico

  resultado:

    continuar

  justificar:

    Toda la documentación derivada de la resolución quedará incorporada al expediente.

  referencia:

    ENI

# ----------------------------------------------------------------------------
# REGLA EXT-034
# ----------------------------------------------------------------------------

- id: EXT-034

  nombre: Registro de auditoría

  prioridad: alta

  condicion:

    siempre: true

  accion:

    registrar:

      auditoriaEfectosResolucion

  resultado:

    continuar

  justificar:

    Los efectos jurídicos y económicos quedarán registrados para auditoría.

  referencia:

    ENS

# ----------------------------------------------------------------------------
# REGLA EXT-035
# ----------------------------------------------------------------------------

- id: EXT-035

  nombre: Comunicación al Workflow Engine

  prioridad: media

  condicion:

    expedienteElectronicoActualizado: true

  accion:

    publicarEvento:

      nombre: efectos.resolucion.finalizados

  resultado:

    continuar

  justificar:

    Finalizada la determinación de efectos continuará el procedimiento de cierre.

  referencia:

    CONTRATA_IA

# ============================================================================
# CONFIGURACIÓN DEL BLOQUE
# ============================================================================

efectos:

  calcularIndemnizaciones: true

  calcularLiquidacion: true

  evaluarGarantia: true

  actualizarExpediente: true

  registrarAuditoria: true

# ============================================================================
# FIN PARTE 4 DE 20
# ============================================================================

# ============================================================================
# RENUNCIA Y DESISTIMIENTO
# Artículos 152 y concordantes LCSP
# ============================================================================

