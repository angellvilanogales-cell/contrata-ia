# ============================================================================
# CONTRATA-IA
# RULE ENGINE INDEX
# MASTER BOOTSTRAP
# ============================================================================
#
# Archivo:
# knowledge/rule-engine/index.yaml
#
# Función:
#
# Punto único de entrada del Sistema Experto.
#
# Registra todos los motores.
#
# Controla el orden de carga.
#
# Gestiona dependencias.
#
# Coordina la inicialización completa.
#
# ============================================================================

system:

  name: CONTRATA-IA

  version: "1.0.0"

  codename: "Contrata Intelligent Expert System"

  description: >

    Sistema Experto para la gestión integral de expedientes de contratación
    pública conforme a la LCSP, Ley 39/2015, Ley 40/2015 y normativa
    complementaria.

  organization: Junta de Andalucía

  domain: Contratación Pública

  architecture: Expert System

  status: production

# ============================================================================
# INFORMACIÓN GENERAL
# ============================================================================

information:

  expertSystem: true

  explainableAI: true

  deterministicReasoning: true

  ruleBasedSystem: true

  inferenceBasedSystem: true

  legalReasoning: true

  documentGeneration: true

  electronicFileGeneration: true

# ============================================================================
# CONFIGURACIÓN GENERAL
# ============================================================================

configuration:

  language: es-ES

  timezone: Europe/Madrid

  encoding: UTF-8

  dateFormat: dd/MM/yyyy

  decimalSeparator: ","

  thousandsSeparator: "."

# ============================================================================
# MODO DE EJECUCIÓN
# ============================================================================

execution:

  mode: production

  safeMode: true

  debugMode: false

  simulationMode: false

  verboseLogs: true

# ============================================================================
# CARGA DEL SISTEMA
# ============================================================================

bootstrap:

  automaticInitialization: true

  verifyIntegrity: true

  verifyDependencies: true

  verifyVersions: true

  verifyKnowledgeBase: true

# ============================================================================
# CONFIGURACIÓN DEL NÚCLEO
# ============================================================================

kernel:

  enabled: true

  initializeAutomatically: true

  centralizedControl: true

  dependencyInjection: true

  lifecycleManagement: true

# ============================================================================
# VERSIONADO
# ============================================================================

versioning:

  semanticVersioning: true

  compatibilityValidation: true

  minimumCompatibleVersion: "1.0.0"

# ============================================================================
# METADATOS
# ============================================================================

metadata:

  author: CONTRATA-IA

  owner: Junta de Andalucía

  repository: knowledge/rule-engine

  createdAutomatically: true

# ============================================================================
# FIN PARTE 1 DE 25
# ============================================================================

# ============================================================================
# REGISTRO MAESTRO DE MOTORES
# MASTER ENGINE REGISTRY
# ============================================================================

engineRegistry:

  enabled: true

  autoDiscovery: false

  verifyRegistration: true

  uniqueIdentifiers: true

  dependencyValidation: true

# ============================================================================
# MOTORES PRINCIPALES
# ============================================================================

registeredEngines:

  - id: RULE_ENGINE

    file: 00-core.rules.yaml

    version: "1.0.0"

    enabled: true

    priority: 10

    mandatory: true

  - id: INFERENCE_ENGINE

    version: "1.0.0"

    enabled: true

    priority: 20

    mandatory: true

  - id: LEGAL_DECISION_ENGINE

    version: "1.0.0"

    enabled: true

    priority: 30

    mandatory: true

  - id: LEGAL_INTERPRETATION_ENGINE

    version: "1.0.0"

    enabled: true

    priority: 40

    mandatory: true

  - id: DECISION_PLANNER

    version: "1.0.0"

    enabled: true

    priority: 50

    mandatory: true

  - id: EXPLAINABILITY_ENGINE

    version: "1.0.0"

    enabled: true

    priority: 60

    mandatory: true

  - id: OPTIMIZATION_ENGINE

    version: "1.0.0"

    enabled: true

    priority: 70

    mandatory: true

  - id: SIMULATION_ENGINE

    version: "1.0.0"

    enabled: true

    priority: 80

    mandatory: true

  - id: RISK_ENGINE

    version: "1.0.0"

    enabled: true

    priority: 90

    mandatory: true

  - id: COMPLIANCE_ENGINE

    version: "1.0.0"

    enabled: true

    priority: 100

    mandatory: true

# ============================================================================
# MOTORES DOCUMENTALES
# ============================================================================

documentEngines:

  - id: DOCUMENT_VALIDATION_ENGINE

    priority: 110

    enabled: true

  - id: DOCUMENT_GENERATION_ENGINE

    priority: 120

    enabled: true

  - id: ELECTRONIC_EXPEDIENT_ENGINE

    priority: 130

    enabled: true

# ============================================================================
# MOTORES DE SOPORTE
# ============================================================================

supportEngines:

  - id: INTEROPERABILITY_ENGINE

    priority: 140

    enabled: true

  - id: CONTRACT_INTELLIGENCE_ENGINE

    priority: 150

    enabled: true

  - id: KNOWLEDGE_GOVERNANCE_ENGINE

    priority: 160

    enabled: true

  - id: SUPERVISION_ENGINE

    priority: 170

    enabled: true

# ============================================================================
# MOTOR DIRECTOR
# ============================================================================

masterEngine:

  id: CONTRATA_IA_MASTER

  priority: 1000

  enabled: true

  mandatory: true

  singleton: true

# ============================================================================
# POLÍTICAS DE REGISTRO
# ============================================================================

registrationPolicies:

  duplicatedIdentifiers: forbidden

  duplicatedPriorities: allowed

  disabledMandatoryEngine: forbidden

  missingDependencies: forbidden

# ============================================================================
# FIN PARTE 2 DE 25
# ============================================================================

# ============================================================================
# ÁRBOL OFICIAL DE DEPENDENCIAS
# ENGINE DEPENDENCY GRAPH
# ============================================================================

dependencyGraph:

  validationMode: strict

  detectCircularDependencies: true

  automaticResolution: true

  stopOnDependencyError: true

# ============================================================================
# DEPENDENCIAS DEL NÚCLEO
# ============================================================================

dependencies:

  RULE_ENGINE:

    dependsOn: []

    required: true

  INFERENCE_ENGINE:

    dependsOn:

      - RULE_ENGINE

    required: true

  LEGAL_DECISION_ENGINE:

    dependsOn:

      - RULE_ENGINE

      - INFERENCE_ENGINE

    required: true

  LEGAL_INTERPRETATION_ENGINE:

    dependsOn:

      - LEGAL_DECISION_ENGINE

    required: true

  DECISION_PLANNER:

    dependsOn:

      - LEGAL_INTERPRETATION_ENGINE

    required: true

# ============================================================================
# DEPENDENCIAS DE APOYO
# ============================================================================

  EXPLAINABILITY_ENGINE:

    dependsOn:

      - LEGAL_DECISION_ENGINE

      - LEGAL_INTERPRETATION_ENGINE

    required: true

  OPTIMIZATION_ENGINE:

    dependsOn:

      - DECISION_PLANNER

    required: true

  SIMULATION_ENGINE:

    dependsOn:

      - OPTIMIZATION_ENGINE

    required: true

  RISK_ENGINE:

    dependsOn:

      - LEGAL_DECISION_ENGINE

      - SIMULATION_ENGINE

    required: true

  COMPLIANCE_ENGINE:

    dependsOn:

      - RULE_ENGINE

      - LEGAL_DECISION_ENGINE

      - RISK_ENGINE

    required: true

# ============================================================================
# DEPENDENCIAS DOCUMENTALES
# ============================================================================

  DOCUMENT_VALIDATION_ENGINE:

    dependsOn:

      - COMPLIANCE_ENGINE

    required: true

  DOCUMENT_GENERATION_ENGINE:

    dependsOn:

      - DOCUMENT_VALIDATION_ENGINE

      - EXPLAINABILITY_ENGINE

    required: true

  ELECTRONIC_EXPEDIENT_ENGINE:

    dependsOn:

      - DOCUMENT_GENERATION_ENGINE

      - DOCUMENT_VALIDATION_ENGINE

    required: true

# ============================================================================
# DEPENDENCIAS DE SERVICIO
# ============================================================================

  INTEROPERABILITY_ENGINE:

    dependsOn:

      - ELECTRONIC_EXPEDIENT_ENGINE

    required: true

  CONTRACT_INTELLIGENCE_ENGINE:

    dependsOn:

      - RULE_ENGINE

      - INFERENCE_ENGINE

      - COMPLIANCE_ENGINE

      - DOCUMENT_GENERATION_ENGINE

    required: true

  KNOWLEDGE_GOVERNANCE_ENGINE:

    dependsOn:

      - RULE_ENGINE

      - CONTRACT_INTELLIGENCE_ENGINE

    required: true

  SUPERVISION_ENGINE:

    dependsOn:

      - RULE_ENGINE

      - INFERENCE_ENGINE

      - LEGAL_DECISION_ENGINE

      - DOCUMENT_GENERATION_ENGINE

      - INTEROPERABILITY_ENGINE

      - CONTRACT_INTELLIGENCE_ENGINE

    required: true

# ============================================================================
# MOTOR DIRECTOR
# ============================================================================

  CONTRATA_IA_MASTER:

    dependsOn:

      - RULE_ENGINE

      - INFERENCE_ENGINE

      - LEGAL_DECISION_ENGINE

      - LEGAL_INTERPRETATION_ENGINE

      - DECISION_PLANNER

      - EXPLAINABILITY_ENGINE

      - OPTIMIZATION_ENGINE

      - SIMULATION_ENGINE

      - RISK_ENGINE

      - COMPLIANCE_ENGINE

      - DOCUMENT_VALIDATION_ENGINE

      - DOCUMENT_GENERATION_ENGINE

      - ELECTRONIC_EXPEDIENT_ENGINE

      - INTEROPERABILITY_ENGINE

      - CONTRACT_INTELLIGENCE_ENGINE

      - KNOWLEDGE_GOVERNANCE_ENGINE

      - SUPERVISION_ENGINE

    required: true

# ============================================================================
# POLÍTICAS
# ============================================================================

dependencyPolicies:

  missingDependency: error

  circularDependency: critical

  duplicatedDependency: warning

  orphanEngine: warning

  disabledRequiredDependency: critical

# ============================================================================
# FIN PARTE 3 DE 25
# ============================================================================

# ============================================================================
# BOOTSTRAP PIPELINE
# SECUENCIA OFICIAL DE INICIALIZACIÓN
# ============================================================================

bootstrapPipeline:

  enabled: true

  sequentialExecution: true

  stopOnCriticalError: true

  rollbackEnabled: true

  auditInitialization: true

# ============================================================================
# FASE 1
# CARGA DEL SISTEMA
# ============================================================================

phase01:

  id: SYSTEM_LOADING

  priority: 10

  description: Load system configuration

  tasks:

    - loadConfiguration

    - verifyEnvironment

    - verifyRepository

    - verifyVersion

    - initializeKernel

# ============================================================================
# FASE 2
# VERIFICACIÓN
# ============================================================================

phase02:

  id: SYSTEM_VALIDATION

  priority: 20

  description: Validate installation

  tasks:

    - verifyFolders

    - verifyFiles

    - verifyIntegrity

    - verifyChecksums

    - verifySchemas

# ============================================================================
# FASE 3
# CARGA DEL CONOCIMIENTO
# ============================================================================

phase03:

  id: KNOWLEDGE_LOADING

  priority: 30

  description: Load knowledge repository

  tasks:

    - loadOntology

    - loadTaxonomy

    - loadLegalRules

    - loadDoctrine

    - loadJurisprudence

    - loadConsultiveReports

# ============================================================================
# FASE 4
# REGISTRO DE MOTORES
# ============================================================================

phase04:

  id: ENGINE_REGISTRATION

  priority: 40

  description: Register engines

  tasks:

    - registerRuleEngine

    - registerInferenceEngine

    - registerDecisionEngine

    - registerDocumentEngines

    - registerSupportEngines

# ============================================================================
# FASE 5
# RESOLUCIÓN DE DEPENDENCIAS
# ============================================================================

phase05:

  id: DEPENDENCY_RESOLUTION

  priority: 50

  description: Resolve dependencies

  tasks:

    - analyseDependencies

    - detectCycles

    - verifyMandatoryDependencies

    - buildDependencyGraph

# ============================================================================
# FASE 6
# INICIALIZACIÓN
# ============================================================================

phase06:

  id: ENGINE_INITIALIZATION

  priority: 60

  description: Initialize engines

  tasks:

    - initializeRuleEngine

    - initializeInferenceEngine

    - initializeDecisionEngine

    - initializeDocumentEngine

    - initializeSupportEngines

# ============================================================================
# FASE 7
# VALIDACIÓN
# ============================================================================

phase07:

  id: INITIALIZATION_VALIDATION

  priority: 70

  description: Validate initialized system

  tasks:

    - validateKnowledge

    - validateRules

    - validateReasoner

    - validateDocuments

    - validateConfiguration

# ============================================================================
# FASE 8
# ACTIVACIÓN
# ============================================================================

phase08:

  id: SYSTEM_ACTIVATION

  priority: 80

  description: Activate master engine

  tasks:

    - activateMasterEngine

    - activateMonitoring

    - activateAudit

    - activateInteroperability

# ============================================================================
# FASE 9
# COMPROBACIÓN FINAL
# ============================================================================

phase09:

  id: FINAL_CHECK

  priority: 90

  description: Final system verification

  tasks:

    - executeSelfTest

    - executeHealthCheck

    - executePerformanceCheck

    - generateStartupReport

# ============================================================================
# RESULTADO
# ============================================================================

startupResult:

  success: systemReady

  failure: initializationFailed

# ============================================================================
# FIN PARTE 4 DE 25
# ============================================================================

# ============================================================================
# LIFECYCLE MANAGER
# GESTIÓN DEL CICLO DE VIDA DEL SISTEMA EXPERTO
# ============================================================================

lifecycleManager:

  enabled: true

  centralizedLifecycle: true

  automaticTransitions: true

  validateTransitions: true

# ============================================================================
# ESTADOS DEL SISTEMA
# ============================================================================

systemStates:

  CREATED

  CONFIGURED

  INITIALIZED

  STARTING

  RUNNING

  PAUSED

  MAINTENANCE

  DEGRADED

  RECOVERING

  STOPPING

  STOPPED

  FAILED

# ============================================================================
# ESTADOS DE LOS MOTORES
# ============================================================================

engineStates:

  REGISTERED

  LOADED

  INITIALIZED

  READY

  RUNNING

  PAUSED

  RESTARTING

  STOPPED

  FAILED

  DISABLED

# ============================================================================
# TRANSICIONES PERMITIDAS
# ============================================================================

allowedTransitions:

  CREATED:

    - CONFIGURED

  CONFIGURED:

    - INITIALIZED

  INITIALIZED:

    - STARTING

  STARTING:

    - RUNNING

    - FAILED

  RUNNING:

    - PAUSED

    - MAINTENANCE

    - STOPPING

    - DEGRADED

  PAUSED:

    - RUNNING

    - STOPPING

  MAINTENANCE:

    - RUNNING

    - STOPPING

  DEGRADED:

    - RECOVERING

    - FAILED

  RECOVERING:

    - RUNNING

    - FAILED

  STOPPING:

    - STOPPED

# ============================================================================
# OPERACIONES
# ============================================================================

operations:

  start

  initialize

  pause

  resume

  restart

  reload

  stop

  recover

  shutdown

# ============================================================================
# ARRANQUE
# ============================================================================

startupPolicy:

  initializeSequentially: true

  waitDependencies: true

  validateInitialization: true

  abortOnCriticalFailure: true

# ============================================================================
# PARADA
# ============================================================================

shutdownPolicy:

  gracefulShutdown: true

  saveExecutionContext: true

  flushAuditLogs: true

  closeConnections: true

  releaseResources: true

# ============================================================================
# REINICIO
# ============================================================================

restartPolicy:

  enabled: true

  preserveState: true

  restoreContext: true

  validateRecovery: true

# ============================================================================
# RECUPERACIÓN
# ============================================================================

recoveryPolicy:

  enabled: true

  automaticRecovery: true

  maximumAttempts: 3

  rollbackIfRecoveryFails: true

# ============================================================================
# GESTIÓN DE CONTEXTO
# ============================================================================

executionContext:

  preserveKnowledge: true

  preserveSessions: true

  preserveCache: true

  preserveTransactions: true

# ============================================================================
# VALIDACIONES
# ============================================================================

lifecycleValidation:

  verifyDependencies: true

  verifyStateConsistency: true

  verifyPendingOperations: true

  verifyAuditStatus: true

# ============================================================================
# EVENTOS
# ============================================================================

lifecycleEvents:

  onStartup

  onInitialization

  onReady

  onPause

  onResume

  onRestart

  onRecovery

  onShutdown

  onFailure

# ============================================================================
# NOTIFICACIONES
# ============================================================================

notifications:

  notifyStartup: true

  notifyShutdown: true

  notifyFailures: true

  notifyRecovery: true

# ============================================================================
# MÉTRICAS
# ============================================================================

lifecycleMetrics:

  totalStarts: true

  totalRestarts: true

  totalFailures: true

  totalRecoveries: true

  uptime: true

# ============================================================================
# AUDITORÍA
# ============================================================================

lifecycleAudit:

  enabled: true

  registerTransitions: true

  registerOperations: true

  registerFailures: true

  registerRecoveries: true

  registerExecutionTimes: true

# ============================================================================
# FIN PARTE 5 DE 25
# ============================================================================

# ============================================================================
# CONFIGURATION MANAGER
# GESTIÓN CENTRALIZADA DE LA CONFIGURACIÓN
# ============================================================================

configurationManager:

  enabled: true

  centralizedConfiguration: true

  dynamicConfiguration: true

  validateConfiguration: true

  hotReload: true

# ============================================================================
# CONFIGURACIÓN GENERAL
# ============================================================================

globalConfiguration:

  language: es-ES

  timezone: Europe/Madrid

  locale: es_ES

  encoding: UTF-8

  environment: production

  profile: default

# ============================================================================
# ENTORNOS
# ============================================================================

environments:

  development:

    debug: true

    verboseLogs: true

    cache: false

  testing:

    debug: false

    verboseLogs: true

    cache: true

  preproduction:

    debug: false

    verboseLogs: false

    cache: true

  production:

    debug: false

    verboseLogs: false

    cache: true

# ============================================================================
# PERFILES
# ============================================================================

profiles:

  default

  administrator

  legal

  technical

  auditor

  developer

# ============================================================================
# CONFIGURACIÓN DINÁMICA
# ============================================================================

dynamicConfiguration:

  allowReload: true

  reloadWithoutRestart: true

  validateBeforeReload: true

  rollbackOnFailure: true

# ============================================================================
# CONFIGURACIÓN DEL MOTOR DE REGLAS
# ============================================================================

ruleEngineConfiguration:

  strictMode: true

  deterministicExecution: true

  stopOnCriticalError: true

  enableOptimization: true

  explainExecution: true

# ============================================================================
# CONFIGURACIÓN DEL RAZONADOR
# ============================================================================

inferenceConfiguration:

  forwardChaining: true

  backwardChaining: true

  mixedReasoning: true

  priorityResolution: true

# ============================================================================
# CONFIGURACIÓN DOCUMENTAL
# ============================================================================

documentConfiguration:

  automaticGeneration: true

  validateOutput: true

  preserveVersions: true

  useOfficialTemplates: true

# ============================================================================
# CONFIGURACIÓN DE SEGURIDAD
# ============================================================================

securityConfiguration:

  encryptionEnabled: true

  roleBasedAccess: true

  auditEnabled: true

  integrityVerification: true

# ============================================================================
# CONFIGURACIÓN DE RENDIMIENTO
# ============================================================================

performanceConfiguration:

  cacheEnabled: true

  preloadKnowledge: true

  lazyInitialization: false

  optimizeQueries: true

# ============================================================================
# CONFIGURACIÓN DE AUDITORÍA
# ============================================================================

auditConfiguration:

  enabled: true

  persistentAudit: true

  detailedLogs: true

  immutableAudit: true

# ============================================================================
# CONFIGURACIÓN DE INTEROPERABILIDAD
# ============================================================================

interoperabilityConfiguration:

  asynchronousMode: true

  retryFailedOperations: true

  validateResponses: true

  secureConnections: true

# ============================================================================
# CONFIGURACIÓN DEL CONOCIMIENTO
# ============================================================================

knowledgeConfiguration:

  preloadOntology: true

  preloadTaxonomy: true

  preloadRules: true

  preloadDoctrine: true

  preloadJurisprudence: true

# ============================================================================
# CONFIGURACIÓN DE VALIDACIÓN
# ============================================================================

validationConfiguration:

  validateSchemas: true

  validateKnowledge: true

  validateRules: true

  validateDependencies: true

# ============================================================================
# ORIGEN DE CONFIGURACIÓN
# ============================================================================

configurationSources:

  internalConfiguration

  environmentVariables

  configurationFiles

  secureSecrets

# ============================================================================
# POLÍTICAS
# ============================================================================

configurationPolicies:

  unknownParameter: error

  duplicatedParameter: warning

  invalidValue: error

  missingMandatoryValue: critical

# ============================================================================
# MÉTRICAS
# ============================================================================

configurationMetrics:

  loadedConfigurations: true

  configurationReloads: true

  configurationErrors: true

  rollbackOperations: true

# ============================================================================
# AUDITORÍA
# ============================================================================

configurationAudit:

  enabled: true

  registerConfigurationChanges: true

  registerReloads: true

  registerValidation: true

  registerErrors: true

# ============================================================================
# FIN PARTE 6 DE 25
# ============================================================================

# ============================================================================
# KNOWLEDGE LOADER
# CARGA DE LA BASE DE CONOCIMIENTO
# ============================================================================

knowledgeLoader:

  enabled: true

  preloadKnowledge: true

  validateKnowledge: true

  buildIndexes: true

  failOnCriticalError: true

# ============================================================================
# OBJETIVOS
# ============================================================================

knowledgeObjectives:

  loadOntology: true

  loadTaxonomy: true

  loadRules: true

  loadDoctrine: true

  loadJurisprudence: true

  loadConsultiveReports: true

  guaranteeConsistency: true

# ============================================================================
# ORDEN DE CARGA
# ============================================================================

loadingSequence:

  - ontology

  - taxonomy

  - glossary

  - cpv

  - legalRules

  - doctrine

  - jurisprudence

  - consultiveReports

  - indexes

# ============================================================================
# REPOSITORIOS
# ============================================================================

repositories:

  ontology:

    path: knowledge/ontology

    mandatory: true

  taxonomy:

    path: knowledge/taxonomy

    mandatory: true

  glossary:

    path: knowledge/glossary

    mandatory: true

  rules:

    path: knowledge/rules

    mandatory: true

  doctrine:

    path: knowledge/doctrine

    mandatory: false

  jurisprudence:

    path: knowledge/jurisprudence

    mandatory: false

  consultiveReports:

    path: knowledge/consultive-reports

    mandatory: false

# ============================================================================
# VALIDACIONES
# ============================================================================

knowledgeValidation:

  verifySchemas: true

  verifyIdentifiers: true

  verifyReferences: true

  verifyRelationships: true

  verifyDuplicates: true

  verifyMandatoryFields: true

# ============================================================================
# INDEXACIÓN
# ============================================================================

indexBuilder:

  enabled: true

  buildOntologyIndex: true

  buildRuleIndex: true

  buildArticleIndex: true

  buildCPVIndex: true

  buildConceptIndex: true

  buildReferenceIndex: true

# ============================================================================
# CACHÉ
# ============================================================================

knowledgeCache:

  enabled: true

  preloadMostUsedRules: true

  preloadOntology: true

  preloadTaxonomy: true

  preloadCPV: true

  preloadLegalArticles: true

# ============================================================================
# RESOLUCIÓN DE REFERENCIAS
# ============================================================================

referenceResolver:

  enabled: true

  resolveInternalReferences: true

  resolveLegalReferences: true

  resolveCrossReferences: true

  detectBrokenReferences: true

# ============================================================================
# CONTROL DE VERSIONES
# ============================================================================

knowledgeVersionControl:

  enabled: true

  verifyCompatibility: true

  rejectUnsupportedVersion: true

  preservePreviousVersion: true

# ============================================================================
# CONTROL DE CALIDAD
# ============================================================================

qualityControl:

  enabled: true

  validateSemanticConsistency: true

  validateLegalConsistency: true

  validateCrossRelations: true

  generateQualityReport: true

# ============================================================================
# ESTADÍSTICAS
# ============================================================================

knowledgeStatistics:

  countConcepts: true

  countRules: true

  countArticles: true

  countDoctrine: true

  countJurisprudence: true

  countReports: true

# ============================================================================
# POLÍTICAS
# ============================================================================

knowledgePolicies:

  duplicatedIdentifier: error

  missingReference: error

  invalidSchema: critical

  orphanConcept: warning

  obsoleteRule: warning

# ============================================================================
# AUDITORÍA
# ============================================================================

knowledgeAudit:

  enabled: true

  registerLoadedRepositories: true

  registerValidationResults: true

  registerIndexes: true

  registerErrors: true

  registerStatistics: true

# ============================================================================
# RESULTADO
# ============================================================================

knowledgeResult:

  success: knowledgeReady

  failure: knowledgeLoadFailed

# ============================================================================
# FIN PARTE 7 DE 25
# ============================================================================

# ============================================================================
# REASONING MANAGER
# GESTOR CENTRAL DE RAZONAMIENTO
# ============================================================================

reasoningManager:

  enabled: true

  centralizedReasoning: true

  deterministicExecution: true

  explainEveryConclusion: true

  preserveTraceability: true

# ============================================================================
# OBJETIVOS
# ============================================================================

reasoningObjectives:

  legalReasoning: true

  proceduralReasoning: true

  documentaryReasoning: true

  predictiveReasoning: true

  optimizationReasoning: true

# ============================================================================
# TIPOS DE RAZONAMIENTO
# ============================================================================

reasoningModes:

  deterministic

  forwardChaining

  backwardChaining

  hybridReasoning

  legalInterpretation

  simulation

  optimization

# ============================================================================
# RAZONAMIENTO JURÍDICO
# ============================================================================

legalReasoning:

  enabled: true

  applyNormativeHierarchy: true

  resolveConflicts: true

  evaluateExceptions: true

  justifyConclusions: true

# ============================================================================
# RAZONAMIENTO PROCEDIMENTAL
# ============================================================================

proceduralReasoning:

  enabled: true

  analyseWorkflow: true

  detectMissingSteps: true

  detectIncorrectSequence: true

  proposeCorrections: true

# ============================================================================
# RAZONAMIENTO DOCUMENTAL
# ============================================================================

documentReasoning:

  enabled: true

  verifyRequiredDocuments: true

  detectMissingDocuments: true

  verifyConsistency: true

  validateDocumentRelations: true

# ============================================================================
# RAZONAMIENTO PREDICTIVO
# ============================================================================

predictiveReasoning:

  enabled: true

  estimateExecutionTime: true

  estimateAdministrativeLoad: true

  estimateRisk: true

  estimateComplexity: true

# ============================================================================
# RAZONAMIENTO DE OPTIMIZACIÓN
# ============================================================================

optimizationReasoning:

  enabled: true

  minimiseAdministrativeWork: true

  minimiseRisk: true

  maximiseLegalCompliance: true

  maximiseReuse: true

# ============================================================================
# RESOLUCIÓN DE CONFLICTOS
# ============================================================================

conflictResolution:

