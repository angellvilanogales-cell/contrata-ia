# ============================================================================
# CONTRATA-IA
# RULE ENGINE
# NÚCLEO DEL MOTOR DE REGLAS
# ---------------------------------------------------------------------------
# Archivo:
# knowledge/rule-engine/00-core.rules.yaml
#
# Este fichero define el comportamiento del motor de inferencia.
# No contiene reglas jurídicas específicas.
# Contiene la forma en que el motor las ejecuta.
# ============================================================================

metadata:

  id: CORE.RULEENGINE

  nombre: Motor Central de Reglas

  version: 1.0.0

  estado: PRODUCCION

  propietario: CONTRATA-IA

  descripcion: >

    Núcleo del sistema experto encargado de ejecutar las reglas
    jurídicas, documentales, económicas y administrativas del
    expediente de contratación.

# ============================================================================
# CONFIGURACIÓN GENERAL
# ============================================================================

engine:

  enabled: true

  inference: true

  deterministic: true

  traceExecution: true

  explainResults: true

  validateInputs: true

  validateOutputs: true

  stopOnCriticalError: true

  cacheResults: true

  learningEnabled: true

# ============================================================================
# MODOS DE FUNCIONAMIENTO
# ============================================================================

executionModes:

  - VALIDACION

  - RECOMENDACION

  - SIMULACION

  - PRODUCCION

  - AUDITORIA

# ============================================================================
# PRIORIDADES
# ============================================================================

prioridades:

  critica: 1000

  maxima: 900

  muyAlta: 800

  alta: 700

  media: 500

  baja: 300

  informativa: 100

# ============================================================================
# RESULTADOS POSIBLES
# ============================================================================

resultados:

  continuar

  detener

  bloquear

  advertir

  informar

  recomendar

  corregir

  solicitarRevision

# ============================================================================
# TIPOS DE REGLA
# ============================================================================

tipos:

  VALIDACION

  DECISION

  OBLIGACION

  PROHIBICION

  RECOMENDACION

  CALCULO

  INFERENCIA

  DOCUMENTACION

  CONTROL

# ============================================================================
# CATEGORÍAS DEL SISTEMA
# ============================================================================

categorias:

  IDENTIFICACION

  OBJETO

  CPV

  PROCEDIMIENTO

  PUBLICIDAD

  SOLVENCIA

  CLASIFICACION

  LOTES

  GARANTIAS

  CRITERIOS

  ADJUDICACION

  EJECUCION

  RECEPCION

  LIQUIDACION

  RECURSOS

  TRANSPARENCIA

  VALIDACION

  AUDITORIA

# ============================================================================
# FIN PARTE 1 DE 30
# ============================================================================

# ============================================================================
# MODELO DE EVALUACIÓN
# ============================================================================

evaluation:

  strategy: FORWARD_CHAINING

  allowBackwardInference: true

  recursiveEvaluation: true

  maxIterations: 5000

  stopWhenStable: true

  detectCircularDependencies: true

  cacheIntermediateResults: true

# ============================================================================
# FLUJO GENERAL
# ============================================================================

workflow:

  - cargarContexto

  - validarEntradas

  - cargarReglas

  - ordenarPrioridades

  - resolverDependencias

  - ejecutarInferencia

  - validarResultados

  - generarExplicacion

  - registrarAuditoria

  - devolverResultado

# ============================================================================
# RESOLUCIÓN DE CONFLICTOS
# ============================================================================

conflictResolution:

  strategy: PRIORIDAD

  secondary: ESPECIFICIDAD

  tertiary: FECHA_REGLA

  quaternary: ORDEN_DECLARACION

# ============================================================================
# DEPENDENCIAS
# ============================================================================

dependencies:

  enabled: true

  strictValidation: true

  stopIfMissingDependency: true

  autoResolveDependencies: true

# ============================================================================
# HERENCIA ENTRE REGLAS
# ============================================================================

inheritance:

  enabled: true

  multipleInheritance: false

  inheritConditions: true

  inheritActions: false

  inheritReferences: true

# ============================================================================
# CONTEXTO DE EVALUACIÓN
# ============================================================================

context:

  expediente

  contrato

  presupuesto

  procedimiento

  cpv

  organoContratacion

  unidadPromotora

  licitadores

  adjudicatario

  ejecucion

# ============================================================================
# ESTADOS DEL CONTEXTO
# ============================================================================

contextState:

  inicial

  validado

  evaluando

  inferido

  finalizado

  error

# ============================================================================
# VALIDACIÓN DEL CONTEXTO
# ============================================================================

contextValidation:

  requireExpediente: true

  requireObjetoContrato: true

  requireImporte: true

  requireTipoContrato: false

  requireProcedimiento: false

# ============================================================================
# TRAZABILIDAD
# ============================================================================

trace:

  enabled: true

  storeExecutionTree: true

  storeTriggeredRules: true

  storeIgnoredRules: true

  storeExecutionTime: true

  storeDependencies: true

# ============================================================================
# FIN PARTE 2 DE 30
# ============================================================================

# ============================================================================
# SISTEMA DE CONDICIONES
# ============================================================================

conditions:

  enabled: true

  shortCircuitEvaluation: true

  allowNestedConditions: true

  maxDepth: 25

  allowExpressions: true

# ============================================================================
# OPERADORES LÓGICOS
# ============================================================================

logicalOperators:

  - AND

  - OR

  - NOT

  - XOR

  - NAND

  - NOR

# ============================================================================
# OPERADORES DE COMPARACIÓN
# ============================================================================

comparisonOperators:

  - EQUALS

  - NOT_EQUALS

  - GREATER_THAN

  - GREATER_OR_EQUAL

  - LESS_THAN

  - LESS_OR_EQUAL

  - BETWEEN

  - NOT_BETWEEN

  - IN

  - NOT_IN

  - EXISTS

  - NOT_EXISTS

  - EMPTY

  - NOT_EMPTY

# ============================================================================
# OPERADORES DE TEXTO
# ============================================================================

textOperators:

  - CONTAINS

  - NOT_CONTAINS

  - STARTS_WITH

  - ENDS_WITH

  - REGEX

# ============================================================================
# OPERADORES DE FECHAS
# ============================================================================

dateOperators:

  - BEFORE

  - AFTER

  - TODAY

  - WITHIN_DAYS

  - EXPIRED

# ============================================================================
# OPERADORES NUMÉRICOS
# ============================================================================

numericOperators:

  - SUM

  - SUBTRACT

  - MULTIPLY

  - DIVIDE

  - MOD

  - ROUND

  - FLOOR

  - CEIL

# ============================================================================
# EVALUACIÓN DE EXPRESIONES
# ============================================================================

expressions:

  enabled: true

  allowParenthesis: true

  allowFunctions: true

  allowVariables: true

  allowConstants: true

# ============================================================================
# FUNCIONES DISPONIBLES
# ============================================================================

functions:

  - MIN

  - MAX

  - AVG

  - COUNT

  - LENGTH

  - ABS

  - UPPER

  - LOWER

  - TRIM

  - CONCAT

# ============================================================================
# VARIABLES DE CONTEXTO
# ============================================================================

variables:

  expediente.id

  expediente.estado

  contrato.tipo

  contrato.objeto

  contrato.importe

  contrato.duracion

  contrato.cpv

  procedimiento.tipo

  procedimiento.sara

  procedimiento.publicidad

  adjudicacion.estado

  ejecucion.estado

# ============================================================================
# CONSTANTES DEL SISTEMA
# ============================================================================

constants:

  TRUE

  FALSE

  NULL

  EMPTY

# ============================================================================
# VALIDACIÓN DE CONDICIONES
# ============================================================================

conditionValidation:

  validateSyntax: true

  validateVariables: true

  validateOperators: true

  validateFunctions: true

  stopOnSyntaxError: true

# ============================================================================
# FIN PARTE 3 DE 30
# ============================================================================

# ============================================================================
# SISTEMA DE ACCIONES
# ============================================================================

actions:

  enabled: true

  validateActions: true

  executeSequentially: true

  allowConditionalExecution: true

  rollbackOnCriticalError: true

# ============================================================================
# TIPOS DE ACCIONES
# ============================================================================

actionTypes:

  - SET_VALUE

  - COPY_VALUE

  - CALCULATE

  - GENERATE

  - VALIDATE

  - BLOCK

  - ALLOW

  - REQUIRE

  - REGISTER

  - LOG

  - NOTIFY

  - EXECUTE

  - INVOKE_RULE

# ============================================================================
# EFECTOS POSIBLES
# ============================================================================

effects:

  - CONTINUE

  - STOP

  - BLOCK_PROCESS

  - WARNING

  - ERROR

  - INFO

  - SUCCESS

  - REVIEW_REQUIRED

# ============================================================================
# MODIFICACIÓN DEL CONTEXTO
# ============================================================================

contextUpdate:

  enabled: true

  allowOverwrite: false

  keepHistory: true

  createSnapshot: true

  validateConsistency: true

# ============================================================================
# PROPAGACIÓN DE RESULTADOS
# ============================================================================

resultPropagation:

  enabled: true

  updateDependentRules: true

  reevaluateConditions: true

  notifyObservers: true

# ============================================================================
# EJECUCIÓN DE REGLAS
# ============================================================================

execution:

  sequential: true

  parallelAllowed: false

  transactional: true

  rollbackEnabled: true

  saveExecutionTrace: true

# ============================================================================
# ORDEN DE EJECUCIÓN
# ============================================================================

executionOrder:

  - VALIDAR

  - CALCULAR

  - INFERIR

  - ACTUALIZAR

  - NOTIFICAR

  - AUDITAR

# ============================================================================
# NOTIFICACIONES
# ============================================================================

notifications:

  enabled: true

  allowWarnings: true

  allowErrors: true

  allowRecommendations: true

  allowInformativeMessages: true

# ============================================================================
# AUDITORÍA DE ACCIONES
# ============================================================================

actionAudit:

  enabled: true

  recordActionName: true

  recordExecutionTime: true

  recordRuleId: true

  recordPreviousValue: true

  recordNewValue: true

  recordUser: true

# ============================================================================
# RECUPERACIÓN
# ============================================================================

recovery:

  enabled: true

  automaticRollback: true

  restorePreviousState: true

  keepSnapshots: true

# ============================================================================
# FIN PARTE 4 DE 30
# ============================================================================

# ============================================================================
# MOTOR DE INFERENCIA
# AGENDA DE REGLAS
# ============================================================================

inferenceEngine:

  enabled: true

  algorithm: FORWARD_CHAINING

  reevaluateAfterExecution: true

  detectNewFacts: true

  avoidInfiniteLoops: true

  maximumCycles: 10000

# ============================================================================
# AGENDA DE EJECUCIÓN
# ============================================================================

agenda:

  enabled: true

  dynamicPriorities: true

  reorderAfterExecution: true

  removeExecutedRules: true

  allowReactivation: true

# ============================================================================
# PRIORIZACIÓN DINÁMICA
# ============================================================================

dynamicPriority:

  enabled: true

  criteria:

    - prioridad

    - especificidad

    - dependencia

    - impacto

    - fechaCreacion

# ============================================================================
# HECHOS (FACTS)
# ============================================================================

facts:

  enabled: true

  immutableFacts: false

  keepHistory: true

  validateBeforeInsert: true

# ============================================================================
# TIPOS DE HECHOS
# ============================================================================

factTypes:

  INPUT

  DERIVED

  TEMPORARY

  CALCULATED

  EXTERNAL

# ============================================================================
# MEMORIA DE TRABAJO
# ============================================================================

workingMemory:

  enabled: true

  persistence: SESSION

  autoCleanup: true

  snapshotInterval: 100

# ============================================================================
# BASE DE CONOCIMIENTO
# ============================================================================

knowledgeBase:

  autoReload: false

  validateOnLoad: true

  checkDuplicatedRules: true

  optimizeIndexes: true

# ============================================================================
# INDEXACIÓN
# ============================================================================

indexes:

  expediente

  procedimiento

  tipoContrato

  cpv

  importe

  categoria

  prioridad

# ============================================================================
# OPTIMIZACIÓN
# ============================================================================

optimization:

  lazyEvaluation: true

  cacheConditions: true

  cacheFacts: true

  skipImpossibleBranches: true

  compileExpressions: true

# ============================================================================
# RESOLUCIÓN DE EMPATES
# ============================================================================

tieBreaker:

  first:

    prioridad

  second:

    especificidad

  third:

    antiguedad

  fourth:

    ordenCarga

# ============================================================================
# MONITORIZACIÓN
# ============================================================================

monitoring:

  enabled: true

  executionMetrics: true

  memoryMetrics: true

  timingMetrics: true

  ruleMetrics: true

# ============================================================================
# ESTADÍSTICAS
# ============================================================================

statistics:

  totalRulesExecuted: true

  averageExecutionTime: true

  averageInferenceDepth: true

  averageConditionsPerRule: true

  averageActionsPerRule: true

# ============================================================================
# FIN PARTE 5 DE 30
# ============================================================================

# ============================================================================
# MOTOR DE DEPENDENCIAS
# ÁRBOLES DE DECISIÓN
# GRAFO DE REGLAS
# ============================================================================

dependencyEngine:

  enabled: true

  buildDependencyGraph: true

  validateDependencyTree: true

  detectCircularReferences: true

  stopOnCircularReference: true

  optimizeDependencyTree: true

# ============================================================================
# GRAFO DE REGLAS
# ============================================================================

ruleGraph:

  enabled: true

  directedGraph: true

  acyclicRequired: true

  autoGenerateNodes: true

  autoGenerateEdges: true

# ============================================================================
# TIPOS DE DEPENDENCIA
# ============================================================================

dependencyTypes:

  REQUIRES

  ENABLES

  DISABLES

  BLOCKS

  IMPLIES

  EXCLUDES

  EXTENDS

# ============================================================================
# ÁRBOLES DE DECISIÓN
# ============================================================================

decisionTree:

  enabled: true

  maxDepth: 100

  pruneUnusedBranches: true

  optimizeTraversal: true

  storeExecutionPath: true

# ============================================================================
# PROPAGACIÓN DE HECHOS
# ============================================================================

factPropagation:

  enabled: true

  immediatePropagation: true

  delayedPropagation: false

  validatePropagation: true

  avoidDuplicatedFacts: true

# ============================================================================
# ACTUALIZACIÓN AUTOMÁTICA
# ============================================================================

autoRefresh:

  enabled: true

  reevaluateDependents: true

  refreshExecutionQueue: true

  refreshWorkingMemory: true

# ============================================================================
# RESOLUCIÓN DE INCOMPATIBILIDADES
# ============================================================================

conflictManager:

  enabled: true

  detectConflicts: true

  resolveAutomatically: true

  generateConflictReport: true

# ============================================================================
# TIPOS DE CONFLICTO
# ============================================================================

conflictTypes:

  DUPLICATED_RULE

  CONTRADICTORY_RESULT

  INCOMPATIBLE_ACTION

  INVALID_DEPENDENCY

  CIRCULAR_REFERENCE

  AMBIGUOUS_PRIORITY

# ============================================================================
# ESTRATEGIAS DE RESOLUCIÓN
# ============================================================================

conflictResolutionStrategies:

  PRIORITY

  MOST_SPECIFIC

  LEGAL_HIERARCHY

  LAST_UPDATE

  MANUAL_REVIEW

# ============================================================================
# JERARQUÍA NORMATIVA
# ============================================================================

legalHierarchy:

  CONSTITUCION

  DERECHO_UNION_EUROPEA

  LEY

  REAL_DECRETO

  ORDEN

  INSTRUCCION

  PLIEGO

# ============================================================================
# RESOLUCIÓN AUTOMÁTICA
# ============================================================================

automaticResolution:

  enabled: true

  useLegalHierarchy: true

  usePriority: true

  useSpecificity: true

  escalateIfUnresolved: true

# ============================================================================
# VALIDACIÓN DEL GRAFO
# ============================================================================

graphValidation:

  validateNodes: true

  validateEdges: true

  validateDependencies: true

  validateReachability: true

  validateIntegrity: true

# ============================================================================
# TRAZABILIDAD DE DEPENDENCIAS
# ============================================================================

dependencyAudit:

  enabled: true

  recordDependencyPath: true

  recordResolvedConflicts: true

  recordDecisionTree: true

  recordInferenceGraph: true

# ============================================================================
# FIN PARTE 6 DE 30
# ============================================================================

# ============================================================================
# MOTOR DE EXCEPCIONES
# GESTIÓN DE REGLAS ESPECIALES
# EXCEPCIONES NORMATIVAS
# ============================================================================

exceptionEngine:

  enabled: true

  allowExceptions: true

  validateExceptions: true

  priorityOverGeneralRules: true

  registerExceptions: true

# ============================================================================
# TIPOS DE EXCEPCIONES
# ============================================================================

exceptionTypes:

  LEGAL_EXCEPTION

  PROCEDURAL_EXCEPTION

  ECONOMIC_EXCEPTION

  TEMPORARY_EXCEPTION

  ORGANIZATIONAL_EXCEPTION

  SYSTEM_EXCEPTION

# ============================================================================
# APLICACIÓN DE EXCEPCIONES
# ============================================================================

exceptionExecution:

  executeImmediately: true

  suspendGeneralRule: true

  restoreAfterExecution: true

  validateConsistency: true

# ============================================================================
# JERARQUÍA DE EXCEPCIONES
# ============================================================================

exceptionPriority:

  legalException: 1000

  judicialDecision: 950

  europeanLaw: 900

  nationalLaw: 850

  regulatoryException: 800

  administrativeInstruction: 700

  organizationalRule: 600

# ============================================================================
# ÁMBITO DE APLICACIÓN
# ============================================================================

scope:

  GLOBAL

  CONTRACT

  PROCEDURE

  EXPEDIENTE

  DOCUMENT

  RULE

# ============================================================================
# VIGENCIA
# ============================================================================

validity:

  permanent: true

  temporary: true

  startDateRequired: false

  endDateRequired: false

  automaticExpiration: true

# ============================================================================
# SUSTITUCIÓN DE REGLAS
# ============================================================================

override:

  enabled: true

  allowOverride: true

  validateOverride: true

  keepOriginalRule: true

  recordReplacement: true

# ============================================================================
# CONDICIONES DE EXCEPCIÓN
# ============================================================================

exceptionConditions:

  mandatoryJustification: true

  mandatoryLegalReference: true

  mandatoryAudit: true

  mandatoryResponsiblePerson: true

# ============================================================================
# COMPATIBILIDAD
# ============================================================================

compatibility:

  verifyBeforeExecution: true

  detectConflicts: true

  rejectIncompatibleExceptions: true

# ============================================================================
# CONTROL DE RIESGO
# ============================================================================

riskAssessment:

  enabled: true

  evaluateLegalRisk: true

  evaluateEconomicRisk: true

  evaluateProceduralRisk: true

  calculateRiskLevel: true

# ============================================================================
# NIVELES DE RIESGO
# ============================================================================

riskLevels:

  VERY_LOW

  LOW

  MEDIUM

  HIGH

  VERY_HIGH

  CRITICAL

# ============================================================================
# DECISIÓN AUTOMÁTICA
# ============================================================================

automaticDecision:

  allowLowRisk: true

  requireValidationMediumRisk: true

  requireManualDecisionHighRisk: true

  blockCriticalRisk: true

# ============================================================================
# REGISTRO
# ============================================================================

exceptionAudit:

  enabled: true

  registerDate: true

  registerRule: true

  registerReason: true

  registerLegalReference: true

  registerResponsible: true

  registerRiskLevel: true

# ============================================================================
# FIN PARTE 7 DE 30
# ============================================================================

# ============================================================================
# MOTOR DE EVENTOS
# SISTEMA DE TRIGGERS
# BUS DE EVENTOS DEL RULE ENGINE
# ============================================================================

eventEngine:

  enabled: true

  asynchronousEvents: true

  synchronousEvents: true

  persistentEvents: true

  auditEvents: true

# ============================================================================
# EVENTOS DEL SISTEMA
# ============================================================================

systemEvents:

  - expediente.creado

  - expediente.actualizado

  - expediente.validado

  - expediente.finalizado

  - expediente.cancelado

  - regla.ejecutada

  - regla.error

  - inferencia.finalizada

# ============================================================================
# EVENTOS DOCUMENTALES
# ============================================================================

documentEvents:

  - documento.generado

  - documento.validado

  - documento.firmado

  - documento.publicado

  - documento.archivado

# ============================================================================
# EVENTOS DE LICITACIÓN
# ============================================================================

procurementEvents:

  - licitacion.iniciada

  - licitacion.publicada

  - oferta.recibida

  - oferta.valorada

  - adjudicacion.propuesta

  - adjudicacion.aprobada

# ============================================================================
# EVENTOS DE EJECUCIÓN
# ============================================================================

executionEvents:

  - contrato.iniciado

  - contrato.modificado

  - contrato.prorrogado

  - contrato.suspendido

  - contrato.finalizado

# ============================================================================
# TRIGGERS
# ============================================================================

triggers:

  enabled: true

  executeImmediately: true

  validateBeforeExecution: true

  allowMultipleTriggers: true

# ============================================================================
# TIPOS DE TRIGGER
# ============================================================================

triggerTypes:

  BEFORE_RULE

  AFTER_RULE

  BEFORE_EVENT

  AFTER_EVENT

  ON_ERROR

  ON_SUCCESS

  ON_VALIDATION

# ============================================================================
# SUSCRIPCIONES
# ============================================================================

subscriptions:

  enabled: true

  automaticRegistration: true

  automaticRemoval: true

  validateSubscribers: true

# ============================================================================
# PUBLICACIÓN DE EVENTOS
# ============================================================================

publisher:

  enabled: true

  notifySubscribers: true

  queueEvents: true

  retryFailedPublication: true

# ============================================================================
# COLA DE EVENTOS
# ============================================================================

eventQueue:

  enabled: true

  priorityQueue: true

  retryAttempts: 5

  deadLetterQueue: true

# ============================================================================
# OBSERVADORES
# ============================================================================

observers:

  enabled: true

  notifyRuleEngine: true

  notifyAuditEngine: true

  notifyLearningEngine: true

  notifyMonitoringEngine: true

# ============================================================================
# FILTROS
# ============================================================================

filters:

  allowEventFiltering: true

  filterByCategory: true

  filterByPriority: true

  filterByOrigin: true

# ============================================================================
# AUDITORÍA
# ============================================================================

eventAudit:

  enabled: true

  recordPublisher: true

  recordSubscribers: true

  recordExecutionTime: true

  recordPayload: true

  recordErrors: true

# ============================================================================
# FIN PARTE 8 DE 30
# ============================================================================

# ============================================================================
# MOTOR DE SEGURIDAD
# CONTROL DE ACCESO
# AUTORIZACIONES
# ENS
# ============================================================================

securityEngine:

  enabled: true

  authenticationRequired: true

  authorizationRequired: true

  auditEnabled: true

  denyByDefault: true

# ============================================================================
# ROLES DEL SISTEMA
# ============================================================================

roles:

  ADMIN

  ORGANO_CONTRATACION

  RESPONSABLE_CONTRATO

  UNIDAD_PROMOTORA

  TRAMITADOR

  SECRETARIA

  INTERVENCION

  ASESORIA_JURIDICA

  CONSULTA

  SISTEMA

# ============================================================================
# NIVELES DE ACCESO
# ============================================================================

accessLevels:

  NONE

  READ

  WRITE

  UPDATE

  DELETE

  APPROVE

  SIGN

  ADMIN

# ============================================================================
# PERMISOS
# ============================================================================

permissions:

  crearExpediente

  modificarExpediente

  eliminarExpediente

  consultarExpediente

  generarDocumento

  modificarDocumento

  firmarDocumento

  publicarDocumento

  validarDocumento

  ejecutarMotor

  administrarSistema

# ============================================================================
# VALIDACIÓN DE OPERACIONES
# ============================================================================

operationValidation:

  validateUser: true

  validateRole: true

  validatePermission: true

  validateContext: true

  validateSession: true

# ============================================================================
# SESIONES
# ============================================================================

session:

  required: true

  timeoutMinutes: 30

  renewAutomatically: true

  invalidateOnLogout: true

# ============================================================================
# PROTECCIÓN DE OPERACIONES
# ============================================================================

protectedOperations:

  aprobarExpediente

  firmarDocumento

  modificarImporte

  modificarProcedimiento

  modificarCPV

  eliminarDocumento

  eliminarExpediente

# ============================================================================
# DOBLE VALIDACIÓN
# ============================================================================

doubleValidation:

  enabled: true

  requiredForCriticalActions: true

  validateResponsible: true

# ============================================================================
# TRAZABILIDAD
# ============================================================================

securityAudit:

  enabled: true

  registerLogin: true

  registerLogout: true

  registerAccess: true

  registerDeniedAccess: true

  registerPermissionChanges: true

  registerCriticalOperations: true

# ============================================================================
# INTEGRIDAD
# ============================================================================

integrity:

  verifyBeforeExecution: true

  detectManipulation: true

  checksumValidation: true

  immutableAudit: true

# ============================================================================
# POLÍTICAS
# ============================================================================

policies:

  leastPrivilege: true

  separationOfDuties: true

  mandatoryAudit: true

  denyUnknownOperations: true

# ============================================================================
# CUMPLIMIENTO
# ============================================================================

compliance:

  ENS: true

  ENI: true

  RGPD: true

  LOPDGDD: true

# ============================================================================
# FIN PARTE 9 DE 30
# ============================================================================

# ============================================================================
# MOTOR DE AUDITORÍA AVANZADA
# TRAZABILIDAD COMPLETA
# REGISTRO CRONOLÓGICO
# ============================================================================

auditEngine:

  enabled: true

  immutableAudit: true

  chronologicalOrder: true

  digitalEvidence: true

  integrityValidation: true

# ============================================================================
# TIPOS DE AUDITORÍA
# ============================================================================

auditTypes:

  ACCESS

  RULE_EXECUTION

  DECISION

  DOCUMENT

  SECURITY

  SYSTEM

  VALIDATION

  ERROR

  SIGNATURE

# ============================================================================
# EVENTOS AUDITABLES
# ============================================================================

auditEvents:

  expediente.creado

  expediente.modificado

  expediente.validado

  expediente.firmado

  expediente.publicado

  expediente.archivado

  regla.ejecutada

  regla.omitida

  regla.bloqueada

  regla.error

# ============================================================================
# INFORMACIÓN REGISTRADA
# ============================================================================

auditData:

  recordDate: true

  recordTime: true

  recordUser: true

  recordRole: true

  recordSession

  recordRule

  recordAction

  recordResult

  recordDuration

  recordOrigin

# ============================================================================
# TRAZABILIDAD
# ============================================================================

traceability:

  enabled: true

  fullDecisionTree: true

  dependencyGraph: true

  executionPath: true

