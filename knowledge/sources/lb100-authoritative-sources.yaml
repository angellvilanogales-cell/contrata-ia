quarantine:
  rule: Todo conocimiento histórico sin sourceId resoluble y autoridad acreditada permanece fuera de decisiones productivas automáticas.
  allowedUses:
    - búsqueda orientativa
    - comparación
    - detección de posibles reglas a verificar
  forbiddenUses:
    - decidir automáticamente una cláusula material
    - atribuir vigencia normativa
    - afirmar que un documento es modelo oficial
