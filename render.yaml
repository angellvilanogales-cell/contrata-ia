services:
  - type: web
    name: contrata-ia-lb7-pilot
    runtime: docker
    region: frankfurt
    plan: starter
    branch: agent/lb7-qa-seguridad-v1
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CONTRATA_IA_AUTH_REQUIRED
        value: "1"
      - key: CONTRATA_IA_DATA_DIR
        value: /data/contrata-ia
      - key: CONTRATA_IA_TEMPLATE_DIR
        value: /data/contrata-ia/templates
      - key: CONTRATA_IA_ADMIN_TOKEN
        sync: false
    disk:
      name: contrata-ia-pilot-data
      mountPath: /data/contrata-ia
      sizeGB: 1
