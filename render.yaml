services:
  - type: web
    name: contrata-ia-lb7-pilot
    runtime: docker
    region: frankfurt
    plan: free
    branch: agent/lb91-universalizacion-operativa
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CONTRATA_IA_AUTH_REQUIRED
        value: "1"
      - key: CONTRATA_IA_DATA_DIR
        value: /data/contrata-ia
      - key: CONTRATA_IA_TEMPLATE_DIR
        value: /data/contrata-ia/templates
      - key: CONTRATA_IA_ADMIN_TOKEN
        sync: false
      - key: CONTRATA_IA_PERSISTENCE_URL
        value: https://lwfpxgqarwjrjxwijftt.supabase.co/functions/v1/contrata-ia-persistence
      - key: CONTRATA_IA_PERSISTENCE_TOKEN
        sync: false
